name: CI Vulkan/GL/D3D11 [idle waits + driver harness]

# Two checks on the Vulkan driver, both born from the same bug: a
# vkQueuePresentKHR under queue_lock waiting for GPU work that a
# hardware core could only submit through lock_queue (parallel-GS /
# Granite stopped the frontend that way). Every vkQueueWaitIdle and
# vkDeviceWaitIdle in the driver had the same shape - a whole-queue
# drain, under the lock the core needs, on shader change, overlay
# load, font free and swapchain resize - and all of them were replaced
# by waits on the driver's own fences.
#
# 1. Idle-wait check: tools/vulkan_idle_wait_check.c fails on any
#    vkQueueWaitIdle/vkDeviceWaitIdle in the Vulkan code that is not
#    on tools/vulkan_idle_wait_allow.list, and on a stale entry.
#    tools/d3d12_idle_wait_check.c holds the D3D12 driver to the same:
#    a queue drain or a fence wait not on
#    tools/d3d12_idle_wait_allow.list fails, so the frame paths, which
#    wait only for their predecessor's own signal, stay that way. A
#    ResizeBuffers with no drain before it in its function fails too:
#    that signal is behind the frame's list, not its Present, and the
#    swap chain resized on a software core's first frame while the
#    Present still held a back buffer.
#
# 2. Validation harness: the threaded-video harness (real frontend,
#    real driver, only main() replaced) run on the Vulkan driver over
#    lavapipe under Xvfb, with the tree built VULKAN_DEBUG=1 so
#    VK_LAYER_KHRONOS_validation is loaded. The lanes exercise driver
#    reinit under the wrapper, geometry changes, async texture loads,
#    font marshalling, present repeat and resize; the layer turns a
#    texture destroyed while a frame still samples it, a barrier
#    inside a render pass, or an object leaked at device teardown into
#    a logged error, and the check-vulkan target fails on any. Those
#    three were the pre-existing findings the lane produced on its
#    first run.
#
# 3. TSan harness: the same lanes on the same driver, built with
#    -fsanitize=thread. The null-driver TSan job never runs driver
#    code on the video thread, so a plain field shared between the
#    frame thread and a driver's frame (the shader chains'
#    FrameTimeDelta was one) only shows up here. The layer and the
#    ICD are not instrumented and are suppressed; frontend races fail.
#    An address,undefined build of the same runs beside it, and the
#    context-only vulkan_validation sample runs on its own.
#
# 5. D3D11 harness: the same lanes on the d3d11 driver, on a Windows
#    runner through MSYS2's MinGW64 build of the tree (no Qt, so main
#    stays in retroarch.o for the harness to replace) and the software
#    adapter the runner exposes (Microsoft Basic Render Driver, which
#    is WARP). The first real-driver coverage the Windows drivers get.
#
# 4. GL harness: the same lanes on the gl and glcore drivers over
#    llvmpipe (LIBGL_ALWAYS_SOFTWARE=1), release and TSan. A GL
#    context is owned by one thread at a time, so anything the
#    frontend does against the driver from the wrong thread is an X
#    BadAccess here rather than a corruption elsewhere; the first run
#    caught the OSD font rebuild doing exactly that.
#
# 6. Teardown-order check: tools/vulkan_teardown_order_check.c holds
#    the order the driver retires a frame's objects in - command
#    pools, then descriptor pools, then the pipelines that own the set
#    layout - and the rule that destroying a descriptor pool is what
#    frees its sets. The other order is legal Vulkan and the
#    validation layer passes it, so the harness lanes above cannot see
#    it; a driver that walks its own back references as a pool is
#    destroyed faults inside vkDestroyDescriptorPool at exit, which is
#    what MoltenVK did.
#
# 7. OpenXR build: the validation harness once more on a tree
#    configured --enable-openxr, without a headset. The headset checks
#    sit in the frame path's present chain, so the window path is only
#    proven in a build that compiles them; the GPU readback lane is
#    where a misplaced one sent a read-back frame to present twice.
#
# 8. SDL3 views: the views e2e cases on the SDL3 driver, against an SDL3
#    built from a pinned release with its renderer, the tree configured
#    with SDL3 in place of SDL2.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  wait-checkers:
    name: Vulkan and D3D12 wait and teardown checkers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Vulkan idle-wait allowlist, self-test
        shell: bash
        run: |
          set -eu
          tools/check.sh tools/vulkan_idle_wait_check.c --selftest

      - name: Vulkan idle-wait allowlist, tree check
        # Each checker runs even when one before it fails.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -eu
          tools/check.sh tools/vulkan_idle_wait_check.c

      - name: D3D12 wait allowlist, self-test
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -eu
          tools/check.sh tools/d3d12_idle_wait_check.c --selftest

      - name: D3D12 wait allowlist, tree check
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -eu
          tools/check.sh tools/d3d12_idle_wait_check.c

      - name: Vulkan teardown order, self-test
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -eu
          tools/check.sh tools/vulkan_teardown_order_check.c --selftest

      - name: Vulkan teardown order, tree check
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -eu
          tools/check.sh tools/vulkan_teardown_order_check.c

  vulkan-validation-harness:
    name: Threaded-video harness on Vulkan (lavapipe, validation layer)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          pkgs="build-essential libxkbcommon-dev libx11-xcb-dev libxcb1-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libxv-dev xvfb x11-utils zlib1g-dev libfreetype6-dev libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers vulkan-tools libasound2-dev libgl1-mesa-dri libgl-dev imagemagick libsdl2-dev"
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update failed (attempt $i); retrying in 10s"
            sleep 10
          done
          # Fetch first, under a bound: a download is safe to stop and
          # resumes, an install is not. A mirror that stalls is left for
          # the main archive on the next attempt.
          for i in 1 2 3; do
            sudo timeout 240 apt-get install -y --download-only \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              $pkgs && break
            [ $i = 3 ] && exit 1
            echo "package download failed or stalled (attempt $i); retrying from archive.ubuntu.com"
            if [ ! -d /etc/apt/ra-orig ]; then
              sudo mkdir /etc/apt/ra-orig
              sudo cp -a /etc/apt/sources.list.d /etc/apt/ra-orig/
              [ ! -f /etc/apt/sources.list ] || sudo cp -a /etc/apt/sources.list /etc/apt/ra-orig/
            fi
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              [ -f "$f" ] || continue
              sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' \
                -e 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            done
            # A refresh cut short or refused leaves apt no package lists: it
            # is retried, without translations or command-not-found data, and
            # the mirror is put back when the archive will not answer either.
            upd="-o Acquire::Retries=3 -o Acquire::http::Timeout=30
              -o Acquire::Languages=none
              -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false
              -o APT::Update::Error-Mode=any"
            ok=0
            for j in 1 2; do
              sudo timeout 120 apt-get update -y $upd && { ok=1; break; }
            done
            if [ $ok = 0 ]; then
              sudo rm -rf /etc/apt/sources.list.d
              sudo cp -a /etc/apt/ra-orig/sources.list.d /etc/apt/
              [ ! -f /etc/apt/ra-orig/sources.list ] || sudo cp -a /etc/apt/ra-orig/sources.list /etc/apt/
              sudo rm -rf /etc/apt/ra-orig
              sudo timeout 120 apt-get update -y $upd || true
            fi
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-

      - name: Enable ccache
        run: |
          set -eu
          command -v ccache >/dev/null 2>&1 || sudo apt-get install -y -qq ccache
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 250M
          ccache -z

      - name: Configure
        # Non-Qt, as the harness requires (with Qt, main() lives in
        # ui_qt.o). Everything else at its default so the Vulkan driver
        # is built with every path a release build has.
        run: |
          ./configure --disable-qt
          grep -q '^HAVE_VULKAN = 1' config.mk

      - name: Build with VULKAN_DEBUG=1
        # VULKAN_DEBUG enables VK_LAYER_KHRONOS_validation and the
        # debug messenger that reports through RARCH_ERR. It is a
        # tree-wide define: vulkan_context_t carries a member under it,
        # so every TU that includes vulkan_common.h must see it.
        # GFX_INSTRUMENT counts what the image and surface paths do -
        # uploads, in-place updates, allocating posts, copies - so the
        # harness lanes below can hold the budgets the paths are
        # written to and print what a run cost. This is the one leg
        # that carries it: under a sanitizer the timings mean nothing,
        # and the counters change no behaviour.
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) VULKAN_DEBUG=1 GFX_INSTRUMENT=1
          test -x retroarch

      - name: Run the harness on Vulkan under the validation layer
        shell: bash
        run: |
          set -eu
          Xvfb :99 -screen 0 640x480x24 &
          for i in $(seq 1 15); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          export DISPLAY=:99
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          # The harness build reuses the tree's own compile and link
          # lines, so it has to name the same build: VK_DEBUG=1. Its
          # surface and overlay-page lanes run the driver's real
          # in-place texture update and its borrowed-texture overlay
          # page here, under the validation layer, and with the tree
          # built GFX_INSTRUMENT=1 they print their baselines and hold
          # the budgets: one texture per streaming surface, no
          # allocation per post, no copy, a 4K submit that stays a
          # descriptor hand-off.
          SAN=none VK_DEBUG=1 GFX_INSTRUMENT=1 CYCLES=2 make -C samples/gfx/threaded_video check-vulkan
          # Once more with the harness core pushing XRGB8888: the
          # driver samples a linear 32-bit image itself where it
          # converts RGB565 with a compute pass, so a lent frame and
          # a window into it take the other upload path (the one
          # beetle-psx takes).
          HARNESS_CORE_XRGB8888=1 SAN=none VK_DEBUG=1 GFX_INSTRUMENT=1 CYCLES=1 make -C samples/gfx/threaded_video check-vulkan
          # And with the first map of a buffer-chain block refused on
          # each device: the driver must not suballocate from a buffer
          # it could not map.
          SAN=none VK_DEBUG=1 GFX_INSTRUMENT=1 CYCLES=1 make -C samples/gfx/threaded_video check-vulkan-mapfail
          # And with the harness core as a Vulkan hardware core, which
          # runs its own lanes alone: the core's image must not be drawn
          # from once the core has destroyed it - at a content close,
          # unthreaded and under the wrapper, and after a set_image(NULL)
          # - a dupe of a hardware frame must not re-submit a fence that
          # is already signalled, and a frame the push replaces must not
          # leave its semaphore signalled for the core to signal again.
          # Each is a validation error here, and on lavapipe a crash.
          HARNESS_CORE_HW_VULKAN=1 SAN=none VK_DEBUG=1 GFX_INSTRUMENT=1 CYCLES=1 make -C samples/gfx/threaded_video check-vulkan
          make -C samples/gfx/threaded_video clean
          # And as a core that creates the device itself, through the
          # negotiation interface's create_device - Beetle PSX, for one.
          # That device has the extensions the frontend requires and
          # none of the optional ones it adds to a device of its own, so
          # anything the driver or the filter chain does that leans on
          # an optional extension is a validation error here and nowhere
          # else. The filter chain's mirror-clamp samplers were.
          HARNESS_CORE_HW_VULKAN=2 SAN=none VK_DEBUG=1 GFX_INSTRUMENT=1 CYCLES=1 make -C samples/gfx/threaded_video check-vulkan
          make -C samples/gfx/threaded_video clean
          # And as a core that caches its context across a video reinit
          # (Azahar): the instance comes back from the cache with what
          # it was created with, HDR support included.
          HARNESS_CORE_HW_VULKAN=3 SAN=none VK_DEBUG=1 GFX_INSTRUMENT=1 CYCLES=1 make -C samples/gfx/threaded_video check-vulkan
          make -C samples/gfx/threaded_video clean

      - name: Views on gl, glcore, Vulkan and SDL2, end to end (Xvfb, llvmpipe, lavapipe)
        shell: bash
        run: |
          set -eu
          # The views compositor (gfx/video_views_draw.h) as gl, glcore,
          # Vulkan and SDL2 instantiate it: the video_views test core's map in
          # each stereo mode, a view per eye, the blend canvas, views
          # read exactly out of the frame in every way the drivers copy
          # or draw them, the UI layer per eye with the menu open, and a
          # pointer mapped back through it. Each case runs on an Xvfb of
          # its own; Vulkan here under the validation layer.
          make -C samples/cores/video_views
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export LIBGL_ALWAYS_SOFTWARE=1
          RA_E2E_XVFB=1 RA_E2E_ONLY='^(3ds-sbs-full|3ds-sbs-half|3ds-top-bottom|3ds-anaglyph|3ds-interlaced|ds-horizontal|exact-3ds|crop-threaded-menu|pointer-sbs-full)$' \
            python3 samples/cores/video_views/e2e/run.py ./retroarch \
            "$RUNNER_TEMP/views-e2e" gl glcore vulkan sdl2

      - name: ccache statistics
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ccache -sv

      - name: Save ccache
        # Only master's pushes keep a cache: pull requests restore
        # master's, so one push does not evict the next one's.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}

  vulkan-validation-openxr:
    name: Threaded-video harness on Vulkan built with OpenXR (lavapipe, validation layer)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          pkgs="build-essential libxkbcommon-dev libx11-xcb-dev libxcb1-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libxv-dev xvfb x11-utils zlib1g-dev libfreetype6-dev libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers vulkan-tools libasound2-dev"
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update failed (attempt $i); retrying in 10s"
            sleep 10
          done
          # Fetch first, under a bound: a download is safe to stop and
          # resumes, an install is not. A mirror that stalls is left for
          # the main archive on the next attempt.
          for i in 1 2 3; do
            sudo timeout 240 apt-get install -y --download-only \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              $pkgs && break
            [ $i = 3 ] && exit 1
            echo "package download failed or stalled (attempt $i); retrying from archive.ubuntu.com"
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              [ -f "$f" ] || continue
              sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' \
                -e 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            done
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-

      - name: Enable ccache
        run: |
          set -eu
          command -v ccache >/dev/null 2>&1 || sudo apt-get install -y -qq ccache
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 250M
          ccache -z

      - name: Configure
        # OpenXR is opt-in. With it the frame path carries the headset
        # checks in its present chain while the window still presents,
        # which the default build above never compiles.
        run: |
          ./configure --disable-qt --enable-openxr
          grep -q '^HAVE_VULKAN = 1' config.mk
          grep -q '^HAVE_OPENXR = 1' config.mk

      - name: Build with VULKAN_DEBUG=1
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) VULKAN_DEBUG=1
          test -x retroarch

      - name: Run the harness on Vulkan under the validation layer
        shell: bash
        run: |
          set -eu
          Xvfb :99 -screen 0 640x480x24 &
          for i in $(seq 1 15); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          export DISPLAY=:99
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          SAN=none VK_DEBUG=1 CYCLES=1 make -C samples/gfx/threaded_video check-vulkan
          make -C samples/gfx/threaded_video clean

      - name: ccache statistics
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ccache -sv

      - name: Save ccache
        # Only master's pushes keep a cache: pull requests restore
        # master's, so one push does not evict the next one's.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}

  vulkan-validation-sample:
    name: vulkan_validation sample (lavapipe, validation layer)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          pkgs="build-essential libx11-dev libx11-xcb-dev libxcb1-dev xvfb x11-utils libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers vulkan-tools"
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update failed (attempt $i); retrying in 10s"
            sleep 10
          done
          # Fetch first, under a bound: a download is safe to stop and
          # resumes, an install is not. A mirror that stalls is left for
          # the main archive on the next attempt.
          for i in 1 2 3; do
            sudo timeout 240 apt-get install -y --download-only \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              $pkgs && break
            [ $i = 3 ] && exit 1
            echo "package download failed or stalled (attempt $i); retrying from archive.ubuntu.com"
            if [ ! -d /etc/apt/ra-orig ]; then
              sudo mkdir /etc/apt/ra-orig
              sudo cp -a /etc/apt/sources.list.d /etc/apt/ra-orig/
              [ ! -f /etc/apt/sources.list ] || sudo cp -a /etc/apt/sources.list /etc/apt/ra-orig/
            fi
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              [ -f "$f" ] || continue
              sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' \
                -e 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            done
            # A refresh cut short or refused leaves apt no package lists: it
            # is retried, without translations or command-not-found data, and
            # the mirror is put back when the archive will not answer either.
            upd="-o Acquire::Retries=3 -o Acquire::http::Timeout=30
              -o Acquire::Languages=none
              -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false
              -o APT::Update::Error-Mode=any"
            ok=0
            for j in 1 2; do
              sudo timeout 120 apt-get update -y $upd && { ok=1; break; }
            done
            if [ $ok = 0 ]; then
              sudo rm -rf /etc/apt/sources.list.d
              sudo cp -a /etc/apt/ra-orig/sources.list.d /etc/apt/
              [ ! -f /etc/apt/ra-orig/sources.list ] || sudo cp -a /etc/apt/ra-orig/sources.list /etc/apt/
              sudo rm -rf /etc/apt/ra-orig
              sudo timeout 120 apt-get update -y $upd || true
            fi
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Build and run
        shell: bash
        run: |
          set -eu
          # The context-only sample: vulkan_common.c against the real
          # loader, brought up and torn down under the validation
          # layer, and every memory type it advertises selected. It
          # exits 77 with no display or no device, and that is a pass.
          Xvfb :99 -screen 0 640x480x24 &
          for i in $(seq 1 15); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          export DISPLAY=:99
          make -C samples/gfx/vulkan_validation
          rc=0
          DISPLAY=:99 VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json \
            samples/gfx/vulkan_validation/vulkan_validation_test || rc=$?
          make -C samples/gfx/vulkan_validation clean
          if [ "$rc" = 77 ]; then echo "skipped: no device"; exit 0; fi
          exit $rc

  vulkan-asan-harness:
    name: Threaded-video harness on Vulkan under ASan+UBSan (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Line tables are all a sanitizer report needs. configure and
      # make take these in place of DEBUG=1's -O0 -g, adding their own.
      CFLAGS: -O0 -g1
      CXXFLAGS: -O0 -g1

    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          pkgs="build-essential libxkbcommon-dev libx11-xcb-dev libxcb1-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libxv-dev xvfb x11-utils zlib1g-dev libfreetype6-dev libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers vulkan-tools libasound2-dev"
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update failed (attempt $i); retrying in 10s"
            sleep 10
          done
          # Fetch first, under a bound: a download is safe to stop and
          # resumes, an install is not. A mirror that stalls is left for
          # the main archive on the next attempt.
          for i in 1 2 3; do
            sudo timeout 240 apt-get install -y --download-only \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              $pkgs && break
            [ $i = 3 ] && exit 1
            echo "package download failed or stalled (attempt $i); retrying from archive.ubuntu.com"
            if [ ! -d /etc/apt/ra-orig ]; then
              sudo mkdir /etc/apt/ra-orig
              sudo cp -a /etc/apt/sources.list.d /etc/apt/ra-orig/
              [ ! -f /etc/apt/sources.list ] || sudo cp -a /etc/apt/sources.list /etc/apt/ra-orig/
            fi
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              [ -f "$f" ] || continue
              sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' \
                -e 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            done
            # A refresh cut short or refused leaves apt no package lists: it
            # is retried, without translations or command-not-found data, and
            # the mirror is put back when the archive will not answer either.
            upd="-o Acquire::Retries=3 -o Acquire::http::Timeout=30
              -o Acquire::Languages=none
              -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false
              -o APT::Update::Error-Mode=any"
            ok=0
            for j in 1 2; do
              sudo timeout 120 apt-get update -y $upd && { ok=1; break; }
            done
            if [ $ok = 0 ]; then
              sudo rm -rf /etc/apt/sources.list.d
              sudo cp -a /etc/apt/ra-orig/sources.list.d /etc/apt/
              [ ! -f /etc/apt/ra-orig/sources.list ] || sudo cp -a /etc/apt/ra-orig/sources.list /etc/apt/
              sudo rm -rf /etc/apt/ra-orig
              sudo timeout 120 apt-get update -y $upd || true
            fi
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-

      - name: Enable ccache
        run: |
          set -eu
          command -v ccache >/dev/null 2>&1 || sudo apt-get install -y -qq ccache
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 250M
          ccache -z

      - name: Configure
        run: |
          ./configure --disable-qt
          grep -q '^HAVE_VULKAN = 1' config.mk

      - name: Build with DEBUG=1, VULKAN_DEBUG=1 and -fsanitize=address,undefined
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) SANITIZER=address,undefined DEBUG=1 VULKAN_DEBUG=1
