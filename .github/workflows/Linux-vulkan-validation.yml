          [ "${{ matrix.san }}" = none ] || export CFLAGS="-O0 -g1" CXXFLAGS="-O0 -g1"
          # Every driver runs, so one failing does not hide another.
          fail=0
          for driver in ${{ matrix.drivers }}; do
            echo "::group::$driver"
            SAN=${{ matrix.san }} DRIVER=$driver CYCLES=1 \
              make -C samples/gfx/threaded_video check-driver ||
              { echo "::error::the harness failed on $driver"; fail=1; }
            make -C samples/gfx/threaded_video clean
            echo "::endgroup::"
          done
          exit $fail

      - name: ccache statistics
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ccache -sv

      - name: Save ccache
        # Only master's pushes keep a cache: pull requests restore
        # master's, so one push does not evict the next one's.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}

  d3d-harness:
    name: Threaded-video harness on ${{ matrix.driver }} (WARP, MSYS2 MinGW64)
    runs-on: windows-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        # d3d12 runs the same lanes on the other explicit-API backend:
        # its in-place texture update is fence-tagged against the frame
        # that last copied from the upload buffer, which only a running
        # driver exercises. It runs with the harness core pushing
        # XRGB8888: d3d12 lends its framebuffer only for a row pitch
        # on a 256-byte boundary, which 320 pixels reach at 4 bytes and
        # not at 2, so that is the run in which a frame is lent and a
        # window into the loan is read out of it (lent-window lane).
        driver: [d3d11, d3d12]
        include:
          - driver: d3d12
            core_xrgb8888: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64

      - name: Install packages
        shell: msys2 {0}
        run: |
          # A mirror that stalls or rate-limits (HTTP 429) fails pacman's
          # whole transaction; what it fetched stays in the cache, so a
          # retry fetches only the rest, one file at a time after a
          # growing wait so a shared runner's rate limit can clear.
          p=$MINGW_PACKAGE_PREFIX
          pkgs="base-devel git $p-cc $p-gdb"
          for i in 1 2 3 4 5; do
            pacman -S --noconfirm --needed $pkgs && exit 0
            [ $i = 5 ] && break
            echo "package install failed (attempt $i); retrying in $((30 * i))s, serial downloads"
            sed -i -e '/^#*ParallelDownloads/d' -e '/^\[options\]/a ParallelDownloads = 1' /etc/pacman.conf
            sleep $((30 * i))
          done
          exit 1

      - name: Configure and build RetroArch (no Qt)
        shell: msys2 {0}
        run: |
          set -eu
          ./configure --disable-qt
          grep -q '^HAVE_D3D11 = 1' config.mk
          grep -q '^HAVE_D3D12 = 1' config.mk
          make -j"$(nproc)"
          test -x retroarch.exe

      - name: Run the harness on ${{ matrix.driver }}
        shell: msys2 {0}
        run: |
          set -eu
          samples/gfx/threaded_video/build.sh
          HARNESS_CORE_XRGB8888=${{ matrix.core_xrgb8888 || '' }} \
            SAN=none DRIVER=${{ matrix.driver }} CYCLES=1 GDB=1 make -C samples/gfx/threaded_video check-driver
          make -C samples/gfx/threaded_video clean

  views-sdl3:
    name: Views on SDL3, end to end (Xvfb, llvmpipe)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          pkgs="build-essential ninja-build cmake xvfb x11-utils imagemagick libx11-dev libxext-dev libxrandr-dev libxi-dev libxss-dev libxcursor-dev libxfixes-dev libxkbcommon-dev libgl1-mesa-dri libgl-dev libegl-dev zlib1g-dev libfreetype6-dev libasound2-dev"
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            sleep 10
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Build SDL3
        # The runner image ships no libsdl3-dev: a pinned release, with
        # the renderer the driver draws through.
        run: |
          set -eu
          SDL3_VER=3.2.20
          curl -sL -o /tmp/sdl3.tar.gz \
             "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VER/SDL3-$SDL3_VER.tar.gz"
          tar -C /tmp -xzf /tmp/sdl3.tar.gz
          cmake -S "/tmp/SDL3-$SDL3_VER" -B /tmp/sdl3-build -G Ninja \
             -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
             -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_AUDIO=OFF -DSDL_CAMERA=OFF \
             -DSDL_WAYLAND=OFF -DSDL_X11=ON -DSDL_RENDER=ON -DSDL_OPENGL=ON \
             -DSDL_OPENGLES=ON -DSDL_VULKAN=OFF -DCMAKE_INSTALL_PREFIX=/opt/sdl3 \
             > /tmp/sdl3-cmake.log
          ninja -C /tmp/sdl3-build > /tmp/sdl3-build.log
          sudo ninja -C /tmp/sdl3-build install > /tmp/sdl3-install.log

      - name: Build retroarch with SDL3
        run: |
          set -eu
          export PKG_CONFIG_PATH=/opt/sdl3/lib/pkgconfig
          ./configure --enable-sdl3 --disable-sdl2 --disable-sdl --disable-qt \
                      --disable-vulkan --disable-ffmpeg
          grep -q '^HAVE_SDL3 = 1' config.mk
          make -j$(getconf _NPROCESSORS_ONLN)
          make -C samples/cores/video_views

      - name: Pointer helper connection regression
        run: python3 samples/cores/video_views/e2e/pointer_test.py

      - name: Views on SDL3, end to end
        shell: bash
        run: |
          set -eu
          # The views compositor as the SDL3 driver instantiates it: each
          # view written straight into a texture of its own, the
          # interlaced canvas, views read exactly out of the frame, the
          # UI layer per eye with the menu open, and a pointer mapped
          # back through it. Anaglyph draws the frame whole there.
          export LIBGL_ALWAYS_SOFTWARE=1
          export LD_LIBRARY_PATH=/opt/sdl3/lib
          RA_E2E_XVFB=1 RA_E2E_ONLY='^(3ds-sbs-full|3ds-sbs-half|3ds-top-bottom|3ds-interlaced|ds-horizontal|exact-3ds|exact-3ds-rgb565|crop-threaded-menu|pointer-sbs-full)$' \
            python3 samples/cores/video_views/e2e/run.py ./retroarch \
            "$RUNNER_TEMP/views-e2e" sdl3

      - name: Preserve views logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: views-sdl3-logs
          path: ${{ runner.temp }}/views-e2e/**/*.log
          if-no-files-found: ignore

  views-sdl1:
    name: Views on SDL 1.2, XShm and XVideo, end to end (Xvfb, sdl12-compat)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          pkgs="build-essential xvfb x11-utils imagemagick openbox libx11-dev libxext-dev libxv-dev libsdl1.2-dev libgl1-mesa-dri libgl-dev zlib1g-dev libfreetype6-dev libasound2-dev"
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            sleep 10
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Build retroarch with SDL 1.2, XShm and XVideo
        run: |
          set -eu
          ./configure --enable-sdl --disable-sdl2 --disable-sdl3 --enable-xshm \
                      --enable-xvideo --disable-qt --disable-vulkan --disable-ffmpeg
          grep -q '^HAVE_SDL = 1' config.mk
          grep -q '^HAVE_XSHM = 1' config.mk
          grep -q '^HAVE_XVIDEO = 1' config.mk
          make -j$(getconf _NPROCESSORS_ONLN)
          make -C samples/cores/video_views
          make -C samples/gfx/xv_standin

      - name: Views on SDL 1.2 and XShm, end to end
        shell: bash
        run: |
          set -eu
          # The CPU drivers' views: each view scaled straight out of the
          # frame into the window's surface or image, the anaglyph and
          # interlaced canvas blended on the CPU, views read exactly out
          # of the frame, and the menu with it open. XShm ("x11") also
          # has the pointer cases; SDL 1.2 runs under openbox, which
          # sizes sdl12-compat's fullscreen window.
          RA_E2E_XVFB=1 python3 samples/cores/video_views/e2e/run.py \
            ./retroarch "$RUNNER_TEMP/views-e2e" sdl x11

      - name: Views on XVideo, end to end
        shell: bash
        run: |
          set -eu
          # Xvfb has no XVideo adaptor: samples/gfx/xv_standin's,
          # preloaded, takes the image and scales it to the window.
          # Views are converted straight from the frame into the
          # image, packed (YUY2, UYVY) and planar (I420); the stand-in
          # aborts on a put that reads outside the image.
          export RA_E2E_XVFB=1
          export RA_E2E_XV_STANDIN="$PWD/samples/gfx/xv_standin/libxv_standin.so"
          XV_STANDIN_FORMAT=YUY2 python3 samples/cores/video_views/e2e/run.py \
            ./retroarch "$RUNNER_TEMP/views-e2e/yuy2" xvideo
          XV_STANDIN_FORMAT=I420 python3 samples/cores/video_views/e2e/run.py \
            ./retroarch "$RUNNER_TEMP/views-e2e/i420" xvideo
          XV_STANDIN_FORMAT=UYVY RA_E2E_ONLY='3ds-2d|anaglyph|interlaced|pointer-sbs-half' \
            python3 samples/cores/video_views/e2e/run.py \
            ./retroarch "$RUNNER_TEMP/views-e2e/uyvy" xvideo

      - name: Preserve views logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: views-sdl1-logs
          path: ${{ runner.temp }}/views-e2e/**/*.log
          if-no-files-found: ignore
