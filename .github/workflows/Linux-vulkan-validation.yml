  gl-harness:
    name: Threaded-video harness on ${{ matrix.drivers }} (llvmpipe, ${{ matrix.api }}, ${{ matrix.san }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One build per API and sanitizer, the harness run on each
        # driver it serves. The GLES 3 build is the Android one: frame
        # memory and the framebuffer loan through EXT_buffer_storage,
        # which llvmpipe's GLES 3.2 has, and the harness fails a GL
        # driver without them.
        include:
          - { api: desktop, san: none,    drivers: gl glcore gl1 }
          - { api: desktop, san: address, drivers: gl glcore gl1 }
          - { api: desktop, san: thread,  drivers: gl glcore gl1 }
          - { api: gles3,   san: none,    drivers: gl glcore }
          - { api: gles3,   san: address, drivers: gl }
          - { api: gles3,   san: thread,  drivers: glcore }

    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          pkgs="build-essential libxkbcommon-dev libx11-xcb-dev libxcb1-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libxv-dev xvfb x11-utils zlib1g-dev libfreetype6-dev libgl-dev libglx-dev libegl-dev libgles-dev libgl1-mesa-dri libglx-mesa0 mesa-utils libasound2-dev"
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update failed (attempt $i); retrying in 10s"
            sleep 10
          done
          # Fetch first, under a bound: a download is safe to stop and
          # resumes, an install is not. A mirror that stalls is left for
          # the main archive on the next attempt.
          for i in 1 2 3; do
            sudo timeout 240 apt-get install -y --download-only \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              $pkgs && break
            [ $i = 3 ] && exit 1
            echo "package download failed or stalled (attempt $i); retrying from archive.ubuntu.com"
            if [ ! -d /etc/apt/ra-orig ]; then
              sudo mkdir /etc/apt/ra-orig
              sudo cp -a /etc/apt/sources.list.d /etc/apt/ra-orig/
              [ ! -f /etc/apt/sources.list ] || sudo cp -a /etc/apt/sources.list /etc/apt/ra-orig/
            fi
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              [ -f "$f" ] || continue
              sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' \
                -e 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            done
            # A refresh cut short or refused leaves apt no package lists: it
            # is retried, without translations or command-not-found data, and
            # the mirror is put back when the archive will not answer either.
            upd="-o Acquire::Retries=3 -o Acquire::http::Timeout=30
              -o Acquire::Languages=none
              -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false
              -o APT::Update::Error-Mode=any"
            ok=0
            for j in 1 2; do
              sudo timeout 120 apt-get update -y $upd && { ok=1; break; }
            done
            if [ $ok = 0 ]; then
              sudo rm -rf /etc/apt/sources.list.d
              sudo cp -a /etc/apt/ra-orig/sources.list.d /etc/apt/
              [ ! -f /etc/apt/ra-orig/sources.list ] || sudo cp -a /etc/apt/ra-orig/sources.list /etc/apt/
              sudo rm -rf /etc/apt/ra-orig
              sudo timeout 120 apt-get update -y $upd || true
            fi
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-${{ strategy.job-index }}-

      - name: Enable ccache
        run: |
          set -eu
          command -v ccache >/dev/null 2>&1 || sudo apt-get install -y -qq ccache
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 250M
          ccache -z

      - name: Configure
        run: |
          if [ "${{ matrix.api }}" = gles3 ]; then
            ./configure --disable-qt --enable-opengles --enable-opengles3 \
              --disable-opengl1
            grep -q '^HAVE_OPENGLES3 = 1' config.mk
          else
            ./configure --disable-qt
          fi
          grep -q '^HAVE_OPENGL = 1' config.mk
          grep -q '^HAVE_OPENGL_CORE = 1' config.mk

      - name: Build
        run: |
          # The sanitizer builds are DEBUG=1: -g1, as in the other jobs.
          [ "${{ matrix.san }}" = none ] || export CFLAGS="-O0 -g1" CXXFLAGS="-O0 -g1"
          case "${{ matrix.san }}" in
            thread)  make -j$(getconf _NPROCESSORS_ONLN) SANITIZER=thread DEBUG=1 ;;
            address) make -j$(getconf _NPROCESSORS_ONLN) SANITIZER=address,undefined DEBUG=1 ;;
            *)       make -j$(getconf _NPROCESSORS_ONLN) ;;
          esac
          test -x retroarch

      - name: Run the harness on ${{ matrix.drivers }}
        shell: bash
        run: |
          set -eu
          Xvfb :99 -screen 0 640x480x24 &
