name: CI Linux EGL hardware core

# Runs the gl video driver on the X11 EGL context under Xvfb with an
# OpenGL hardware core, and checks that the core was given a context
# and that its frame is what reaches the screen - with threaded video
# on, where the core's context lives on the main thread and cannot be
# bound to the window surface the video thread holds, and with it off.
# Mesa takes the surfaceless path by itself; a preloaded shim hides
# parts of its EGL so the pbuffer paths run too.

on:
  push:
    branches:
      - master
    paths:
      - 'gfx/common/egl_common.c'
      - 'gfx/common/egl_common.h'
      - 'gfx/drivers_context/xegl_ctx.c'
      - 'gfx/drivers/gl2.c'
      - 'gfx/video_driver.c'
      - 'gfx/video_thread_hw.c'
      - 'gfx/video_thread_wrapper.c'
      - 'samples/gfx/egl_hw_core/**'
      - '.github/workflows/Linux-egl-hw-core.yml'
  pull_request:
    paths:
      - 'gfx/common/egl_common.c'
      - 'gfx/common/egl_common.h'
      - 'gfx/drivers_context/xegl_ctx.c'
      - 'gfx/drivers/gl2.c'
      - 'gfx/video_driver.c'
      - 'gfx/video_thread_hw.c'
      - 'gfx/video_thread_wrapper.c'
      - 'samples/gfx/egl_hw_core/**'
      - '.github/workflows/Linux-egl-hw-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  egl-hw-core:
    name: Run a GL hardware core on the EGL context under Xvfb
    runs-on: ubuntu-latest
    env:
      APT_PKGS: build-essential zlib1g-dev ccache python3 xvfb libgl1-mesa-dri libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev libxxf86vm-dev libxrandr-dev libxinerama-dev libgl-dev libegl-dev
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 20
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-

      - name: Enable ccache
        run: |
          set -eu
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 250M
          ccache -z

      - name: Build RetroArch (X11 + OpenGL + EGL, the rest off)
        shell: bash
        run: |
          set -eu
          ./configure --disable-qt --disable-wayland --disable-sdl \
                      --disable-sdl2 --disable-ffmpeg --disable-vulkan \
                      --disable-pulse --disable-discord \
                      --disable-networking --disable-cheevos \
                      --disable-glslang --disable-slang \
                      --disable-spirv_cross --disable-xmb \
                      --disable-materialui --disable-ozone \
                      --disable-7zip --disable-flac \
                      --disable-audiomixer --disable-translate \
                      --disable-accessibility --disable-crtswitchres \
                      --disable-langextra --disable-libretrodb \
                      --disable-video_filter --disable-dsp_filter
          grep -q '^HAVE_OPENGL = 1' config.mk
          grep -q '^HAVE_EGL = 1' config.mk
          grep -q '^HAVE_X11 = 1' config.mk
          make -j$(nproc)
          ccache -s

      - name: Run egl_hw_core_test
        shell: bash
        run: |
          set -eu
          make -C samples/gfx/egl_hw_core
          timeout 600 python3 samples/gfx/egl_hw_core/egl_hw_core_test.py ./retroarch

      - name: Save ccache
        # Only master's pushes keep a cache: pull requests restore
        # master's, so one push does not evict the next one's.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
