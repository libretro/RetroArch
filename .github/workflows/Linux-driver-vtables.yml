name: CI driver vtables

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  driver-vtables:
    name: Every driver against its interface
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libasound2-dev libpulse-dev libjack-jackd2-dev \
            libopenal-dev libpipewire-0.3-dev libsdl2-dev

      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile each driver against its interface
        shell: bash
        run: |
          set -eu
          # A driver fills in a vtable of function pointers, and almost
          # every one of them does it positionally and names nothing.
          # So an entry added to the middle of one of those structures
          # silently moves every entry after it in every driver that
          # did not name its fields, and what the compiler then says is
          # that a layout function is being installed as an underrun
          # counter - which is an error only if you ask for it to be.
          #
          # That happened: frames_consumed_fallback went in between
          # frames_consumed and underruns, three Windows drivers took
          # the shift, and the break reached master because the check
          # run before the commit was one file rather than all of them.
          #
          # This is that check. It compiles every driver it can on
          # Linux - the rest need SDKs that are not here - and treats a
          # mismatched function pointer as the error it is.
          #
          # A static function nobody calls is in the same family and is
          # caught here too: it is what a call site that was meant to
          # be there and is not looks like from the compiler's side.
          # That happened as well - the pump's scheduler class was
          # taken but never given back, and the only sign was the
          # helper that returns it going unused.
          fail=0
          defs="-DRARCH_INTERNAL -DHAVE_THREADS -DHAVE_MENU -DHAVE_CONFIGFILE"
          defs="$defs -DHAVE_AUDIOMIXER -DHAVE_REWIND -DHAVE_RWAV"
          have="-DHAVE_ALSA -DHAVE_PULSE -DHAVE_JACK -DHAVE_OSS -DHAVE_OPENAL"
          have="$have -DHAVE_PIPEWIRE -DHAVE_TINYALSA -DHAVE_SDL2"
          inc="-I. -Ilibretro-common/include -Ideps -Ideps/rcheevos/include"
          inc="$inc $(pkg-config --cflags libpipewire-0.3 2>/dev/null || true)"
          # Every file that fills one of these structures in, found by
          # looking rather than by listing a directory: the Android
          # build broke on audio/audio_thread_wrapper.c, which fills in
          # an audio_driver_t and does not live under audio/drivers,
          # and so was not in the list this job first carried.
          files=$(grep -rl -E \
             'audio_driver_t [a-z_]+ *=|camera_driver_t [a-z_]+ *=|record_driver_t [a-z_]+ *=|microphone_driver_t [a-z_]+ *=' \
             --include='*.c' . | grep -v '^\./samples/' | sort)
          echo "$files" | sed 's/^/  /'
          echo
          for f in $files; do
             [ -f "$f" ] || continue
             out=$(gcc -fsyntax-only -std=gnu99 -Wall \
                   -Werror=incompatible-pointer-types \
                   -Werror=unused-function \
                   $defs $have $inc "$f" 2>&1 || true)
             # A driver whose platform SDK is not here does not compile
             # at all, and that is not what this job is about: it is
             # skipped, and only a pointer mismatch fails.
             if printf '%s' "$out" | grep -qE "incompatible pointer type|defined but not used"; then
                echo "=== $f"
                printf '%s\n' "$out" | grep -E -A2 "incompatible pointer type|defined but not used"
                fail=1
             elif printf '%s' "$out" | grep -q ": error:"; then
                echo "[skip] $f (needs an SDK that is not here)"
             else
                echo "[ok]   $f"
             fi
          done
          if [ "$fail" -ne 0 ]; then
             echo
             echo "A driver does not match the interface it fills in, or has a"
             echo "static function nothing calls. An optional vtable entry belongs"
             echo "at the end of the structure, where it cannot move the entries a"
             echo "positional initialiser relies on; an uncalled helper usually"
             echo "means the call site that was meant to use it is missing."
             exit 1
          fi
