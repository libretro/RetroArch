name: CI Linux link bus

on:
  push:
    branches:
      - master
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!samples/**'
      - '!libretro-common/samples/**'
      - '!.github/workflows/*.yml'
      - 'libretro-common/samples/link/link_bus_test/**'
      - 'libretro-common/samples/link/link_sched_test/**'
      - 'samples/link/core/**'
      - 'samples/link/harness/**'
      - 'samples/link/scenarios/**'
      - '.github/workflows/Linux-link-bus.yml'
    # ci_paths: end
  pull_request:
    branches:
      - master
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!samples/**'
      - '!libretro-common/samples/**'
      - '!.github/workflows/*.yml'
      - 'libretro-common/samples/link/link_bus_test/**'
      - 'libretro-common/samples/link/link_sched_test/**'
      - 'samples/link/core/**'
      - 'samples/link/harness/**'
      - 'samples/link/scenarios/**'
      - '.github/workflows/Linux-link-bus.yml'
    # ci_paths: end
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  link-bus:
    name: Link bus, scheduler and scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APT_PKGS: build-essential gcc-mingw-w64-x86-64 wine64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 20
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Scenarios
        run: make -C samples/link/harness check BUILD_DIR=build-plain

      - name: Scenarios under ASan and UBSan
        env:
          # libco switches stacks, which ASan's fake-stack check cannot follow.
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make -C samples/link/harness check SANITIZER=address,undefined BUILD_DIR=build-sanitized

      - name: Windows build under Wine
        shell: bash
        env:
          WINEDEBUG: -all
        run: |
          set -eu
          . "$GITHUB_WORKSPACE/.github/workflows/scripts/wine-server.sh"
          WINE=$(command -v wine64 || command -v wine || echo /usr/lib/wine/wine64)
          make -C libretro-common/samples/link/link_bus_test clean check CC=x86_64-w64-mingw32-gcc RUNNER="$WINE"
          make -C libretro-common/samples/link/link_sched_test clean check CC=x86_64-w64-mingw32-gcc RUNNER="$WINE"
          make -C samples/link/harness check CC=x86_64-w64-mingw32-gcc RUNNER="$WINE" BUILD_DIR=build-windows
