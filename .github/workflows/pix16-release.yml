name: pix16 release

on:
  push:
    branches: [pix16-build]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: pix16-build-${{ github.run_number }}

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev \
            libudev-dev libasound2-dev libpulse-dev libfreetype6-dev \
            libxxf86vm-dev libgbm-dev zlib1g-dev libdrm-dev

      - name: Configure
        run: |
          ./configure --disable-ffmpeg --disable-qt --disable-sdl --disable-sdl2 \
            --disable-vulkan --disable-opengl1 --enable-pix16

      - name: Build
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          tail -n 25 build.log 2>/dev/null | while IFS= read -r l; do
            printf '::error::%s\n' "$(printf '%s' "$l" | cut -c1-350)"
          done

      - name: Package AppImage
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          mkdir -p AppDir/usr/share/retroarch/assets/pix16
          mkdir -p AppDir/usr/share/retroarch/assets/xmb/dot-art/png
          cp retroarch AppDir/usr/bin/
          cp com.libretro.RetroArch.desktop AppDir/usr/share/applications/
          cp media/com.libretro.RetroArch.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          cp media/pix16/boot_logo.png AppDir/usr/share/retroarch/assets/pix16/
          cp media/pix16/dot-art/png/*.png AppDir/usr/share/retroarch/assets/xmb/dot-art/png/
          mkdir -p AppDir/usr/share/retroarch/info
          cp media/pix16/coreinfo/*.info AppDir/usr/share/retroarch/info/


          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          ./linuxdeploy --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/com.libretro.RetroArch.desktop \
            --icon-file media/com.libretro.RetroArch.svg \
            -e AppDir/usr/bin/retroarch

          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'CFG="${XDG_CONFIG_HOME:-$HOME/.config}/retroarch"' \
            'if [ -d "$HERE/usr/share/retroarch/info" ]; then' \
            '  mkdir -p "$CFG/info"' \
            '  for f in "$HERE"/usr/share/retroarch/info/*.info; do' \
            '    [ -e "$CFG/info/$(basename "$f")" ] || cp "$f" "$CFG/info/" 2>/dev/null || true' \
            '  done' \
            'fi' \
            'if [ -x "$HERE/usr/bin/retroarch" ]; then' \
            '  exec "$HERE/usr/bin/retroarch" "$@"' \
            'fi' \
            'exec "${APPDIR:-$HERE}/usr/bin/retroarch" "$@"' \
            > AppDir/AppRun.tmp
          rm -f AppDir/AppRun
          mv AppDir/AppRun.tmp AppDir/AppRun
          chmod +x AppDir/AppRun
          size=$(stat -c %s AppDir/usr/bin/retroarch)
          if [ "$size" -lt 1000000 ]; then
            echo "payload is $size bytes: the binary was replaced"
            exit 1
          fi

          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir RetroArch-pix16-x86_64.AppImage
          ls -l RetroArch-pix16-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: RetroArch-pix16-x86_64.AppImage
          if-no-files-found: error

  linux-musl:
    name: Linux musl tarball
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh -c '
            set -e
            apk add --no-cache build-base pkgconf linux-headers \
              mesa-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
              libxkbcommon-dev eudev-dev alsa-lib-dev pulseaudio-dev \
              freetype-dev libdrm-dev zlib-dev
            sed -i "s/\r$//" configure
            find qb -type f -name "*.sh" -exec sed -i "s/\r$//" {} +
            ./configure --disable-ffmpeg --disable-qt --disable-sdl --disable-sdl2 \
              --disable-vulkan --disable-opengl1 --enable-pix16
            make -j"$(nproc)"
            mkdir -p /src/musl-libs
            ldd /src/retroarch | sed -n "s/.*=> \([^ ]*\).*/\1/p" > /tmp/libs.txt
            while read -r lib; do
              [ -f "$lib" ] && cp -L "$lib" /src/musl-libs/ || true
            done < /tmp/libs.txt
            ls /src/musl-libs | head -20
          '

      - name: Package tarball
        run: |
          set -e
          sudo chown -R "$(id -u):$(id -g)" retroarch
          rm -rf p16musl
          mkdir -p p16musl/assets/pix16 p16musl/assets/xmb/dot-art/png p16musl/info p16musl/lib
          cp retroarch p16musl/
          cp musl-libs/*.so* p16musl/lib/ 2>/dev/null || true
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$0")"' \
            'LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'export LD_LIBRARY_PATH' \
            'exec "$HERE/retroarch" "$@"' > p16musl/run.sh
          chmod +x p16musl/run.sh
          cp media/pix16/boot_logo.png p16musl/assets/pix16/
          cp media/pix16/dot-art/png/*.png p16musl/assets/xmb/dot-art/png/
          cp media/pix16/coreinfo/*.info p16musl/info/
          tar czf RetroArch-pix16-linux-musl-x86_64.tar.gz -C p16musl .
          ls -l RetroArch-pix16-linux-musl-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: musl
          path: RetroArch-pix16-linux-musl-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64 zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            make
            zip

      - name: Configure and build
        shell: msys2 {0}
        run: |
          sed -i 's/\r$//' configure
          find qb -type f -name '*.sh' -exec sed -i 's/\r$//' {} +
          ./configure --enable-pix16 --disable-ffmpeg --disable-qt --disable-sdl --disable-sdl2 2>&1 | tee configure.log
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        shell: msys2 {0}
        run: |
          tail -n 25 build.log 2>/dev/null | while IFS= read -r l; do
            printf '::error::%s\n' "$(printf '%s' "$l" | cut -c1-350)"
          done
          tail -n 10 configure.log 2>/dev/null | while IFS= read -r l; do
            printf '::error::%s\n' "$(printf '%s' "$l" | cut -c1-350)"
          done

      - name: Package zip
        shell: msys2 {0}
        run: |
          mkdir -p dist/assets/pix16 dist/assets/xmb/dot-art/png
          cp retroarch.exe dist/
          cp /mingw64/bin/libwinpthread-1.dll dist/
          cp media/pix16/boot_logo.png dist/assets/pix16/
          cp media/pix16/dot-art/png/*.png dist/assets/xmb/dot-art/png/
          mkdir -p dist/info
          cp media/pix16/coreinfo/*.info dist/info/

          cd dist
          zip -r ../RetroArch-pix16-win64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: RetroArch-pix16-win64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: pix16 build ${{ github.run_number }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            pix16, a low-resolution 16-bit console style menu driver for RetroArch.

            Built from `${{ github.sha }}`.

            pix16 is the default menu driver in these builds. It brings the justified
            systems grid, the Add System wizard, the BIOS and title screens, fifteen
            colour themes, eleven launch effects, a Reduced Motion setting, and a pause
            window sized for a gamepad.

            **Windows**: `RetroArch-pix16-win64.zip` - unpack next to an existing 64-bit
            RetroArch install (it carries the newer `libwinpthread-1.dll`).

            **Linux**: `RetroArch-pix16-x86_64.AppImage` - make it executable and run it.
            The start-screen logo and the system sprites are inside the image.

            **Android**: `phoenix-aarch64-debug.apk` - sideload it. It installs as
            "RetroArch (AArch64)" next to an existing RetroArch, uses the built-in
            gamepad, and opens on the pix16 menu.

            Pick a different menu with `Settings > Drivers > Menu`, or set
            `menu_driver = "pix16"` in `retroarch.cfg`, then restart.
          files: dist/*
