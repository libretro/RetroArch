name: CI Linux legacy network backends

# The built-in TLS, SMB and NFS clients are the defaults; the vendored
# and system libraries they replaced stay selectable, and nothing else
# builds them any more. This configures with every built-in client off
# - system mbedtls for TLS, the bundled libsmb2 for SMB, no NFS - and
# builds to the link, then checks the binary carries the legacy
# backends and not the built-in ones.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  legacy-net-backends:
    name: system mbedtls + bundled libsmb2, built-in clients off
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential pkg-config libmbedtls-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libasound2-dev libsdl2-dev \
            zlib1g-dev libfreetype6-dev

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: |
          ./configure --disable-retrossl --disable-retrosmb --disable-retronfs --enable-libsmb \
            --disable-qt --disable-wayland --disable-ffmpeg
          grep -E '^HAVE_(RETROSSL|RETROSMB|RETRONFS|SYSTEMMBEDTLS|BUILTINSMBCLIENT) ' config.mk
          grep -q '^HAVE_RETROSSL = 0' config.mk
          grep -q '^HAVE_RETROSMB = 0' config.mk
          grep -q '^HAVE_SYSTEMMBEDTLS = 1' config.mk
          grep -q '^HAVE_BUILTINSMBCLIENT = 1' config.mk

      - name: Build
        run: make -j"$(nproc)"

      - name: Check which backends linked
        run: |
          set -eu
          nm retroarch | grep -q ' T ssl_socket_connect'
          nm retroarch | grep -q 'mbedtls_ssl_handshake'
          nm retroarch | grep -q ' T smb2_connect_share'
          # x509.c is part of HAVE_CRYPTO (the keychain needs the crypto
          # foundation) and stays; the clients themselves must be gone
          if nm retroarch | grep -q ' T rsmb_connect\| T rnfs_connect\| T ssl_socket_retro_was_resumed'; then
            echo "built-in client symbols present in a legacy build"; exit 1
          fi
          echo "[pass] legacy backends linked, built-in clients absent"
