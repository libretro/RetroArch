name: CI VideoToolbox HEVC and Metal

on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/MacOS-videotoolbox-hevc.yml'
    - 'samples/gfx/videotoolbox_hevc/**'
    - 'samples/gfx/metal_frame/**'
    - 'gfx/common/videotoolbox_hevc*.h'
    - 'gfx/common/metal_frame*.h'
    - 'gfx/common/metal_hevc_driver.h'
    - 'gfx/common/metal_vp9_driver.h'
    - 'gfx/common/metal_decoder_snapshot.h'
    - 'gfx/common/videotoolbox_vp9*.h'
    - 'samples/gfx/videotoolbox_vp9/**'
    - 'libretro-common/formats/vp9/**'
    - 'libretro-common/formats/mp4/rmp4_video.c'
    - 'libretro-common/formats/webm/rwebm_video.c'
    - 'gfx/drivers/metal.m'
    - 'gfx/drivers/metal.h'
    - 'gfx/drivers/metal_shaders/Shaders.metal'
    - 'gfx/video_driver.h'
    - 'gfx/video_defines.h'
    - 'libretro-common/formats/h265/**'
    - 'libretro-common/rthreads/**'
    - 'libretro-common/include/**'
  pull_request:
    paths:
    - '.github/workflows/MacOS-videotoolbox-hevc.yml'
    - 'samples/gfx/videotoolbox_hevc/**'
    - 'samples/gfx/metal_frame/**'
    - 'gfx/common/videotoolbox_hevc*.h'
    - 'gfx/common/metal_frame*.h'
    - 'gfx/common/metal_hevc_driver.h'
    - 'gfx/common/metal_vp9_driver.h'
    - 'gfx/common/metal_decoder_snapshot.h'
    - 'gfx/common/videotoolbox_vp9*.h'
    - 'samples/gfx/videotoolbox_vp9/**'
    - 'libretro-common/formats/vp9/**'
    - 'libretro-common/formats/mp4/rmp4_video.c'
    - 'libretro-common/formats/webm/rwebm_video.c'
    - 'gfx/drivers/metal.m'
    - 'gfx/drivers/metal.h'
    - 'gfx/drivers/metal_shaders/Shaders.metal'
    - 'gfx/video_driver.h'
    - 'gfx/video_defines.h'
    - 'libretro-common/formats/h265/**'
    - 'libretro-common/rthreads/**'
    - 'libretro-common/include/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  videotoolbox-hevc:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - name: VideoToolbox HEVC hardware decode and pixel ownership
      run: |
        rc=0
        python3 samples/gfx/videotoolbox_hevc/run.py --native --metal || rc=$?
        if [ "$rc" = 77 ]; then
          echo "::warning::HEVC hardware decode or Metal shared events unavailable; native bridge check did not complete"
          exit 0
        fi
        exit "$rc"
    - name: VideoToolbox VP9 hardware decode, MP4/WebM and Metal pixels
      if: ${{ !cancelled() }}
      run: |
        rc=0
        python3 samples/gfx/videotoolbox_vp9/run.py --native --pipeline || rc=$?
        if [ "$rc" = 77 ]; then
          echo "::warning::VP9 hardware decode or Metal unavailable; native acceptance did not complete"
          exit 0
        fi
        exit "$rc"
    - name: Metal movie import, history and GPU pixel acceptance
      if: ${{ !cancelled() }}
      run: python3 samples/gfx/metal_frame/run.py --native
