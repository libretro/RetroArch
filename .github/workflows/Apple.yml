name: CI Apple

# Umbrella workflow for Apple-specific checks that are not a plain
# "does it build" - the full builds live in MacOS.yml and iOS.yml.
#
# Add new jobs here rather than as new top-level workflows: things like
# build-graph integrity checks, xcconfig assertions, extra Apple
# targets, and anything else that is Apple-shaped but does not warrant
# its own entry in the Actions sidebar.  Each job carries its own
# rationale in a comment above it.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # ------------------------------------------------------------------
  # Build-graph guard: the Bonjour/mDNS netplay discovery path.
  #
  # network/netplay/netplay_nsnetservice.m is a member of no target.
  # It reaches the compiler only through griffin/griffin_objc.m, behind
  #
  #   #if defined(HAVE_NETWORKING) && defined(HAVE_NETPLAYDISCOVERY) \
  #    && defined(HAVE_NETPLAYDISCOVERY_NSNET)
  #
  # and those macros arrive from pkg/apple/BaseConfig.xcconfig by way
  # of an $(inherited) chain: the CI builds pass
  # -xcconfig GitHubCI.xcconfig on the command line, which includes
  # Metal.xcconfig, whose OTHER_CFLAGS[sdk=macosx*] assignment relies
  # on $(inherited) to pull the project-level BaseConfig settings back
  # in.  Metal.xcconfig defines none of the three macros itself.
  #
  # Every link in that chain can be broken without breaking the build.
  # Drop the file from griffin's include list, drop griffin_objc.m from
  # a Sources phase, drop $(inherited) from Metal.xcconfig, or move the
  # -D out of BaseConfig, and the file simply stops being compiled - CI
  # stays green while an entire Apple-only source file goes unbuilt.
  # That is not hypothetical: the file parses a remote peer's mDNS TXT
  # records into fixed-size buffers, so it is exactly the sort of thing
  # that should not be able to rot unnoticed.
  #
  # This asserts the preconditions rather than duplicating the build.
  # The existing "CI macOS" and "CI iOS (13)" jobs already compile the
  # file; what they cannot tell you is whether they still are.
  # ------------------------------------------------------------------
  netplay-discovery-guard:
    name: Build graph - netplay mDNS discovery
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    # Source-level checks. These need no toolchain and give a precise
    # message when the wiring, rather than the code, is what broke.
    - name: griffin still imports the file
      run: |
        set -euo pipefail
        if ! grep -q 'netplay_nsnetservice\.m' griffin/griffin_objc.m; then
          echo "::error file=griffin/griffin_objc.m::netplay_nsnetservice.m is no longer imported; it is a member of no target, so nothing else compiles it"
          exit 1
        fi

    - name: griffin_objc.m is still in both Sources build phases
      run: |
        set -euo pipefail
        rc=0
        for proj in RetroArch_Metal RetroArch_iOS13; do
          pbx="pkg/apple/$proj.xcodeproj/project.pbxproj"
          n=$(awk '/Begin PBXSourcesBuildPhase/,/End PBXSourcesBuildPhase/' "$pbx" \
              | grep -c 'griffin_objc\.m in Sources' || true)
          echo "$proj: griffin_objc.m appears in Sources x$n"
          if [ "$n" -eq 0 ]; then
            echo "::error file=$pbx::griffin_objc.m is not in any Sources build phase"
            rc=1
          fi
        done
        exit $rc

    - name: The three guard macros survive the xcconfig chain
      run: |
        set -euo pipefail
        rc=0

        check() {
          # $1 = human label, remaining args = xcodebuild selector
          label="$1"; shift
          echo "--- $label ---"
          settings=$(xcodebuild -showBuildSettings "$@" \
                       -xcconfig pkg/apple/GitHubCI.xcconfig 2>/dev/null \
                     | grep -E '^\s*OTHER_CFLAGS =' || true)
          if [ -z "$settings" ]; then
            echo "::error::could not resolve OTHER_CFLAGS for $label"
            rc=1
            return
          fi
          echo "$settings" | tr ' ' '\n' | grep -E '^-DHAVE_NETPLAY|^-DHAVE_NETWORKING' || true
          for macro in HAVE_NETWORKING HAVE_NETPLAYDISCOVERY HAVE_NETPLAYDISCOVERY_NSNET; do
            if ! echo "$settings" | grep -qE -- "-D$macro([[:space:]]|=|$)"; then
              echo "::error::$label does not define $macro - netplay_nsnetservice.m is NOT being compiled"
              rc=1
            fi
          done
        }

        check "macOS (scheme RetroArch)" \
          -workspace pkg/apple/RetroArch.xcworkspace \
          -scheme RetroArch -config Release

        check "iOS (scheme RetroArch iOS Release)" \
          -workspace pkg/apple/RetroArch.xcworkspace \
          -destination generic/platform=iOS \
          -scheme "RetroArch iOS Release" -config Release

        exit $rc

  # ------------------------------------------------------------------
  # tvOS. The one Apple target with no build job of its own, so a break
  # in code it shares with iOS - netplay_nsnetservice.m included - ships
  # unnoticed there. Not gating: unrelated problems in the tvOS scheme
  # should not hold up the tree.
  # ------------------------------------------------------------------
  tvos:
    name: tvOS build (non-gating)
    runs-on: macos-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v6

    - name: Compile RA (tvOS)
      run: |
        set -o pipefail
        xcodebuild -workspace pkg/apple/RetroArch.xcworkspace \
          -destination generic/platform=tvOS -config Release \
          -scheme "RetroArch tvOS Release" \
          -xcconfig pkg/apple/GitHubCI.xcconfig \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
          -derivedDataPath build
