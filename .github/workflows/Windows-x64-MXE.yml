name: CI Windows x64 (MXE)

on:
  push:
    branches: [master]
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!samples/**'
      - '!libretro-common/samples/**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/Windows-x64-MXE.yml'
    # ci_paths: end
  pull_request:
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!samples/**'
      - '!libretro-common/samples/**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/Windows-x64-MXE.yml'
    # ci_paths: end
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: reallibretroretroarch/libretro-build-mxe-win64-cross:gcc16
      options: --user root --dns 1.1.1.1 --dns 8.8.8.8

    steps:
    - uses: taiki-e/checkout-action@v1

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ github.workflow }}-${{ github.job }}-

    - name: Compile RA
      run: |
        export CCACHE_DIR="$HOME/.ccache"
        echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
        ccache -M 250M
        ccache -z
        export MOC=/usr/lib/mxe/usr/x86_64-w64-mingw32.shared/qt5/bin/moc
        CC="ccache x86_64-w64-mingw32.shared-gcc" \
        CXX="ccache x86_64-w64-mingw32.shared-g++" \
          ./configure --host=x86_64-w64-mingw32.shared
        make clean
        make -j$(getconf _NPROCESSORS_ONLN)

    - name: ccache statistics
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: ccache -sv

    - name: Save ccache
      # Only master's pushes keep a cache: pull requests restore
      # master's, so one push does not evict the next one's.
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/cache/save@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
