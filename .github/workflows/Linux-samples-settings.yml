name: CI Linux samples/settings

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  samples-settings:
    name: Build and run samples/settings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          pkgs="build-essential"
          if dpkg -s $pkgs >/dev/null 2>&1; then
            echo "All packages already present on runner image; skipping apt."
            exit 0
          fi
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update failed (attempt $i); retrying in 10s"
            sleep 10
          done
          # Fetch first, under a bound: a download is safe to stop and
          # resumes, an install is not. A mirror that stalls is left for
          # the main archive on the next attempt.
          for i in 1 2 3; do
            sudo timeout 240 apt-get install -y --download-only \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              $pkgs && break
            [ $i = 3 ] && exit 1
            echo "package download failed or stalled (attempt $i); retrying from archive.ubuntu.com"
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              [ -f "$f" ] || continue
              sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' \
                -e 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            done
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-

      - name: Enable ccache
        run: |
          set -eu
          command -v ccache >/dev/null 2>&1 || sudo apt-get install -y -qq ccache
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 500M
          ccache -z

      - name: Settings lists have room for what they are given
        shell: bash
        run: |
          set -eu
          # configuration.c builds each list of settings into an array
          # of a fixed size. One setting too many for its list wrote
          # past the end of the array, and RetroArch died of heap
          # corruption at startup: two per-port string settings did it
          # to the string list. The lists now refuse what they have no
          # room for; this counts, in the preprocessed source and for
          # each build profile, what every list is given against the
          # size it is allocated with, so that the next one is found
          # here.
          timeout 300 python3 tools/settings_capacity_check.py
          echo "[pass] settings_capacity_check"

      - name: Build and run pipeline_migration_test (ASan + UBSan)
        shell: bash
        working-directory: samples/settings/pipeline_migration
        run: |
          set -eu
          # The audio_threaded_pipeline config migration. The setting
          # briefly held off/automatic/on and was saved as a number; it
          # is a bool again, and a bool is always saved as "true" or
          # "false", so a bare digit on the key is the older three-way
          # value. config_get_bool() reads its automatic (1) as an
          # explicit on, which forced the pipeline on for users who
          # never chose it. Pins each stored digit against both
          # defaults, and pins that "true", "false", absent, empty and
          # multi-character values are untouched. The rule under test
          # is restated from config_load_file(), which needs most of the
          # frontend to run; a change to one must be made in the other.
          make clean all SANITIZER=address,undefined
          test -x pipeline_migration_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 60 \
             ./pipeline_migration_test
          echo "[pass] pipeline_migration_test (ASan)"
