name: CI PS4/ORBIS

on:
  push:
    branches: [master]
  pull_request:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The image is Alpine 3.15, whose musl cannot load the runner's
    # Node 24, so JavaScript actions run on the host and only the
    # build steps run inside the image.
    env:
      ORBIS_IMAGE: reallibretroretroarch/libretro-build-orbis:latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile RA
      run: |
        docker run --rm --user root -v "$PWD":/src -w /src "$ORBIS_IMAGE" bash -c '
          set -e
          apk add ncurses-dev make bash python2
          apk add libintl icu-dev wget
          wget https://dot.net/v1/dotnet-install.sh && chmod 755 dotnet-install.sh && ./dotnet-install.sh -c 3.0 --install-dir ~/cli
          export PATH=~/cli:$PATH # .net cli
          make -f Makefile.orbis -j$(getconf _NPROCESSORS_ONLN) HAVE_STATIC_DUMMY=1 info all
          clang --version
          orbis-ld --version
        '

    - name: Get short SHA
      id: slug
      run: echo "::set-output name=sha8::$(echo ${GITHUB_SHA} | cut -c1-8)"

    - uses: actions/upload-artifact@v4
      with:
        name: bin-${{ steps.slug.outputs.sha8 }}
        path: |
          retroarch_orbis.elf
          retroarch_orbis.oelf
          retroarch_orbis.self
