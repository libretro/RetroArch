name: DLSS staging compile checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/ci_local.py run Compile-Matrix --job compile-matrix
  no-threads:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libvulkan-dev libx11-dev libxext-dev libasound2-dev libudev-dev
      - run: ./configure --disable-threads --disable-qt --disable-opengl --disable-vulkan --disable-x11 --disable-wayland
      - run: make -j4
