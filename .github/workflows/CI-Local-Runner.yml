name: CI local workflow runner

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci-local-selftest:
    name: tools/ci_local.py reads and runs every workflow
    runs-on: ubuntu-latest
    env:
      APT_PKGS: python3-yaml openssl
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 10
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Self-test
        shell: bash
        run: |
          set -eu
          # Every workflow parses exactly as PyYAML reads it, every job and
          # matrix combination resolves in a dry run, and a fixture job runs
          # with GitHub's step semantics.
          python3 tools/ci_local.py selftest

      - name: Every runner job installs through apt-install.sh
        shell: bash
        run: |
          set -eu
          # A bare apt-get waits on a stalled mirror until the job is
          # cancelled, and fetches every package again each run.
          python3 tools/ci_apt_check.py --selftest
          python3 tools/ci_apt_check.py

      - name: Every workflow's paths filter names the samples it runs
        shell: bash
        run: |
          set -eu
          # A workflow skips a push that touches only samples it does not
          # build or run; a step that starts naming another sample, or a
          # sample's files that start reaching into another, leave the
          # filter written by tools/ci_paths.py out of date.
          python3 tools/ci_paths.py --check

      - name: compile_commands.py self-test
        shell: bash
        run: |
          set -eu
          python3 tools/compile_commands.py --selftest

      - name: core_sign.py self-test and core signature fixtures
        shell: bash
        run: |
          set -eu
          # core_sign.py refuses OpenSSL older than 3.2 with status 3, so
          # on such a runner the self-test runs only its offline checks.
          # The fixture check rebuilds the signed headers and verifies the
          # signatures on any OpenSSL, and signs them again only on 3.2.
          python3 -I tools/core_sign.py --self-test || test $? -eq 3
          python3 -I samples/tasks/core_signature/gen_fixtures.py --check

      - name: A checker workflow, run through the runner
        shell: bash
        run: |
          set -eu
          python3 tools/ci_local.py run Extern-C-Prototype-Check
