name: CI OpenXR (stand-in runtime, desktop headset path)

on:
  push:
    branches:
      - master
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/Linux-openxr-input.yml'
    # ci_paths: end
  pull_request:
    branches:
      - master
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/Linux-openxr-input.yml'
    # ci_paths: end
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  openxr-input:
    name: OpenXR input and shared units against a stand-in runtime
    runs-on: ubuntu-latest
    env:
      APT_PKGS: pkg-config libegl-dev libgl-dev libx11-dev
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 10
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Run input/common/input_openxr.c against a stand-in runtime
        working-directory: samples/input/openxr_input
        shell: bash
        run: |
          set -euo pipefail
          # The headset's controllers, the desktop's and the Quest's, as
          # they ship, against a runtime and a frontend the test stands
          # in for: what the actions give the RetroPad, Touch's menu
          # button, the laser on a frame and on the menu, rumble, and
          # nothing held when the runtime has nothing to give.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ./openxr_input_test | tee openxr_input.log
          grep -q "PASS openxr_input_test" openxr_input.log
          make clean
          rm -f openxr_input.log

      - name: Run the shared OpenXR units against a stand-in runtime
        working-directory: samples/openxr/core
        shell: bash
        run: |
          set -euo pipefail
          # The Makefile leaves the desktop GL host's tests out where
          # these are not found, and the run still passes.
          pkg-config --exists egl x11 gl
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ./openxr_core_test | tee openxr_core.log
          grep -q "PASS openxr_core_test" openxr_core.log
          make clean
          rm -f openxr_core.log

      - name: Run the shared OpenXR units under TSan
        working-directory: samples/openxr/core
        shell: bash
        run: |
          set -euo pipefail
          # The XR thread, the tick waiters and the lock gaps.
          pkg-config --exists egl x11 gl
          make clean SANITIZER=thread && make -j$(nproc) all SANITIZER=thread
          ./openxr_core_test | tee openxr_core.log
          grep -q "PASS openxr_core_test" openxr_core.log
          make clean
          rm -f openxr_core.log

  openxr-haptics:
    name: Desktop haptic results (Linux sanitizers, Windows build)
    runs-on: ubuntu-latest
    env:
      APT_PKGS: gcc-mingw-w64-x86-64
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 10
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Run desktop haptics against scripted runtime results
        working-directory: samples/input/openxr_haptics
        shell: bash
        run: |
          set -eu
          make clean
          make SANITIZER=address,undefined check
          make clean
          make SANITIZER=thread check
          make clean
          make CC=x86_64-w64-mingw32-gcc all
          make clean

  openxr-loader-threads:
    name: OpenXR loader under concurrent use (TSan, ASan+UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Run deps/openxr's loader from several threads
        working-directory: samples/openxr/loader_threads
        shell: bash
        run: |
          set -eu
          # The loader shares its runtime, active instance, recorder and
          # messenger tables and property set between threads with no
          # lock. Threads enumerate, create, reinitialize and log against
          # a stand-in runtime while the main thread cycles instances and
          # messengers; a race or a use-after-free in any of it fails.
          make clean
          make SANITIZER=thread check
          make clean
          make SANITIZER=address,undefined check
          make clean

  openxr-desktop:
    name: Desktop headset output with the in-tree loader
    runs-on: ubuntu-latest
    env:
      APT_PKGS: build-essential pkg-config libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libx11-dev libx11-xcb-dev libxext-dev libxrandr-dev libxinerama-dev libxxf86vm-dev libxv-dev libxkbcommon-dev libwayland-dev wayland-protocols libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev libusb-1.0-0-dev libvulkan-dev libdbus-1-dev zlib1g-dev cmake ninja-build xvfb xauth openbox weston mesa-vulkan-drivers
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 10
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Build SDL3 from a pinned release
        shell: bash
        run: |
          set -eu
          # For the SDL3 contexts' native windows below; the runner image
          # ships no libsdl3-dev. samples-gfx's recipe, with GL and
          # Vulkan.
          SDL3_VER=3.2.20
          if [ ! -f /opt/sdl3/lib/pkgconfig/sdl3.pc ]; then
             curl -fsSL --retry 3 -o /tmp/sdl3.tar.gz \
                "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VER/SDL3-$SDL3_VER.tar.gz"
             echo "467600ae090dd28616fa37369faf4e3143198ff1da37729b552137e47f751a67  /tmp/sdl3.tar.gz" \
                | sha256sum -c -
             tar -C /tmp -xzf /tmp/sdl3.tar.gz
             cmake -S "/tmp/SDL3-$SDL3_VER" -B /tmp/sdl3-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
                -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_X11=ON -DSDL_WAYLAND=ON \
                -DSDL_OPENGL=ON -DSDL_OPENGLES=ON -DSDL_VULKAN=ON \
                -DCMAKE_INSTALL_PREFIX=/opt/sdl3 -DCMAKE_INSTALL_LIBDIR=lib \
                > /tmp/sdl3-cmake.log
             ninja -C /tmp/sdl3-build > /tmp/sdl3-build.log
             sudo ninja -C /tmp/sdl3-build install > /tmp/sdl3-install.log
          fi
          echo "PKG_CONFIG_PATH=/opt/sdl3/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/sdl3/lib" >> "$GITHUB_ENV"

      - name: Build RetroArch with OpenXR
        shell: bash
        run: |
          set -eu
          # OpenXR is opt-in; the vendored Khronos loader is built into
          # the tree, so nothing has to be installed. Qt has to go: the
          # menu harness below replaces main(), which lives in ui_qt.o
          # with Qt enabled.
          # The screens' windows too, which video_screens_test runs.
          ./configure --disable-qt --enable-openxr --enable-video_windows
          grep -q '^HAVE_OPENXR = 1' config.mk
          grep -q '^HAVE_VIDEO_WINDOWS = 1' config.mk
          grep -q '^HAVE_SDL3 = 1' config.mk
          make -j$(nproc)
          # Vulkan's headset host and the desktop GL drivers', side by
          # side.
          test -f obj-unix/release/gfx/common/vulkan_openxr.o
          test -f obj-unix/release/gfx/common/gl_openxr.o
          test -f obj-unix/release/gfx/common/openxr_binding_gl.o

      - name: Build and run video_screens_test
        shell: bash
        run: |
          set -eu
          python3 samples/settings/video_screens/build.py \
            --output-dir "$RUNNER_TEMP/video-screens"

      - name: Native windows on X11 (Xvfb, Openbox, llvmpipe, lavapipe)
        shell: bash
        run: |
          set -eu
          # Each context's secondary-screen windows through its table,
          # on a real main window: events, placement, fullscreen, GL
          # binding and failures, titles, a restart. Under a reparenting
          # window manager; the fixture's own deadlines bound each step.
          export LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 SDL_VIDEO_DRIVER=x11
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX" bash -c '
             set -eu
             openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
             sleep 1
             for c in x egl_x vk_x gl_sdl3 vk_sdl3; do
                echo "== $c"
                timeout 300 "$RUNNER_TEMP/video-screens/video_screens_test" \
                   --native-windows $c
             done
             kill %1'

      - name: Native windows on Wayland (Weston headless, llvmpipe, lavapipe)
        shell: bash
        run: |
          set -eu
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=pixman --width=1280 \
             --height=720 --socket=ra-native --no-config \
             > "$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill $weston_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
             [ -S "$XDG_RUNTIME_DIR/ra-native" ] && break
             sleep 0.5
          done
          unset DISPLAY
          export WAYLAND_DISPLAY=ra-native LIBGL_ALWAYS_SOFTWARE=1
          for c in wayland "wayland gl" vk_wayland; do
             echo "== $c"
             timeout 300 "$RUNNER_TEMP/video-screens/video_screens_test" \
                --native-windows $c
          done

      - name: Build and run stereo_headset_test
        shell: bash
        run: |
          set -eu
          # The Stereo 3D & Screens list, with Headset Output off and
          # on under each driver that has a headset path, against the
          # shipping menu objects.
          samples/menu/stereo_headset/build.sh
          ./samples/menu/stereo_headset/stereo_headset_test
          make -C samples/menu/stereo_headset clean

      - name: Run the headset end-to-end runner's own tests
        shell: bash
        run: |
          set -eu
          # samples/openxr/e2e/run.py needs a runtime and a GPU; its
          # case selection and its OpenGL lanes do not.
          python3 -m unittest discover -s samples/openxr/e2e -p 'test_*.py'

      - name: Build the OpenXR test layer and the video_views core
        shell: bash
        run: |
          set -eu
          # The API layer the Monado end-to-end check records through,
          # against the vendored headers, and the core it drives.
          make -C samples/openxr/test_layer clean && make -C samples/openxr/test_layer -j$(nproc) all
          test -f samples/openxr/test_layer/libxr_test_layer.so
          make -C samples/cores/video_views clean && make -C samples/cores/video_views -j$(nproc) all
          test -f samples/cores/video_views/video_views_libretro.so
          make -C samples/openxr/test_layer clean
          make -C samples/cores/video_views clean

  openxr-desktop-gl:
    name: Desktop headset output on OpenGL alone, without Vulkan
    runs-on: ubuntu-latest
    env:
      APT_PKGS: build-essential pkg-config libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxxf86vm-dev libxv-dev libxkbcommon-dev libwayland-dev wayland-protocols libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev libusb-1.0-0-dev libdbus-1-dev zlib1g-dev libsdl2-dev xvfb xauth openbox
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 10
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Build RetroArch with OpenXR and no Vulkan
        shell: bash
        run: |
          set -eu
          # The gl and glcore drivers' headset output has to configure,
          # build and link without Vulkan.
          ./configure --disable-qt --enable-openxr --disable-vulkan \
            --enable-video_windows
          grep -q '^HAVE_OPENXR = 1' config.mk
          grep -q '^HAVE_VIDEO_WINDOWS = 1' config.mk
          grep -q '^HAVE_VULKAN = 0' config.mk
          grep -q '^HAVE_SDL2 = 1' config.mk
          make -j$(nproc)
          test -f obj-unix/release/gfx/common/openxr_frame.o
          test -f obj-unix/release/gfx/common/gl_openxr.o
          test ! -e obj-unix/release/gfx/common/vulkan_openxr.o

      - name: Build and run video_screens_test
        shell: bash
        run: |
          set -eu
          python3 samples/settings/video_screens/build.py \
            --output-dir "$RUNNER_TEMP/video-screens"

      - name: Native windows of the SDL2 context (Xvfb, Openbox, llvmpipe)
        shell: bash
        run: |
          set -eu
          # The distribution's SDL 2; the Vulkan job's build has SDL 3
          export LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 SDL_VIDEO_DRIVER=x11
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX" bash -c '
             set -eu
             openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
             sleep 1
             timeout 300 "$RUNNER_TEMP/video-screens/video_screens_test" \
                --native-windows gl_sdl
             kill %1'

      - name: Build and run stereo_headset_test
        shell: bash
        run: |
          set -eu
          # Headset Output under glcore and gl, with no vulkan driver
          # to list it under.
          samples/menu/stereo_headset/build.sh
          ./samples/menu/stereo_headset/stereo_headset_test
          make -C samples/menu/stereo_headset clean
