name: CI VideoToolbox hardware encode
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/MacOS-videotoolbox-encode.yml'
      - 'gfx/common/videotoolbox_encode*.h'
      - 'libretro-common/formats/h265/rh265_sps_crop.c'
      - 'libretro-common/include/formats/rh265_sps_crop.h'
      - 'record/record_gpu_capture_metal.*'
      - 'record/record_gpu_worker_vt*'
      - 'record/shaders/capture_metal.*'
      - 'record/shaders/generate_metal.py'
      - 'samples/record/videotoolbox_encode/**'
      - 'libretro-common/include/retro_atomic.h'
  pull_request:
    paths:
      - '.github/workflows/MacOS-videotoolbox-encode.yml'
      - 'gfx/common/videotoolbox_encode*.h'
      - 'libretro-common/formats/h265/rh265_sps_crop.c'
      - 'libretro-common/include/formats/rh265_sps_crop.h'
      - 'record/record_gpu_capture_metal.*'
      - 'record/record_gpu_worker_vt*'
      - 'record/shaders/capture_metal.*'
      - 'record/shaders/generate_metal.py'
      - 'samples/record/videotoolbox_encode/**'
      - 'libretro-common/include/retro_atomic.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encode:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install independent test decoder
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || brew install ffmpeg
      - name: Portable ownership and failure contracts
        working-directory: samples/record/videotoolbox_encode
        run: make check thread_test worker_thread_test && ./thread_test && ./worker_thread_test
      - name: Native hardware encoder and independent pixels
        run: |
          rc=0
          python3 samples/record/videotoolbox_encode/run.py --native || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::warning::Some required hardware encode cases unavailable; native encode acceptance is incomplete"
            exit 0
          fi
          exit "$rc"
      - name: Native Metal to VideoToolbox queue-worker pipeline
        if: ${{ !cancelled() }}
        run: |
          rc=0
          PIPELINE_ARTIFACT_DIR="$RUNNER_TEMP/metal-vt-evidence" python3 samples/record/videotoolbox_encode/pipeline_run.py || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::warning::Native pipeline hardware unavailable; integrated recording acceptance is incomplete"
            exit 0
          fi
          exit "$rc"
      - name: Independent native Metal capture pixels and ownership
        if: ${{ !cancelled() }}
        run: |
          rc=0
          python3 samples/record/videotoolbox_encode/capture_run.py || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::warning::Metal capture device unavailable; native capture acceptance is incomplete"
            exit 0
          fi
          exit "$rc"
      - name: Preserve native pipeline evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: metal-vt-pipeline-evidence
          path: ${{ runner.temp }}/metal-vt-evidence
          if-no-files-found: warn
