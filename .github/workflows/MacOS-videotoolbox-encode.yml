name: CI VideoToolbox hardware encode
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/MacOS-videotoolbox-encode.yml'
      - 'gfx/common/videotoolbox_encode*.h'
      - 'libretro-common/formats/h265/rh265_sps_crop.c'
      - 'libretro-common/include/formats/rh265_sps_crop.h'
      - 'record/drivers/record_metal.*'
      - 'record/drivers/record_avfoundation*'
      - 'record/record_driver.*'
      - 'gfx/drivers/metal.m'
      - 'Makefile.common'
      - 'griffin/griffin*'
      - 'record/record_gpu_capture_metal.*'
      - 'record/record_gpu_session_metal.*'
      - 'record/record_gpu_dispatch_metal.*'
      - 'record/record_gpu_worker_vt*'
      - 'record/record_vt_packet.*'
      - 'record/record_stream_vt.*'
      - 'record/record_stream_output_vt.*'
      - 'record/record_stream_session_vt_native.h'
      - 'samples/record/rtmp_stream/**'
      - 'libretro-common/net/net_rtmp*'
      - 'libretro-common/include/net/net_rtmp*'
      - 'libretro-common/formats/flv/**'
      - 'libretro-common/include/formats/rflv_mux.h'
      - 'libretro-common/include/formats/rav1_sequence.h'
      - 'libretro-common/include/formats/video_color.h'
      - 'record/record_audio_queue.*'
      - 'record/record_at_audio.*'
      - 'record/record_at_resample.*'
      - 'samples/record/audiotoolbox_audio/**'
      - 'record/record_avfoundation_worker*'
      - 'record/record_avfoundation_session*'
      - 'record/record_mux_avfoundation.*'
      - 'record/shaders/capture_metal.*'
      - 'record/shaders/generate_metal.py'
      - 'samples/record/videotoolbox_encode/**'
      - 'samples/record/metal_frontend/**'
      - 'libretro-common/include/retro_atomic.h'
  pull_request:
    paths:
      - '.github/workflows/MacOS-videotoolbox-encode.yml'
      - 'gfx/common/videotoolbox_encode*.h'
      - 'libretro-common/formats/h265/rh265_sps_crop.c'
      - 'libretro-common/include/formats/rh265_sps_crop.h'
      - 'record/drivers/record_metal.*'
      - 'record/drivers/record_avfoundation*'
      - 'record/record_driver.*'
      - 'gfx/drivers/metal.m'
      - 'Makefile.common'
      - 'griffin/griffin*'
      - 'record/record_gpu_capture_metal.*'
      - 'record/record_gpu_session_metal.*'
      - 'record/record_gpu_dispatch_metal.*'
      - 'record/record_gpu_worker_vt*'
      - 'record/record_vt_packet.*'
      - 'record/record_stream_vt.*'
      - 'record/record_stream_output_vt.*'
      - 'record/record_stream_session_vt_native.h'
      - 'samples/record/rtmp_stream/**'
      - 'libretro-common/net/net_rtmp*'
      - 'libretro-common/include/net/net_rtmp*'
      - 'libretro-common/formats/flv/**'
      - 'libretro-common/include/formats/rflv_mux.h'
      - 'libretro-common/include/formats/rav1_sequence.h'
      - 'libretro-common/include/formats/video_color.h'
      - 'record/record_audio_queue.*'
      - 'record/record_at_audio.*'
      - 'record/record_at_resample.*'
      - 'samples/record/audiotoolbox_audio/**'
      - 'record/record_avfoundation_worker*'
      - 'record/record_avfoundation_session*'
      - 'record/record_mux_avfoundation.*'
      - 'record/shaders/capture_metal.*'
      - 'record/shaders/generate_metal.py'
      - 'samples/record/videotoolbox_encode/**'
      - 'samples/record/metal_frontend/**'
      - 'libretro-common/include/retro_atomic.h'
  workflow_dispatch:
    inputs:
      ios_sdk_only:
        description: 'Audit production VideoToolbox declarations against real iOS SDKs'
        type: boolean
        default: false
      native_aac_only:
        description: 'Run native AudioToolbox AAC acceptance without GPU/frontend jobs'
        type: boolean
        default: false
      frontend_stream_only:
        description: 'Run frontend streaming acceptance and both native frontend links'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  stream-native:
    if: ${{ !inputs.ios_sdk_only && !inputs.native_aac_only && !inputs.frontend_stream_only }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install independent streaming receiver
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || brew install ffmpeg
      - name: Pollable producer wake and socket readiness
        run: make -C libretro-common/samples/net/wake check
      - name: Native VT and AAC over RTMP and TLS
        env:
          VT_STREAM_ARTIFACT_DIR: ${{ runner.temp }}/vt-stream-evidence
        run: python3 samples/record/rtmp_stream/native_vt_run.py
      - name: Save native streaming acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vt-stream-evidence
          path: ${{ runner.temp }}/vt-stream-evidence
          if-no-files-found: ignore
      - name: Native Metal factory RTMP and TLS with ARC
        if: ${{ !cancelled() }}
        env:
          VT_STREAM_ARTIFACT_DIR: ${{ runner.temp }}/vt-metal-stream-arc
        run: python3 samples/record/rtmp_stream/native_vt_run.py --metal --ownership arc
      - name: Native Metal factory RTMP and TLS with manual reference counting
        if: ${{ !cancelled() }}
        env:
          VT_STREAM_ARTIFACT_DIR: ${{ runner.temp }}/vt-metal-stream-mrc
        run: python3 samples/record/rtmp_stream/native_vt_run.py --metal --ownership mrc
      - name: Save native Metal streaming acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vt-metal-stream-evidence
          path: |
            ${{ runner.temp }}/vt-metal-stream-arc
            ${{ runner.temp }}/vt-metal-stream-mrc
          if-no-files-found: ignore
      - name: Native URL-owning Metal streaming dispatcher with ARC
        if: ${{ !cancelled() }}
        env:
          VT_STREAM_ARTIFACT_DIR: ${{ runner.temp }}/vt-metal-dispatch-arc
        run: python3 samples/record/rtmp_stream/native_vt_run.py --dispatcher --ownership arc
      - name: Native URL-owning Metal streaming dispatcher with manual reference counting
        if: ${{ !cancelled() }}
        env:
          VT_STREAM_ARTIFACT_DIR: ${{ runner.temp }}/vt-metal-dispatch-mrc
        run: python3 samples/record/rtmp_stream/native_vt_run.py --dispatcher --ownership mrc
      - name: Save native Metal dispatcher acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vt-metal-dispatch-evidence
          path: |
            ${{ runner.temp }}/vt-metal-dispatch-arc
            ${{ runner.temp }}/vt-metal-dispatch-mrc
          if-no-files-found: ignore
  aac-native:
    if: ${{ !inputs.ios_sdk_only && (inputs.native_aac_only || !inputs.frontend_stream_only) }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install independent AAC test decoder
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: AudioToolbox AAC callback ownership contracts
        run: make -C samples/record/audiotoolbox_audio check
      - name: Native AudioToolbox AAC packets and independent timing
        env:
          AUDIO_TOOLBOX_ARTIFACT_DIR: ${{ runner.temp }}/audiotoolbox-aac-evidence
        run: make -C samples/record/audiotoolbox_audio native-check
      - name: Save AudioToolbox AAC acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: audiotoolbox-aac-evidence
          path: ${{ runner.temp }}/audiotoolbox-aac-evidence
          if-no-files-found: ignore
      - name: Native source-rate conversion and independent AAC timing
        env:
          AUDIO_TOOLBOX_SRC_ARTIFACT_DIR: ${{ runner.temp }}/audiotoolbox-src-evidence
        run: make -C samples/record/audiotoolbox_audio native-src-check
      - name: Save AudioToolbox SRC acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: audiotoolbox-src-evidence
          path: ${{ runner.temp }}/audiotoolbox-src-evidence
          if-no-files-found: ignore
  encode:
    if: ${{ !inputs.ios_sdk_only && !inputs.native_aac_only && !inputs.frontend_stream_only }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install independent test decoder
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || brew install ffmpeg
      - name: Native encoder and Metal device inventory
        if: ${{ !cancelled() }}
        run: ENCODER_DEVICE_ARTIFACT="$RUNNER_TEMP/metal-vt-devices.json" python3 samples/record/videotoolbox_encode/device_run.py
      - name: Portable ownership and failure contracts
        working-directory: samples/record/videotoolbox_encode
        run: make check thread_test worker_thread_test audio_thread_test av_session_thread_test && ./thread_test && ./worker_thread_test && ./audio_thread_test && ./av_session_thread_test
      - name: VideoToolbox AAC streaming ownership and independent wire clock
        run: make -C samples/record/rtmp_stream vt-check
      - name: Native AAC property ABI and advertised rates
        run: make -C samples/record/videotoolbox_encode native-audio-check
      - name: Native hardware encoder and independent pixels
        run: |
          rc=0
          python3 samples/record/videotoolbox_encode/run.py --native || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::warning::Some required hardware encode cases unavailable; native encode acceptance is incomplete"
            exit 0
          fi
          exit "$rc"
      - name: Native Metal to VideoToolbox queue-worker pipeline
        if: ${{ !cancelled() }}
        run: |
          rc=0
          PIPELINE_ARTIFACT_DIR="$RUNNER_TEMP/metal-vt-evidence" python3 samples/record/videotoolbox_encode/pipeline_run.py || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::warning::Native pipeline hardware unavailable; integrated recording acceptance is incomplete"
            exit 0
          fi
          exit "$rc"
      - name: Independent native Metal capture pixels and ownership
        if: ${{ !cancelled() }}
        run: |
          rc=0
          python3 samples/record/videotoolbox_encode/capture_run.py || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::warning::Metal capture device unavailable; native capture acceptance is incomplete"
            exit 0
          fi
          exit "$rc"
      - name: Native compressed MP4 and AAC worker mux
        if: ${{ !cancelled() }}
        run: |
          rc=0
          PIPELINE_ARTIFACT_DIR="$RUNNER_TEMP/metal-vt-mux-evidence" python3 samples/record/videotoolbox_encode/pipeline_run.py --mux || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::warning::Native mux hardware unavailable; A/V acceptance is incomplete"
            exit 0
          fi
          exit "$rc"
      - name: Native owned recording session
        if: ${{ !cancelled() }}
        run: |
          rc=0
          PIPELINE_ARTIFACT_DIR="$RUNNER_TEMP/metal-vt-session-evidence" python3 samples/record/videotoolbox_encode/pipeline_run.py --session || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::warning::Native owned session hardware unavailable; controller acceptance is incomplete"
            exit 0
          fi
          exit "$rc"
      - name: Native renderer-device cold recording startup
        if: ${{ !cancelled() }}
        run: |
          rc=0
          PIPELINE_ARTIFACT_DIR="$RUNNER_TEMP/metal-vt-cold-evidence" python3 samples/record/videotoolbox_encode/pipeline_run.py --cold || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::warning::Renderer-device encoder unavailable; cold startup acceptance is incomplete"
            exit 0
          fi
          exit "$rc"
      - name: Native dedicated recording dispatcher
        if: ${{ !cancelled() }}
        run: |
          rc=0
          PIPELINE_ARTIFACT_DIR="$RUNNER_TEMP/metal-vt-dispatch-evidence" python3 samples/record/videotoolbox_encode/pipeline_run.py --dispatch || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::warning::Dispatcher hardware unavailable; recording dispatch acceptance is incomplete"
            exit 0
          fi
          exit "$rc"
      - name: Preserve native pipeline evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: metal-vt-pipeline-evidence
          path: |
            ${{ runner.temp }}/metal-vt-evidence
            ${{ runner.temp }}/metal-vt-mux-evidence
            ${{ runner.temp }}/metal-vt-session-evidence
            ${{ runner.temp }}/metal-vt-cold-evidence
            ${{ runner.temp }}/metal-vt-dispatch-evidence
            ${{ runner.temp }}/metal-vt-devices.json
          if-no-files-found: warn

  frontend-build:
    if: ${{ !inputs.ios_sdk_only && !inputs.native_aac_only && !inputs.frontend_stream_only }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Configure native Metal recording frontend
        run: |
          set -eu
          ./configure --enable-metal --enable-avf --enable-threads --enable-configfile --enable-webmplayer \
            --disable-qt --disable-ffmpeg --disable-discord --disable-cheevos \
            --disable-networking --disable-sdl2 --disable-sdl --disable-translate \
            --disable-update_cores --disable-update_assets --disable-online_updater \
            --disable-cdrom --disable-7zip --disable-ssl
          for feature in HAVE_METAL HAVE_AVF HAVE_THREADS HAVE_CONFIGFILE HAVE_WEBMPLAYER; do
            grep -Eq "^#define $feature 1" config.h
          done
      - name: Build and link real frontend with native recording enabled
        run: |
          set -eu
          make -j"$(sysctl -n hw.ncpu)" MINVERFLAGS="-mmacosx-version-min=$(sw_vers -productVersion)"
          test -x retroarch
          nm retroarch | grep '_record_metal_gpu_capture'

      - name: Independent real frontend GPU recording
        run: |
          set -eu
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || brew install ffmpeg
          cc -dynamiclib -std=gnu89 -Ilibretro-common/include samples/record/metal_frontend/core.c -o "$RUNNER_TEMP/metal-record-core.dylib" -lm
          python3 samples/record/metal_frontend/run.py --retroarch ./retroarch --core "$RUNNER_TEMP/metal-record-core.dylib" --output-dir "$RUNNER_TEMP/metal-frontend-recordings"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: metal-frontend-recordings
          path: ${{ runner.temp }}/metal-frontend-recordings
          if-no-files-found: warn

  frontend-stream-build:
    if: ${{ !inputs.ios_sdk_only && !inputs.native_aac_only }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        threads: [enable, disable]
    steps:
      - uses: actions/checkout@v6
      - name: Configure network-enabled Metal frontend
        run: |
          set -eu
          stream_options=
          if [ "${{ matrix.threads }}" = disable ]; then
            stream_options="--enable-rtmp --enable-rflv"
          fi
          ./configure --enable-metal --enable-avf --${{ matrix.threads }}-threads --enable-configfile --enable-webmplayer \
            --disable-qt --disable-ffmpeg --disable-discord --disable-cheevos \
            --enable-networking --disable-sdl2 --disable-sdl --disable-translate \
            --disable-update_cores --disable-update_assets --disable-online_updater \
            --disable-cdrom --disable-7zip --enable-ssl --enable-retrossl $stream_options
          for feature in HAVE_METAL HAVE_AVF HAVE_NETWORKING HAVE_CRYPTO HAVE_RTMP HAVE_RFLV HAVE_RETROSSL; do
            grep -Eq "^#define $feature 1" config.h
          done
      - name: Link network worker and threadless fallback
        run: |
          set -eu
          make -j"$(sysctl -n hw.ncpu)" \
            MINVERFLAGS="-mmacosx-version-min=$(sw_vers -productVersion)"
          test -x retroarch
          nm retroarch | grep '_record_gpu_dispatch_metal_new_stream'
      - name: Native frontend streaming through command start and stop
        if: ${{ matrix.threads == 'enable' }}
        run: |
          set -eu
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || brew install ffmpeg
          cc -dynamiclib -std=gnu89 -Ilibretro-common/include samples/record/metal_frontend/core.c -o "$RUNNER_TEMP/metal-stream-core.dylib" -lm
          python3 samples/record/metal_frontend/stream.py --retroarch ./retroarch --core "$RUNNER_TEMP/metal-stream-core.dylib" --video-buffer-frames 2 --output-dir "$RUNNER_TEMP/metal-frontend-stream/h264"
          python3 samples/record/metal_frontend/stream.py --retroarch ./retroarch --core "$RUNNER_TEMP/metal-stream-core.dylib" --codec hevc --source-rate 32040.5 --video-buffer-frames 16 --output-dir "$RUNNER_TEMP/metal-frontend-stream/fractional"
          python3 samples/record/metal_frontend/stream.py --retroarch ./retroarch --core "$RUNNER_TEMP/metal-stream-core.dylib" --channels 1 --source-rate 44100 --video-buffer-frames 8 --output-dir "$RUNNER_TEMP/metal-frontend-stream/mono"
          python3 samples/record/metal_frontend/stream.py --retroarch ./retroarch --core "$RUNNER_TEMP/metal-stream-core.dylib" --video-only --video-buffer-frames 4 --output-dir "$RUNNER_TEMP/metal-frontend-stream/video-only"
      - name: Save real frontend streaming evidence
        if: ${{ always() && matrix.threads == 'enable' }}
        uses: actions/upload-artifact@v4
        with:
          name: metal-frontend-stream-evidence
          path: ${{ runner.temp }}/metal-frontend-stream
          if-no-files-found: ignore

  frontend-contracts:
    if: ${{ !inputs.ios_sdk_only && !inputs.native_aac_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Source-clock capture and backpressure under sanitizers
        run: make -C samples/record/metal_frontend check SANITIZER=address,undefined

  ios-sdk:
    if: ${{ inputs.ios_sdk_only }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Compile production VideoToolbox headers for iOS and simulator
        run: python3 samples/record/videotoolbox_encode/ios_sdk_check.py --output-dir "${{ runner.temp }}/vt-ios-sdk"
      - name: Save actual SDK diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vt-ios-sdk
          path: ${{ runner.temp }}/vt-ios-sdk
          if-no-files-found: error
