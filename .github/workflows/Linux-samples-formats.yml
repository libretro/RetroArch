name: CI Linux samples/formats

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  samples-formats:
    name: Build and run samples/formats
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install dependencies
        timeout-minutes: 5
        run: |
          pkgs="build-essential ffmpeg"
          if dpkg -s $pkgs >/dev/null 2>&1; then
            echo "All packages already present on runner image; skipping apt."
            exit 0
          fi
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update failed (attempt $i); retrying in 10s"
            sleep 10
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and run dts_lpcm_test (plain, ASan + UBSan)
        shell: bash
        working-directory: samples/formats/dts_lpcm
        run: |
          set -eu
          # The DTS frame layer and the LPCM codec against ffmpeg.
          #
          # rdts reads frames, it does not decode them, so what is
          # checked is that every frame is found where ffmpeg's
          # encoder put it, that the rate and the arrangement agree
          # with ffprobe's reading of the same file, and that a stream
          # byte-swapped or packed fourteen bits to the word reads
          # back to the same core - which is what a receiver and a
          # decoder are handed.
          #
          # rlpcm does decode, and is bit-exact: the samples go out
          # through ffmpeg's own converters and come back the same, at
          # 16 and 24 bits and both byte orders, and what rlpcm writes
          # back is the bytes it read. 20-bit has no ffmpeg format to
          # compare against - two samples to five bytes is a disc
          # packing - so it is checked against itself, and the DVD and
          # Blu-ray headers against their field layouts. The
          # audio_transfer arm is driven too: chunked reads against
          # the codec's own output, the compressed frontier, and
          # seeks, which for constant-size frames land exactly.
          #
          # And the pass-through route, which is what a format with no
          # decoder is for: every frame repacked to the plain core,
          # put in the IEC 61937 burst its sample count calls for, and
          # read back out of that burst byte for byte.
          make clean all
          ./dts_lpcm_test
          echo "[pass] dts_lpcm_test"
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./dts_lpcm_test
          echo "[pass] dts_lpcm_test (ASan)"

      - name: Build and run image_decode_fuzz_test (ASan + UBSan + LSan)
        shell: bash
        working-directory: samples/formats/image_decode_fuzz
        run: |
          set -eu
          # Malformed-input sweep for the BMP, TGA, DDS and WebP decoders in
          # libretro-common/formats.  All three take dimensions and
          # layout from a header the file supplies and size their
          # output from it, which is where this kind of arithmetic
          # goes wrong, and none of the four had any test at all.
          # (WebP is told its buffer length, so it is the least
          # exposed of them; its chunk walk still trusts sizes that
          # came out of the file.)
          #
          # It found one on its first run: rbmp_proc_reset() gated the
          # free of output_image on phase != RBMP_PHASE_IDLE, but
          # rbmp_begin() allocates that surface before it sets any
          # phase and returns false between the two for a palette
          # header claiming a bits-per-pixel other than 4 or 8.  Every
          # such image leaked the surface, reachable from any
          # malformed or hostile BMP.  Leak detection is therefore
          # switched on explicitly here rather than left to the
          # default.
          #
          # The sweep truncates each seed at every length and sets
          # every header byte to each of six interesting values,
          # including the ones that make dimensions enormous.  The
          # count of inputs that decode successfully is asserted
          # inside the test, so a sweep where the seeds stopped being
          # accepted would fail rather than exercise only the reject
          # paths and report a pass.  That count is kept per format, not
          # just in total, so one decoder quietly ceasing to accept its
          # seed cannot hide behind the other three.
          make clean all SANITIZER=address,undefined
          test -x image_decode_fuzz_test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
             timeout 120 ./image_decode_fuzz_test
          echo "[pass] image_decode_fuzz_test"
