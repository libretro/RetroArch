          make clean all
          WINE=$(command -v wine64 || command -v wine || echo /usr/lib/wine/wine64)
          WINEDEBUG=-all timeout 180 "$WINE" ./xinput_rumble_test.exe
          make clean
          echo "[pass] xinput_rumble_test (wine)"

      - name: Build and run winraw_keyboards_test (mingw + Wine)
        shell: bash
        working-directory: samples/input/winraw_keyboards
        run: |
          set -eu
          # The raw input driver reads every keyboard as one; it also
          # keeps the list of them and names them for the menu's
          # Input Information. The real driver under Wine, with the
          # list of raw input devices it asks for replaced by one the
          # test controls: the keyboards and only those are listed,
          # oldest first; a key from one not in the list has the list
          # made again at the end of that poll, an injected key never,
          # not more than once a second; a keyboard that was unplugged
          # is out of the list at the poll after Windows says devices
          # changed; and all of them still feed the one key state.
          # And a port can be given one of them (Keyboard Index): two
          # ports with a keyboard each read the same bound key each
          # from its own, as a bind, in the bind mask and as the
          # port's keyboard; hotkeys and the open menu answer to every
          # keyboard; a port given a keyboard that is not there reads
          # them all; a key held on two keyboards stays down until
          # both let go; and a key held on a keyboard when it is
          # unplugged is let go with a key-up. And what is listed is
          # the keyboards on the desk, not raw input's: the raw
          # keyboards that are parts of one device are one keyboard,
          # the terminal server's is left out, and so is a mouse
          # whose buttons send keys.
          trap 'wineserver -k >/dev/null 2>&1 || true' EXIT
          make clean all
          WINEDEBUG=-all timeout 300 make check
          make clean
          echo "[pass] winraw_keyboards_test (wine)"

      - name: Build and run winraw_joypad_poll_test (mingw + Wine)
        shell: bash
        working-directory: samples/input/winraw_joypad_poll
        run: |
          set -eu
          # input/drivers_joypad/winraw_joypad.c with its controllers
          # read by the poll. The real driver under Wine, started from
          # a second thread as it is from the video thread: with
          # RETROARCH_RAWINPUT_POLL=0 init makes the window as it
          # always did; otherwise init makes none and the first poll
          # does, on the polling thread, marking it as one whose pump
          # leaves raw input alone, with one bulk read a poll; a device
          # change waiting for the window is taken by the poll;
          # destroy from another thread - what a controller plugged in
          # causes - has the window gone once its own thread pumps; a
          # restart and a poll make a new one.
          trap 'wineserver -k >/dev/null 2>&1 || true' EXIT
          make clean all
          WINEDEBUG=-all timeout 300 make check
          make clean
          echo "[pass] winraw_joypad_poll_test (wine)"

      - name: Build and run winraw_joypad_newest_test (mingw + Wine)
        shell: bash
        working-directory: samples/input/winraw_joypad_newest
        run: |
          set -eu
          # winraw_joypad parses only the newest report of each report
          # ID per controller out of a bulk read, not every report. The
          # driver, with its HID calls routed to a fake controller that
