        run: |
          set -eu
          . "$GITHUB_WORKSPACE/.github/workflows/scripts/wine-server.sh"
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          timeout 30 make check
          make clean SANITIZER=thread && make -j$(nproc) all SANITIZER=thread
          timeout 30 ./output_writer_test
          make clean CC=x86_64-w64-mingw32-gcc && make -j$(nproc) all CC=x86_64-w64-mingw32-gcc
          WINE="$(command -v wine || command -v wine64 || echo /usr/lib/wine/wine64)"
          WINEDEBUG=-all timeout 60 "$WINE" ./output_writer_test.exe
          WINEDEBUG=-all timeout 60 "$WINE" ./output_writer_test_nothreads.exe
          make clean
      - name: Build and run udev_rumble_test (ASan + UBSan, then TSan)
        shell: bash
        working-directory: samples/input/udev_rumble
        run: |
          set -eu
          # The udev joypad driver writes rumble from a thread of its
          # own. The real driver is given a pad whose descriptor is a
          # pipe and an upload that takes 60 ms: the call returns at
          # once, the latest strength is the one written, a pad that
          # goes is let go of, and stopping the driver ends the
          # writer. Built with threads and without.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          timeout 120 ./udev_rumble_test
          timeout 120 ./udev_rumble_test_nothreads
          make clean SANITIZER=thread && make -j$(nproc) all SANITIZER=thread
          timeout 120 ./udev_rumble_test
          make clean
          echo "[pass] udev_rumble_test"
      - name: Build and run sensor_subdevice_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/sensor_subdevice
        run: |
          set -eu
          # A core's sensor calls for a controller's sub-device (the
          # Nunchuk, a left Joy-Con) through the frontend's wrappers as
          # they ship: passed on with the index once enabled, refused
          # when no driver has it, the controller's own unchanged.
          make clean && make SANITIZER=address,undefined
          UBSAN_OPTIONS=halt_on_error=1 timeout 60 ./sensor_subdevice_test
          make clean
          echo "[pass] sensor_subdevice_test"
      - name: Build and run dingux_rumble_test (ASan + UBSan, then TSan)
        shell: bash
        working-directory: samples/input/dingux_rumble
        run: |
          set -eu
          # The Dingux joypad driver's vibration motor, through evdev
          # and the output writer: the first node that plays a sine is
          # taken, the strengths and gain are written as they change and
          # not again, a motor slow to take an upload does not hold the
          # call, and stopping the driver lets the motor go.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          timeout 120 ./dingux_rumble_test
          timeout 120 ./dingux_rumble_test_nothreads
          make clean SANITIZER=thread && make -j$(nproc) all SANITIZER=thread
          timeout 120 ./dingux_rumble_test
          make clean
          echo "[pass] dingux_rumble_test"
      - name: Build and run udev_player_lights_test (ASan + UBSan, then TSan)
        shell: bash
        working-directory: samples/input/udev_player_lights
        run: |
          set -eu
          # The udev joypad driver lights each pad's player through its
          # LED class devices, found under the pad in a directory laid
          # out as /sys is: a DualSense's five and not its light bar, a
          # DualShock 4's light bar by colour, a DualShock 3's, an Xbox
          # 360 pad's ring and not a receiver's four; out when no port
          # reads it, unless it was never lit. Written by the rumble
          # writer's thread, and without threads by the caller.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 timeout 60 ./udev_player_lights_test
          ASAN_OPTIONS=detect_leaks=1 timeout 60 ./udev_player_lights_test_nothreads
          make clean SANITIZER=thread && make -j$(nproc) all SANITIZER=thread
          timeout 60 ./udev_player_lights_test
          make clean
          echo "[pass] udev_player_lights_test"
      - name: Build and run udev_ds3_pressure_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/udev_ds3_pressure
        run: |
          set -eu
          # A DualShock 3's button pressures, read by the udev joypad
          # driver from the pad's hidraw node into the axes after its
          # own: the newest input report waiting sets them, reports of
          # other IDs are read over, and a node that goes is closed
          # with the pressures back at rest.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 timeout 60 ./udev_ds3_pressure_test
          make clean

      - name: Build and run udev_devices_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/udev_devices
        run: |
          set -eu
          # The udev input driver's listing of keyboards and mice, its
          # numbering of them and what a port reads went in compiled
          # only: it needs devices under /dev/input, which a runner
          # has none of. What the driver knows of a device is a
          # structure in memory, so the real driver is handed a desk
          # of them: a keyboard that is three event devices, a mouse
          # that is two, a power button and a second keyboard. Two
          # keyboards are listed; the mouse is mouse 1 and the
          # keyboard's pointer part is not a mouse; each is told to
          # the frontend by its ids; a port reads its own keyboard's
          # keys and not the other's, and the mouse it is told to.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
             timeout 60 ./udev_devices_test
          make clean
          echo "[pass] udev_devices_test (ASan)"

      - name: Build and run device_pins_test
        shell: bash
        working-directory: samples/input/device_pins
        run: |
          set -eu
          # A port keeps its keyboard by what the keyboard is, not by
          # its place in a list that changes when keyboards are
          # plugged in or out (input/common/input_device_pins.h): two
          # pinned ports each read their own in whatever order the
          # keyboards are listed; with one unplugged the other is
          # still its own port's and the port left without reads none;
          # a single port whose keyboard is away reads every keyboard;
          # two keyboards of one model are two pins. And the same for
          # mice, which have no "every mouse": a pinned port whose
          # mouse is away reads none while another port has its own,
          # and the mouse its number names otherwise.
          make clean && make -j$(nproc) all
          timeout 60 make check
          make clean
          echo "[pass] device_pins_test"

      - name: Build and run keyboard_devices_test
        shell: bash
        working-directory: samples/input/keyboard_devices
        run: |
          set -eu
          # Which of the devices a system reports are the keyboards on
          # the desk (input/common/input_keyboard_devices.h, which the
          # udev input driver lists its keyboards by): a keyboard in
          # three parts is one keyboard; the power button, a headset
          # and a mouse whose buttons send keys are none; two of one
          # model are two; a keyboard with a pointer built in is one.
          make clean && make -j$(nproc) all
          timeout 60 make check
          make clean
          echo "[pass] keyboard_devices_test"

      - name: Build and run xinput_rumble_test (mingw + Wine)
        shell: bash
        working-directory: samples/input/xinput_rumble
        run: |
          set -eu
          . "$GITHUB_WORKSPACE/.github/workflows/scripts/wine-server.sh"
          # The XInput joypad driver writes rumble from a thread of its
          # own. The real driver is given an XInputSetState that takes
          # 60 ms: the call returns at once, the latest strength is the
          # one written, and with the writer stopped the caller writes
          # as it used to.
          make clean && make -j$(nproc) all
          WINE=$(command -v wine64 || command -v wine || echo /usr/lib/wine/wine64)
          WINEDEBUG=-all timeout 180 "$WINE" ./xinput_rumble_test.exe
          make clean
          echo "[pass] xinput_rumble_test (wine)"

      - name: Build and run winraw_keyboards_test (mingw + Wine)
        shell: bash
        working-directory: samples/input/winraw_keyboards
        run: |
          set -eu
          # The raw input driver reads every keyboard as one; it also
          # keeps the list of them and names them for the menu's
          # Input Information. The real driver under Wine, with the
          # list of raw input devices it asks for replaced by one the
          # test controls: the keyboards and only those are listed,
          # oldest first; a key from one not in the list has the list
          # made again at the end of that poll, an injected key never,
          # not more than once a second; a keyboard that was unplugged
          # is out of the list at the poll after Windows says devices
          # changed; and all of them still feed the one key state.
          # And a port can be given one of them (Keyboard Index): two
          # ports with a keyboard each read the same bound key each
          # from its own, as a bind, in the bind mask and as the
          # port's keyboard; hotkeys and the open menu answer to every
          # keyboard; a port given a keyboard that is not there reads
          # them all; a key held on two keyboards stays down until
          # both let go; and a key held on a keyboard when it is
          # unplugged is let go with a key-up. And what is listed is
          # the keyboards on the desk, not raw input's: the raw
          # keyboards that are parts of one device are one keyboard,
          # the terminal server's is left out, and so is a mouse
          # whose buttons send keys.
          trap 'wineserver -k >/dev/null 2>&1 || true' EXIT
          make clean && make -j$(nproc) all
          WINEDEBUG=-all timeout 300 make check
          make clean
          echo "[pass] winraw_keyboards_test (wine)"

      - name: Build and run winraw_joypad_poll_test (mingw + Wine)
        shell: bash
        working-directory: samples/input/winraw_joypad_poll
        run: |
          set -eu
          # input/drivers_joypad/winraw_joypad.c with its controllers
          # read by the poll. The real driver under Wine, started from
          # a second thread as it is from the video thread: init makes
          # no window and the first poll
          # does, on the polling thread, marking it as one whose pump
          # leaves raw input alone, with one bulk read a poll; a device
          # change waiting for the window is taken by the poll;
          # destroy from another thread - what a controller plugged in
          # causes - has the window gone once its own thread pumps; a
          # restart and a poll make a new one.
          trap 'wineserver -k >/dev/null 2>&1 || true' EXIT
          make clean && make -j$(nproc) all
          WINEDEBUG=-all timeout 300 make check
          make clean
          echo "[pass] winraw_joypad_poll_test (wine)"

      - name: Build and run winraw_joypad_newest_test (mingw + Wine)
        shell: bash
        working-directory: samples/input/winraw_joypad_newest
        run: |
          set -eu
          # winraw_joypad parses only the newest report of each report
          # ID per controller out of a bulk read, not every report. The
          # driver, with its HID calls routed to a fake controller that
          # splits its state across report IDs: twenty thousand random
          # bursts of reports - any IDs and values, several reports in
          # a record, reports too big to hold, more IDs than are held -
          # go to one controller through the holding path and to a
          # second one report at a time, and after every burst the two
          # must read the same buttons, axes and hats.
          trap 'wineserver -k >/dev/null 2>&1 || true' EXIT
          make clean && make -j$(nproc) all
          WINEDEBUG=-all timeout 300 make check
          make clean
          echo "[pass] winraw_joypad_newest_test (wine)"

      - name: Build and run winraw_joypad_same_model_test (mingw + Wine)
        shell: bash
        working-directory: samples/input/winraw_joypad_same_model
        run: |
          set -eu
          # winraw_joypad took a second controller of the same model
          # for the first one reconnecting, and evicted the first. The
          # driver with its HID calls routed to fake controllers that
          # share one vendor and product ID: three plugged in at once
          # are three slots; one reconnecting, on its port or another,
          # with its new handle announced before the old one is
          # removed, gets its own slot back and leaves the others
          # alone; a reconnect whose old handle still answers is known
          # by its device path; with no path, a live handle is another
          # controller and a dead one is this one back.
          trap 'wineserver -k >/dev/null 2>&1 || true' EXIT
          make clean && make -j$(nproc) all
          WINEDEBUG=-all timeout 300 make check
          make clean
          echo "[pass] winraw_joypad_same_model_test (wine)"

      - name: ccache statistics
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ccache -sv

      - name: Save ccache
        # Only master's pushes keep a cache: pull requests restore
        # master's, so one push does not evict the next one's.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
