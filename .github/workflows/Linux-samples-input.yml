name: CI Linux samples/input

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  samples-input:
    name: Build and run samples/input
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          pkgs="build-essential libusb-1.0-0-dev libx11-dev libxtst-dev libxi-dev xvfb gcc-mingw-w64-x86-64 wine64"
          if dpkg -s $pkgs >/dev/null 2>&1; then
            echo "All packages already present on runner image; skipping apt."
            exit 0
          fi
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update failed (attempt $i); retrying in 10s"
            sleep 10
          done
          # Fetch first, under a bound: a download is safe to stop and
          # resumes, an install is not. A mirror that stalls is left for
          # the main archive on the next attempt.
          for i in 1 2 3; do
            sudo timeout 240 apt-get install -y --download-only \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              $pkgs && break
            [ $i = 3 ] && exit 1
            echo "package download failed or stalled (attempt $i); retrying from archive.ubuntu.com"
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              [ -f "$f" ] || continue
              sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' \
                -e 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            done
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-

      - name: Enable ccache
        run: |
          set -eu
          command -v ccache >/dev/null 2>&1 || sudo apt-get install -y -qq ccache
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 500M
          ccache -z

      - name: X11 input poll sends no requests (Xvfb, ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/input/x11_input_poll
        run: |
          set -eu
          # The X input driver's poll runs every frame. Keys, and with
          # XInput 2 the pointer, come from events on the driver's own
          # connection, drained at the poll, so it sends no request on
          # either connection; a query on the shared one waits behind
          # whatever the video thread presents through it. XTEST drives
          # the keyboard (held before init, auto-repeat, focus changes,
          # another client's keyboard grab) and the pointer (a press
          # without motion, buttons 1, 3 and 8, the wheel, a drag out of
          # the window, a new driver over a held button, and grabbed
          # motion across a warp the server holds back behind a server
          # grab - where any wait on the server would hang the test).
          Xvfb :96 -screen 0 1024x768x24 > /tmp/xvfb96.log 2>&1 &
          XVFB_PID=$!
          sleep 1
          make clean all SANITIZER=address,undefined
          DISPLAY=:96 ASAN_OPTIONS=detect_leaks=1 \
             UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 120 ./x11_input_poll_test
          make clean all SANITIZER=thread
          DISPLAY=:96 TSAN_OPTIONS=halt_on_error=1 timeout 120 ./x11_input_poll_test
          make clean
          kill $XVFB_PID
          echo "[pass] x11_input_poll_test (ASan, TSan)"

      - name: Build and run illuminance_sensor_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/illuminance_sensor
        run: |
          set -eu
          # The Linux IIO illuminance sensor poller, against a fake
          # sysfs tree under /tmp. Pins that the poll thread waits on a
          # condition between readings rather than sleeping: a raised
          # rate applies at once, and close returns without waiting out
          # the period.
          make clean all SANITIZER=address,undefined
          test -x illuminance_sensor_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 60 \
             ./illuminance_sensor_test
          echo "[pass] illuminance_sensor_test (ASan)"

      - name: Build and run illuminance_sensor_test (TSan)
        shell: bash
        working-directory: samples/input/illuminance_sensor
        run: |
          set -eu
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 60 ./illuminance_sensor_test
          echo "[pass] illuminance_sensor_test (TSan)"

      - name: Build and run libusb_hid_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/libusb_hid
        run: |
          set -eu
          # The libusb HID driver against a fake libusb: reads and
          # commands run on asynchronous transfers completed by the poll
          # thread, with no thread per pad. Pins that a command goes out
          # at once even while the pad sends nothing, that commands stay
          # in order one at a time, that unplugging frees the adapter,
          # and that freeing the driver returns at once with a send
          # still pending, releasing every transfer and handle.
          make clean all SANITIZER=address,undefined
          test -x libusb_hid_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 60 \
             ./libusb_hid_test
          echo "[pass] libusb_hid_test (ASan)"

      - name: Build and run libusb_hid_test (TSan)
        shell: bash
        working-directory: samples/input/libusb_hid
        run: |
          set -eu
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 60 ./libusb_hid_test
          echo "[pass] libusb_hid_test (TSan)"

      - name: Build and run wii_handshake_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/wii_handshake
        run: |
          set -eu
          # The Wiimote extension handshake in connect_wii.c, fed
          # reports directly. Pins that each init write waits for the
          # remote's acknowledgement instead of a sleep on the packet
          # thread, that a missing acknowledgement is only overtaken by
          # a packet after the old 100 ms, and that no packet blocks.
          make clean all SANITIZER=address,undefined
          test -x wii_handshake_test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./wii_handshake_test
          echo "[pass] wii_handshake_test (ASan)"

      - name: Build and run android_lifecycle_flush_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/input/android_lifecycle_flush
        run: |
          set -eu
          # The Android background flush handshake, a UI thread against
          # an app thread. Pins that onPause() and onStop() return only
          # once SRAM, core options and the config are on disk - a
          # swiped-away task is killed as soon as they have returned -
          # that the save is written once per trip to the background,
          # and that the startup pump acknowledges without saving.
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./android_lifecycle_flush_test
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 60 ./android_lifecycle_flush_test
          make clean
          echo "[pass] android_lifecycle_flush_test (ASan, TSan)"

      - name: Build and run android_pad_removed_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/input/android_pad_removed
        run: |
          set -eu
          # A controller Android has removed, from the listener that
          # hears of it to the port it comes back to. Pins that no
          # removal is lost or delivered twice with three threads
          # posting into the mailbox while the input thread polls, that
          # a full box refuses and keeps what it holds, and that a
          # returning pad gets its old port back - of two identical
          # pads, the one that left. Emptying a removed slot's name, as
          # the first version of the change did, is put back and
          # asserted to be caught: it moved a pad to the next free port
          # on every reconnect.
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 120 ./android_pad_removed_test
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 120 ./android_pad_removed_test
          make clean
          echo "[pass] android_pad_removed_test (ASan, TSan)"

      - name: Build and run android_kbd_keys_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/android_kbd_keys
        run: |
          set -eu
          # Key events from the Android system keyboard, through the
          # native input queue to the text field that owns the menu
          # line. Pins that a Backspace the soft keyboard sends as a
          # key event is handed back to the field instead of being
          # consumed natively - consumed, the field kept the
          # characters and the next snapshot put them back on the line.
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./android_kbd_keys_test
          make clean
          echo "[pass] android_kbd_keys_test (ASan)"

      - name: Build and run android_cec_remote_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/android_cec_remote
        run: |
          set -eu
          # A television's remote over HDMI-CEC. Android delivers its
          # keys with no device behind them (id -1, source HDMI), and
          # the driver took the event for a new gamepad: the remote
          # became an unconfigured pad called "Virtual" on the next
          # free port (issue #19249). Pins that such an event registers
          # no pad and lands on the keyboard row, that only the HDMI
          # source is taken for a remote, that a controller - one
          # reporting id -1 included - still gets its pad, and that the
          # SHIELD keeps its own CEC mapping. Ignoring the source, as
          # the driver did, is put back and asserted to be caught.
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./android_cec_remote_test
          make clean
          echo "[pass] android_cec_remote_test (ASan)"

      - name: Build and run android_key_state_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/android_key_state
        run: |
          set -eu
          # Key presses and releases, through the code that writes them
          # into the Android driver's key state. For nine days a press
          # of Back set X on the keyboard row and nothing cleared it; X
          # is RetroPad A by default, and the frontend drops all
          # controller input after a menu toggle until every button is
          # up, so the menu went deaf to the controller while touch
          # kept working (issue #19436). Pins that whatever a press
          # sets its release clears - every keycode, every source,
          # every row, and any interleaving - that keycodes outside the
          # rows are dropped, that Center stays keycode 23 on a pad row
          # (issue #18819), and that a pad removed while holding Back
          # leaves nothing behind. The missing clear is put back and
          # asserted to be caught.
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./android_key_state_test
          make clean
          echo "[pass] android_key_state_test (ASan)"

      - name: Build and run output_store_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/input/output_store
        run: |
          set -eu
          # What a core asks of a rumble motor or an LED, between the
          # core's call and the frontend's write to the device. Those
          # calls used to be driver writes on the core's own stack, as
          # many a frame as the core made; they now post into a store
          # that the frame loop takes once the core has run. Pins that
          # a post writes nothing, that an output set many times in a
          # frame is written once with the last value, that one set to
          # the value it already had is still written, that a drop
          # forgets, and - with three threads posting while the frame
          # loop takes - that every output ends on the last value
          # posted to it. A take that sees the posts and writes
          # nothing, the shape of a stop that never reaches the motor,
          # is put back and asserted to be caught.
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 120 ./output_store_test
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 120 ./output_store_test
          make clean
          echo "[pass] output_store_test (ASan, TSan)"

      - name: Build and run device_registry_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/device_registry
        run: |
          set -eu
          # Which controllers there are, and which of them has been
          # here before. A joypad driver knows a controller by its
          # slot; the registry gives each one a device id that it keeps
          # when it leaves and returns, and a handle that is good for
          # one stay. Pins that a returning controller has its id and
          # a new handle, that a handle stops resolving when the
          # controller leaves, is reported again or loses its slot,
          # that identical pads are told apart by where they are
          # plugged in, then by slot, then by who left last, that a
          # driver starting over costs nobody their id, that a full
          # table gives up only a controller that has left, and -
          # through 200000 arrivals and departures - that no two
          # present controllers share a slot or an id. And that a
          # driver which starts over and reports the controllers it
          # had, in any order and any slots, has each put back on its
          # port - but only then: one missing, a new one, or one
          # leaving again, and nothing is moved. A handle that
          # outlives its stay, the way a kept slot number does, is put
          # back and asserted to be caught.
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 120 ./device_registry_test
          make clean
          echo "[pass] device_registry_test (ASan)"

      - name: Build and run android_stylus_map_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/android_stylus_map
        run: |
          set -eu
          # An Android pen, through the mapping that turns its events
          # into pointer and mouse state. Pins that a pen is one touch:
          # the tip pressing is pointer 0 pressed and the barrel button
          # is the right mouse button, where the first version raised
          # the pointer count to 2 and 3 and read as a two- and
          # three-finger touch (turbo and reload to the driver's own
          # lightgun mapping). Also that a hover does not release a
          # finger, that the barrel button is let go with the pen, and
          # that the two click settings decide what a press is. The old
          # pointer counts are put back and asserted to be caught.
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./android_stylus_map_test
          make clean
          echo "[pass] android_stylus_map_test (ASan)"

      - name: Build and run linux_not_joystick_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/linux_not_joystick
        run: |
          set -eu
          # Devices Linux tags as joysticks that are not controllers.
          # Pins issue #19674: a Microsoft 2.4GHz Transceiver, the
          # receiver of a wireless keyboard and mouse, took port 1
          # through its "System Control" node and left the real
          # controller on port 2. Checks that receiver, the same node
          # on unknown devices and the listed ids are dropped, and that
          # real controllers - a pad named "Wireless", a pedal set with
          # no buttons - are kept.
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./linux_not_joystick_test
          make clean
          echo "[pass] linux_not_joystick_test (ASan)"

      - name: Build and run overlay_textures_test (plain, ASan + UBSan, threaded)
        shell: bash
        working-directory: samples/input/overlay_textures
        run: |
          set -eu
          # input/input_overlay_textures.c as it is, against a stub
          # driver that reads every pixel it is handed. Pins every
          # route a page takes to the driver: as textures (each page
          # gets its own images' textures, a switch uploads nothing,
          # the pixels go once the driver has them and the sizes
          # stay), and as pixels through load() for a driver that
          # declines the textures, has no such path, or fails an
          # upload - live pixels on every page. 86fbf34e01 freed the
          # pixels before the page lists were matched by them, so
          # with threaded video off the fallback showed freed memory;
          # under ASan that is a use-after-free here.
          make clean all
          timeout 60 ./overlay_textures_test
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./overlay_textures_test
          # THREADS=1: the threaded wrapper as a stub whose video
          # thread runs when the test says so, so both outcomes of
          # the race between the uploads and the poll are lanes. The
          # quick thread is 86fbf34e01's bug again under threaded
          # video; the slow one must find the pack's pixels alive.
          make clean all THREADS=1 SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./overlay_textures_test
          make clean
          echo "[pass] overlay_textures_test (plain, ASan, threaded ASan)"

      - name: Build and run winraw_abs_pos_test (mingw + Wine)
        shell: bash
        working-directory: samples/input/winraw_abs_pos
        run: |
          set -eu
          # input/drivers/winraw_input.c, cross-built with mingw-w64 and
          # run under Wine: an absolute pointer report's position is
          # kept as one word, and every read must give back a position
          # a report carried, including a report that lands during poll.
          # mingw-w64 and Wine come from "Install dependencies", whose
          # download is bounded and retried; an unbounded install here
          # stalled silently until the job timeout. Stop wineserver on
          # exit so it cannot hold the step's output open.
          trap 'wineserver -k >/dev/null 2>&1 || true' EXIT
          make clean all
          WINEDEBUG=-all timeout 300 make check
          make clean
          echo "[pass] winraw_abs_pos_test (wine)"
