name: CI Linux samples/input

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  samples-input:
    name: Build and run samples/input
    runs-on: ubuntu-latest
    env:
      APT_PKGS: build-essential libusb-1.0-0-dev libudev-dev libsdl2-dev libx11-dev libxtst-dev libxi-dev xvfb gcc-mingw-w64-x86-64 wine64 ccache
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 20
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Build and run joypad_bridge_checked (udev, linuxraw, SDL2 on the host; DirectInput, XInput under Wine)
        shell: bash
        working-directory: samples/input/joypad_bridge_checked
        run: |
          set -eu
          # The joypad drivers the snapshot bridge serves, held to what
          # it assumes of them: over random pads, binds and thresholds,
          # what the bridge would read - buttons through get_buttons(),
          # hats and axes through button() and axis(), the RetroPad
          # mask through the common loop - is what the driver's own
          # button(), axis() and state() say.
          make clean && make -j$(nproc) all
          timeout 120 make check
          make clean

      - name: gfx/ does not reach into input state
        shell: bash
        run: |
          set -eu
          # The video code used to take input_state_get_ptr() and work
          # on the input driver's fields itself - freeing the driver
          # and the joypads, handing out the addresses of its slots,
          # reading and setting its flags. It goes through calls into
          # input/ now (input_driver_free_with_video() and the rest).
          # This keeps it that way: no file under gfx/ may name
          # input_state_get_ptr.
          if grep -rn "input_state_get_ptr" --include=*.c --include=*.h \
                --include=*.m --include=*.cpp gfx/; then
             echo "FAIL: gfx/ takes the input driver's state directly" >&2
             exit 1
          fi
          echo "[pass] gfx/ does not name input_state_get_ptr"

      - name: Video drivers do not start the input driver for their window
        shell: bash
        run: |
          set -eu
          # The Windows video drivers and contexts, and the X11 and KMS
          # contexts, used to call input_driver_init_windows(), _x11()
          # or _kms() from their own start-up. They say what kind of
          # window they put up (input_driver_video_window()) and
          # the frontend starts the input driver for it once the video
          # driver is up (video_driver_init_input()). No file under
          # gfx/ may call those three again.
          if grep -rnE "input_driver_init_(windows|x11|kms)" --include=*.c \
                --include=*.h --include=*.m --include=*.cpp gfx/; then
             echo "FAIL: a video driver starts the input driver for its window itself" >&2
             exit 1
          fi
          echo "[pass] gfx/ does not call input_driver_init_windows, _x11 or _kms"

      - name: input/ does not reach into video state
        shell: bash
        run: |
          set -eu
          # The other direction of the step above. The input code used
          # to take video_state_get_ptr() and work on the video
          # driver's fields - the frame count, the core's geometry, the
          # mouse cursor through the poke interface, the overlay
          # interface and the driver's data. It goes through calls
          # into gfx/ now (video_driver_show_mouse() and the rest).
          # The Android input driver is the one file still to do: it
          # creates and destroys the window surface on the app's
          # lifecycle events, and is allowed here by name until that
          # is moved.
          if grep -rn "video_state_get_ptr" --include=*.c --include=*.h \
                --include=*.m --include=*.cpp input/ \
                | grep -v "^input/drivers/android_input.c:"; then
             echo "FAIL: input/ takes the video driver's state directly" >&2
             exit 1
          fi
          echo "[pass] input/ does not name video_state_get_ptr (android_input.c excepted)"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-

      - name: Enable ccache
        run: |
          set -eu
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 250M
          ccache -z

      - name: X11 input poll sends no requests (Xvfb, ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/input/x11_input_poll
        run: |
          set -eu
          # The X input driver's poll runs every frame. Keys, and with
          # XInput 2 the pointer, come from events on the driver's own
          # connection, drained at the poll, so it sends no request on
          # either connection; a query on the shared one waits behind
          # whatever the video thread presents through it. XTEST drives
          # the keyboard (held before init, auto-repeat, focus changes,
          # another client's keyboard grab) and the pointer (a press
          # without motion, buttons 1, 3 and 8, the wheel, a drag out of
          # the window, a new driver over a held button, and grabbed
          # motion across a warp the server holds back behind a server
          # grab - where any wait on the server would hang the test).
          Xvfb :96 -screen 0 1024x768x24 > /tmp/xvfb96.log 2>&1 &
          XVFB_PID=$!
          sleep 1
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          DISPLAY=:96 ASAN_OPTIONS=detect_leaks=1 \
             UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 120 ./x11_input_poll_test
          make clean SANITIZER=thread && make -j$(nproc) all SANITIZER=thread
          DISPLAY=:96 TSAN_OPTIONS=halt_on_error=1 timeout 120 ./x11_input_poll_test
          make clean
          kill $XVFB_PID
          echo "[pass] x11_input_poll_test (ASan, TSan)"

      - name: Build and run illuminance_sensor_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/illuminance_sensor
        run: |
          set -eu
          # The Linux IIO illuminance sensor poller, against a fake
          # sysfs tree under /tmp. Pins that the poll thread waits on a
          # condition between readings rather than sleeping: a raised
          # rate applies at once, and close returns without waiting out
          # the period.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          test -x illuminance_sensor_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 60 \
             ./illuminance_sensor_test
          echo "[pass] illuminance_sensor_test (ASan)"

      - name: Build and run illuminance_sensor_test (TSan)
        shell: bash
        working-directory: samples/input/illuminance_sensor
        run: |
          set -eu
          make clean SANITIZER=thread && make -j$(nproc) all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 60 ./illuminance_sensor_test
          echo "[pass] illuminance_sensor_test (TSan)"

      - name: Build and run libusb_hid_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/libusb_hid
        run: |
          set -eu
          # The libusb HID driver against a fake libusb: reads and
          # commands run on asynchronous transfers completed by the poll
          # thread, with no thread per pad. Pins that a command goes out
          # at once even while the pad sends nothing, that commands stay
          # in order one at a time, that unplugging frees the adapter,
          # and that freeing the driver returns at once with a send
          # still pending, releasing every transfer and handle.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          test -x libusb_hid_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 60 \
             ./libusb_hid_test
          echo "[pass] libusb_hid_test (ASan)"

      - name: Build and run libusb_hid_test (TSan)
        shell: bash
        working-directory: samples/input/libusb_hid
        run: |
          set -eu
          make clean SANITIZER=thread && make -j$(nproc) all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 60 ./libusb_hid_test
          echo "[pass] libusb_hid_test (TSan)"

      - name: Build and run winusb_hid_test (mingw + Wine)
        shell: bash
        working-directory: samples/input/winusb_hid
        run: |
          set -eu
          trap 'wineserver -k >/dev/null 2>&1 || true' EXIT
          make clean && make -j$(nproc) all
          WINEDEBUG=-all timeout 300 make check
          make clean

      - name: Build and run connection_gate_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/input/connection_gate
        run: |
          set -eu
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 60 ./connection_gate_test
          make clean SANITIZER=thread && make -j$(nproc) all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 60 ./connection_gate_test
          make clean

      - name: Build and run hidraw_hid_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/hidraw_hid
        run: |
          set -eu
          # The hidraw HID driver with the real pad handlers, against
          # stand-ins for /dev and /sys: only handled pads are opened, a
          # DualShock 3 is started through hidraw, the newest report
          # waiting is the pad's state, and a pad that goes is
          # disconnected and its node closed.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          test -x hidraw_hid_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 60 \
             ./hidraw_hid_test
          echo "[pass] hidraw_hid_test (ASan)"

      - name: Build and run wii_handshake_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/wii_handshake
        run: |
          set -eu
          # The Wiimote extension handshake in connect_wii.c, fed
          # reports directly. Pins that each init write waits for the
          # remote's acknowledgement instead of a sleep on the packet
          # thread, that a missing acknowledgement is only overtaken by
          # a packet after the old 100 ms, and that no packet blocks.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          test -x wii_handshake_test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./wii_handshake_test
          echo "[pass] wii_handshake_test (ASan)"

      - name: Build and run android_lifecycle_flush_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/input/android_lifecycle_flush
        run: |
          set -eu
          # The Android background flush handshake, a UI thread against
          # an app thread. Pins that onPause() and onStop() return only
          # once SRAM, core options and the config are on disk - a
          # swiped-away task is killed as soon as they have returned -
          # that the save is written once per trip to the background,
          # and that the startup pump acknowledges without saving.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./android_lifecycle_flush_test
          make clean SANITIZER=thread && make -j$(nproc) all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 60 ./android_lifecycle_flush_test
          make clean
          echo "[pass] android_lifecycle_flush_test (ASan, TSan)"

      - name: Build and run android_pad_removed_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/input/android_pad_removed
        run: |
          set -eu
          # A controller Android has removed, from the listener that
          # hears of it to the port it comes back to. Pins that no
          # removal is lost or delivered twice with three threads
          # posting into the mailbox while the input thread polls, that
          # a full box refuses and keeps what it holds, and that a
          # returning pad gets its old port back - of two identical
          # pads, the one that left. Emptying a removed slot's name, as
          # the first version of the change did, is put back and
          # asserted to be caught: it moved a pad to the next free port
          # on every reconnect.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 120 ./android_pad_removed_test
          make clean SANITIZER=thread && make -j$(nproc) all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 120 ./android_pad_removed_test
          make clean
          echo "[pass] android_pad_removed_test (ASan, TSan)"

      - name: Build and run android_block_timeout_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/android_block_timeout
        run: |
          set -eu
          # The input block timeout on Android, without waiting: the
          # poll never waits in the foreground; a pad's presses whose
          # newest came within the timeout of the poll wait one poll for
          # the rest of the press, older ones are shown at once, none
          # waits longer, and a press let go before it was shown is
          # shown for one poll.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./android_block_timeout_test
          make clean
          echo "[pass] android_block_timeout_test (ASan)"

      - name: Build and run android_kbd_keys_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/android_kbd_keys
        run: |
          set -eu
          # Key events from the Android system keyboard, through the
          # native input queue to the text field that owns the menu
          # line. Pins that a Backspace the soft keyboard sends as a
          # key event is handed back to the field instead of being
          # consumed natively - consumed, the field kept the
          # characters and the next snapshot put them back on the line.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./android_kbd_keys_test
          make clean
          echo "[pass] android_kbd_keys_test (ASan)"

      - name: Build and run android_cec_remote_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/android_cec_remote
        run: |
          set -eu
          # A television's remote over HDMI-CEC. Android delivers its
          # keys with no device behind them (id -1, source HDMI), and
          # the driver took the event for a new gamepad: the remote
          # became an unconfigured pad called "Virtual" on the next
          # free port (issue #19249). Pins that such an event registers
          # no pad and lands on the keyboard row, that only the HDMI
          # source is taken for a remote, that a controller - one
          # reporting id -1 included - still gets its pad, and that the
          # SHIELD keeps its own CEC mapping. Ignoring the source, as
          # the driver did, is put back and asserted to be caught.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./android_cec_remote_test
          make clean
          echo "[pass] android_cec_remote_test (ASan)"

      - name: Build and run android_key_state_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/android_key_state
        run: |
          set -eu
          # Key presses and releases, through the code that writes them
          # into the Android driver's key state. For nine days a press
          # of Back set X on the keyboard row and nothing cleared it; X
          # is RetroPad A by default, and the frontend drops all
          # controller input after a menu toggle until every button is
          # up, so the menu went deaf to the controller while touch
          # kept working (issue #19436). Pins that whatever a press
          # sets its release clears - every keycode, every source,
          # every row, and any interleaving - that keycodes outside the
          # rows are dropped, that Center stays keycode 23 on a pad row
          # (issue #18819), and that a pad removed while holding Back
          # leaves nothing behind. The missing clear is put back and
          # asserted to be caught.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./android_key_state_test
          make clean
          echo "[pass] android_key_state_test (ASan)"

      - name: Build and run android_poll_changes_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/android_poll_changes
        run: |
          set -eu
          # What one Android input poll applies. The input queue is
          # read on a thread of its own, so a poll is handed every
          # event since the last, and a key, a finger or a mouse
          # button can go down and back up in between. Pins that such a
          # press is shown for one poll, that the order is kept, that
          # a repeat never holds anything back, and that rows,
          # devices, fingers, buttons and hats are told apart. A drain that
          # applies everything it has is put back and asserted to be
          # caught.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./android_poll_changes_test
          make clean
          echo "[pass] android_poll_changes_test (ASan)"

      - name: Build and run android_input_ring_test (ASan + UBSan, TSan, mingw-w64)
        shell: bash
        working-directory: samples/input/android_input_ring
        run: |
          set -eu
          . "$GITHUB_WORKSPACE/.github/workflows/scripts/wine-server.sh"
          # The Android input reader's ring: each event a record of the
          # size it needs, written where the poll applies it. Pins that
          # the poll reads the reader's bytes in place, that no record
          # crosses the ring's end over many laps, that a stick's moves
          # merge only while unpublished, and that on two threads every
          # record arrives once, whole and in order.
          make clean && make all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 120 ./android_input_ring_test
          make clean && make all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 300 ./android_input_ring_test
          make clean && make CC=x86_64-w64-mingw32-gcc
          WINEDEBUG=-all timeout 180 wine ./android_input_ring_test.exe
          make clean
          echo "[pass] android_input_ring_test (ASan, TSan, Wine)"

      - name: Build and run output_store_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/input/output_store
        run: |
          set -eu
          # What a core asks of a rumble motor or an LED, between the
          # core's call and the frontend's write to the device. Those
          # calls used to be driver writes on the core's own stack, as
          # many a frame as the core made; they now post into a store
          # that the frame loop takes once the core has run. Pins that
          # a post writes nothing, that an output set many times in a
          # frame is written once with the last value, that one set to
          # the value it already had is still written, that a drop
          # forgets, and - with three threads posting while the frame
          # loop takes - that every output ends on the last value
          # posted to it. A take that sees the posts and writes
          # nothing, the shape of a stop that never reaches the motor,
          # is put back and asserted to be caught.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 120 ./output_store_test
          make clean SANITIZER=thread && make -j$(nproc) all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 120 ./output_store_test
          make clean
          echo "[pass] output_store_test (ASan, TSan)"

      - name: Build and run window_driver_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/window_driver
        run: |
          set -eu
          # Which input driver a window gets
          # (input/input_driver_choice.c): the choice the video
          # contexts used to have written out each for itself, with
          # the drivers' names in it. Runs every branch of the X11
          # window choice and the no-window-system choice with
          # stand-in drivers that start or fail to: which driver comes
          # out, which were tried and in what order, that the joypad
          # driver's name is passed through, and that the two results
          # are both set or both NULL. The Windows choice is the same
          # test built with mingw and run under Wine, in the gfx
          # samples workflow; it also has the case of a driver left
          # running across a video driver restart, which is handed
          # back with none started.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./window_driver_test
          # the same built with SDL 1.2 in SDL 3's place, for the SDL
          # 1.2 window's choice: a build has one or the other
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./window_driver_test_sdl1
          make clean
          echo "[pass] window_driver_test (ASan)"

      - name: Build and run bind_trigger_axis_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/bind_trigger_axis
        run: |
          set -eu
          # Binding L2 or R2 by pressing it: a trigger that is a button
          # and an axis at once is bound to its axis, which is analog.
          # Which axis that is, is told from where each axis rests and
          # whether it has left it (menu/menu_bind_trigger.h): the
          # trigger's own, not a stick held over, not noise, not the
          # other trigger.
          make clean SANITIZER=address,undefined && make -j$(nproc) all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 60 ./bind_trigger_axis_test
          make clean
          echo "[pass] bind_trigger_axis_test (ASan)"

      - name: Build and run hotkey_menu_test (ASan + UBSan, mingw + Wine)
        shell: bash
        run: |
          set -eu
          . "$GITHUB_WORKSPACE/.github/workflows/scripts/wine-server.sh"
          make -C samples/input/hotkey_menu clean check SANITIZER=address,undefined
          make -C samples/input/hotkey_menu clean check CC=x86_64-w64-mingw32-gcc EXE=.exe RUNNER=wine
          make -C samples/input/hotkey_menu clean

      - name: Build and run pointer_second_test (ASan + UBSan, mingw + Wine)
        shell: bash
        run: |
          set -eu
          . "$GITHUB_WORKSPACE/.github/workflows/scripts/wine-server.sh"
          # A core's pointer read where the input driver has a second
          # list (Android's second display): its fingers go after the
          # overlay's, after none while the overlay blocks the pointer,
          # else after the driver's main list; a driver with no second
          # list answers with its main list alone. The test runs
          # input_state_device() extracted from input_driver.c.
          make -C samples/input/pointer_second clean check SANITIZER=address,undefined
          make -C samples/input/pointer_second clean check CC=x86_64-w64-mingw32-gcc EXE=.exe RUNNER=wine
          make -C samples/input/pointer_second clean

      - name: Build and run android_focus_test (ASan + UBSan, mingw + Wine)
        shell: bash
        run: |
          set -eu
          . "$GITHUB_WORKSPACE/.github/workflows/scripts/wine-server.sh"
          # RetroArch's focus on Android from its two windows, the
          # Activity's and the second display's, through the sequences
          # the AYN Thor's focus modes and a one-focus system produce.
          make -C samples/input/android_focus clean check SANITIZER=address,undefined
          make -C samples/input/android_focus clean check CC=x86_64-w64-mingw32-gcc EXE=.exe RUNNER=wine
          make -C samples/input/android_focus clean

