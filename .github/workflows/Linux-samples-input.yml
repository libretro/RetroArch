      - name: Build and run net_retropad_repeat_test (Linux and Windows)
        shell: bash
        working-directory: samples/input/net_retropad_repeat
        run: |
          set -eu
          # The Remote RetroPad core sends a control's state when it
          # changes, by UDP. The real core is driven by a frontend of
          # a few callbacks and its messages read back over loopback:
          # a change is sent again 5, 15 and 30 frames on, and then no
          # more; nothing is sent while nothing changes.
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 \
             timeout 120 ./net_retropad_repeat_test
          make clean
          make CC=x86_64-w64-mingw32-gcc
          WINE=$(command -v wine64 || command -v wine || echo /usr/lib/wine/wine64)
          WINEDEBUG=-all timeout 180 "$WINE" ./net_retropad_repeat_test.exe
          make clean
          echo "[pass] net_retropad_repeat_test (ASan, and mingw-w64 under Wine)"

      - name: Build and run udev_rumble_test (ASan + UBSan, then TSan)
        shell: bash
        working-directory: samples/input/udev_rumble
        run: |
          set -eu
          # The udev joypad driver writes rumble from a thread of its
          # own. The real driver is given a pad whose descriptor is a
          # pipe and an upload that takes 60 ms: the call returns at
          # once, the latest strength is the one written, a pad that
          # goes is let go of, and stopping the driver ends the
          # writer. Built with threads and without.
          make clean all SANITIZER=address,undefined
          timeout 120 ./udev_rumble_test
          timeout 120 ./udev_rumble_test_nothreads
          make clean all SANITIZER=thread
          timeout 120 ./udev_rumble_test
          make clean
          echo "[pass] udev_rumble_test"

      - name: Build and run udev_devices_test (ASan + UBSan)
        shell: bash
        working-directory: samples/input/udev_devices
        run: |
          set -eu
          # The udev input driver's listing of keyboards and mice, its
          # numbering of them and what a port reads went in compiled
          # only: it needs devices under /dev/input, which a runner
          # has none of. What the driver knows of a device is a
          # structure in memory, so the real driver is handed a desk
          # of them: a keyboard that is three event devices, a mouse
          # that is two, a power button and a second keyboard. Two
          # keyboards are listed; the mouse is mouse 1 and the
          # keyboard's pointer part is not a mouse; each is told to
          # the frontend by its ids; a port reads its own keyboard's
          # keys and not the other's, and the mouse it is told to.
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
             timeout 60 ./udev_devices_test
          make clean
          echo "[pass] udev_devices_test (ASan)"

      - name: Build and run device_pins_test
        shell: bash
        working-directory: samples/input/device_pins
        run: |
          set -eu
          # A port keeps its keyboard by what the keyboard is, not by
          # its place in a list that changes when keyboards are
          # plugged in or out (input/common/input_device_pins.h): two
          # pinned ports each read their own in whatever order the
          # keyboards are listed; with one unplugged the other is
          # still its own port's and the port left without reads none;
          # a single port whose keyboard is away reads every keyboard;
          # two keyboards of one model are two pins. And the same for
          # mice, which have no "every mouse": a pinned port whose
          # mouse is away reads none while another port has its own,
          # and the mouse its number names otherwise.
          make clean all
          timeout 60 make check
          make clean
          echo "[pass] device_pins_test"

      - name: Build and run keyboard_devices_test
        shell: bash
        working-directory: samples/input/keyboard_devices
        run: |
          set -eu
          # Which of the devices a system reports are the keyboards on
          # the desk (input/common/input_keyboard_devices.h, which the
          # udev input driver lists its keyboards by): a keyboard in
          # three parts is one keyboard; the power button, a headset
          # and a mouse whose buttons send keys are none; two of one
          # model are two; a keyboard with a pointer built in is one.
          make clean all
          timeout 60 make check
          make clean
          echo "[pass] keyboard_devices_test"

      - name: Build and run xinput_rumble_test (mingw + Wine)
        shell: bash
        working-directory: samples/input/xinput_rumble
        run: |
          set -eu
          # The XInput joypad driver writes rumble from a thread of its
          # own. The real driver is given an XInputSetState that takes
          # 60 ms: the call returns at once, the latest strength is the
          # one written, and with the writer stopped the caller writes
