name: CI Windows SDK macro names

on:
  push:
    branches:
      - master
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/Win-Macro-Names-Check.yml'
    # ci_paths: end
  pull_request:
    branches:
      - master
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/Win-Macro-Names-Check.yml'
    # ci_paths: end
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  win-macro-names:
    name: No identifiers rpcndr.h turns into types
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checker self-test
        run: python3 tools/win_macro_names_check.py --selftest

      - name: Check the tree
        run: python3 tools/win_macro_names_check.py
