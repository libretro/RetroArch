name: CI Context presentable() contract

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ctx-presentable-check:
    name: gfx_ctx_driver_t presentable() consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Checker self-test
        shell: bash
        run: |
          set -eu
          # Fixture pass: a correct driver is clean, a presentable()
          # casting another driver's context type is flagged, and one
          # that is defined but never wired into the vtable is flagged.
          tools/check.sh tools/ctx_presentable_check.c --selftest

      - name: Tree check
        shell: bash
        run: |
          set -eu
          # Each context driver is compiled by one platform's CI, so a
          # presentable() that casts the wrong driver's type, or that is
          # never wired in, is invisible to every other job. This is the
          # check that sees all of them at once.
          tools/check.sh tools/ctx_presentable_check.c
