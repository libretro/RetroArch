name: CI Linux MCP over stdio

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  mcp-stdio:
    name: retroarch --mcp-stdio driving a core
    runs-on: ubuntu-latest
    env:
      APT_PKGS: build-essential pkg-config zlib1g-dev libfreetype6-dev python3 ccache
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 10
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Build RetroArch and the views test core
        shell: bash
        run: |
          set -eu
          ./configure --disable-qt --disable-ffmpeg --disable-vulkan \
            --disable-wayland --disable-x11 --disable-opengl
          grep -q '^HAVE_MCP = 1' config.mk
          make -j"$(nproc)" CC="ccache gcc" CXX="ccache g++"
          make -C samples/cores/video_views
          # a core that maps memory, for the tools that read it
          gcc -O1 -shared -fPIC -Ilibretro-common/include \
            -o samples/network/command_frames/harness_core.so \
            samples/network/command_frames/harness_core.c
          # and one that maps none, handing its RAM over as snes9x does
          gcc -O1 -shared -fPIC -DHARNESS_NO_MAP -Ilibretro-common/include \
            -o samples/network/command_frames/harness_core_nomap.so \
            samples/network/command_frames/harness_core.c

      - name: MCP over stdin and stdout, end to end
        shell: bash
        run: |
          set -eu
          # null drivers: no display on the runner
          timeout 300 python3 samples/network/mcp_server/stdio_e2e.py \
            ./retroarch samples/cores/video_views/video_views_libretro.so \
            samples/network/command_frames/harness_core.so \
            samples/network/command_frames/harness_core_nomap.so
