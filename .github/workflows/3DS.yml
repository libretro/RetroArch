name: CI 3DS

on:
  push:
    branches: [master]
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!samples/**'
      - '!libretro-common/samples/**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/3DS.yml'
    # ci_paths: end
  pull_request:
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!samples/**'
      - '!libretro-common/samples/**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/3DS.yml'
    # ci_paths: end
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: 
      image: reallibretroretroarch/libretro-build-devkitpro:latest
      options: --user root --dns 1.1.1.1 --dns 8.8.8.8

    steps:
    - uses: taiki-e/checkout-action@v1
    
    - name: Compile Salamander
      run: |
        make -f Makefile.ctr.salamander -j$(getconf _NPROCESSORS_ONLN) USE_CTRULIB_2=1 clean
        make -f Makefile.ctr.salamander -j$(getconf _NPROCESSORS_ONLN) USE_CTRULIB_2=1
    
    - name: Compile RA
      run: |
        make -f Makefile.ctr -j$(getconf _NPROCESSORS_ONLN) USE_CTRULIB_2=1 clean
        make -f Makefile.ctr -j$(getconf _NPROCESSORS_ONLN) USE_CTRULIB_2=1 HAVE_STATIC_DUMMY=1 info all
