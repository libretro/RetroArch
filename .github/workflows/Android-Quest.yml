name: CI Android (Quest)

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Link with lld
      run: sh .github/workflows/scripts/use-lld.sh

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Compile RA
      run: |
        cd pkg/android/phoenix
        ./gradlew assembleQuestDebug

    - name: Get short SHA
      id: slug
      run: echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v7
      with:
        name: retroarch-android-quest-${{ steps.slug.outputs.sha8 }}
        path: pkg/android/phoenix/build/outputs/apk/quest/debug/phoenix-quest-debug.apk
        if-no-files-found: error
