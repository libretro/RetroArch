name: CI Linux libretro-common tests

# libretro-common/Makefile.test builds and runs the libcheck unit
# suites under -fsanitize=address -fsanitize=undefined.  Nothing ran
# it, which is how three of its suites came to reference sources that
# had moved and one referenced a library it never linked: a suite that
# cannot be built reads exactly like a suite that passes.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  libretro-common-tests:
    name: Build and run libretro-common/Makefile.test
    runs-on: ubuntu-latest
    env:
      APT_PKGS: build-essential check pkg-config zlib1g-dev gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 wine wine64 ffmpeg gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-mipsel-linux-gnu qemu-user ccache
    # The suites and the stack check have grown with the tree; the
    # companion harnesses are a job of their own, run beside this one.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 20
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-

      - name: Enable ccache
        run: |
          set -eu
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 250M
          ccache -z

      - name: Build and run the unit test suites
        shell: bash
        working-directory: libretro-common
        env:
          # Keep wine quiet and out of $HOME; the first invocation
          # creates the prefix.
          WINEDEBUG: "-all"
          WINEPREFIX: "/tmp/wineprefix"
        run: |
          set -eu
          . "$GITHUB_WORKSPACE/.github/workflows/scripts/wine-server.sh"
          # The recipe builds each suite and runs it, in order.
          # Any suite failing to build, or any check failing, or any
          # sanitizer report, fails the job.
          # 'unit-tests' by name: the default goal of Makefile.test is
          # win32-configs, so a bare make here builds the Windows A/W
          # matrix and none of the suites this step exists to run.  The
          # 'all' target adds the concurrency and I/O samples, whose
          # runtime depends on how many processors the runner has.
          # COVERAGE=0: nothing here reads the coverage, and collecting
          # it instruments every compile and runs lcov once a suite
          make -f Makefile.test unit-tests COVERAGE=0 \
             LIBCHECK_CFLAGS="$(pkg-config --cflags check)" \
             CFLAGS="$(pkg-config --cflags check)"
          echo "[pass] libretro-common unit test suites"
          # The ARMv8 AES + PMULL path executes only on ARM; this
          # runs the crypto suite under qemu-aarch64 in both the
          # dispatched and the baseline-crypto shape.
          make -f Makefile.test crypto-aarch64-check
          make -f Makefile.test crypto-arm-check
          make -f Makefile.test crypto-mips-check
          # every lazily set up table or CPU check, first used by
          # eight threads at once under TSan
          make -f Makefile.test crypto-tsan-check
          # the Windows wait tiers - eventcount and condition variable,
          # high resolution timer and kernel timeout - as Windows
          # binaries under wine
          make -f Makefile.test win32-waits-check

      - name: Check VFS backend symbol parity
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # vfs_implementation_uwp.cpp replaces vfs_implementation.c on
          # UWP rather than extending it, so a function added to the C
          # backend and called from the shared file_stream.c compiles
          # everywhere and fails to link on UWP alone - at the end of a
          # long MSVC build, on a runner most contributors do not have.
          # That is how retro_vfs_file_get_mapped_ptr_impl reached the
          # branch broken.  This is the same check at source level, for
          # free, on Linux.
          tools/check.sh tools/vfs_backend_parity.c

      - name: Check every command describes itself
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # HELP prints command.h's tables, and interfaces that hand the
          # commands to a client are generated from them: a command
          # added without a description reaches all of those blank.
          tools/check.sh tools/command_table_check.c

      - name: Check video and input code stay out of each other's state
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # The frontend starts the input driver; a video driver says
          # only what kind of window it put up. What is still to be
          # moved is listed in the check, file by file, and the lists
          # only shrink: a video file that starts naming an input
          # driver, or either side taking the other's state, fails.
          tools/check.sh tools/input_video_separation_check.c --selftest
          tools/check.sh tools/input_video_separation_check.c

      - name: Check input drivers ask by name and do not take the frontend's state
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # A driver that needs something from the settings, the run
          # loop, the menu or the input frontend asks for it by name;
          # it does not take the whole state and pick a field out.
          # What is still to be converted is listed in the check, file
          # by file with a count, and the counts only go down.
          tools/check.sh tools/input_state_grab_check.c --selftest
          tools/check.sh tools/input_state_grab_check.c

      - name: Check the GL drivers take the hardware ring's fence ahead of the swap
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # Taken after the swap, the fence completes only when a driver
          # that queues swaps releases it, and a hardware rendered core
          # fast-forwards at the display's rate.
          tools/check.sh tools/gl_ring_fence_check.c --selftest
          tools/check.sh tools/gl_ring_fence_check.c

      - name: Check the GL drivers set their vsync report with the swap interval
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # Set apart, the threaded presenter counts a vsync wait as
          # drawing time, or subtracts one that was not made.
          tools/check.sh tools/gl_present_vsynced_check.c --selftest
          tools/check.sh tools/gl_present_vsynced_check.c

      - name: Check a setting's label exists wherever its translations name it
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # The translation files name a label for every string they
          # have, in every build. intl/json2h.py copies a row's feature
          # guard into them, unless the guard line mentions a
          # SETTINGS_DEF pass: that line it drops. A line that mentions
          # a pass and still depends on a feature leaves the
          # translations naming a label the build does not have, and
          # nothing fails until the first translation arrives from
          # Crowdin - then every build without the feature does.
          tools/check.sh tools/settings_def_guard_check.c --selftest
          tools/check.sh tools/settings_def_guard_check.c

      - name: Check no video driver deletes overlay textures it was lent
        shell: bash
        run: |
          set -eu
          # load_textures lends a driver the overlay pack's handles for
          # one page; they are on the pack's other pages too and are
          # the pack's to delete. gl2 marked them as borrowed and then
          # deleted them anyway at the next page, so rotating an
          # Android device blacked the overlay out until the core was
          # restarted. No runner can run a GL driver, so this is the
          # check at source level: every driver with load_textures
          # sets, tests and clears its borrowed marker.
          tools/check.sh tools/overlay_texture_ownership.c

      - name: Check overlay setters refuse an image the driver does not hold
        shell: bash
        run: |
          set -eu
          # set_alpha, vertex_geom and tex_geom are called whenever the
          # layout, opacity or page changes, not only after a load()
          # that worked: with no page the driver's arrays are NULL, and
          # after a smaller page or a failed load the index is off the
          # end. 7661ab06e7 bounded the GL geometry setters and missed
          # set_alpha; D3D, Vulkan and Metal had no check at all. No
          # runner can run these drivers, so this is the check at
          # source level for the ones that have been audited.
          tools/check.sh tools/overlay_setter_bounds.c

      - name: WDM-KS ABI against the system ks.h
        shell: bash
        working-directory: samples/audio/wdmks_abi
        run: |
          set -eu
          # audio/common/wdmks_ks.h declares the kernel-streaming
          # interface the WDM-KS driver uses, because ks.h and
          # ksmedia.h ship with the driver kit rather than the
          # Platform SDK and not every toolchain here has them.
          #
          # That is only safe while what is declared matches what the
          # system declares. A wrong layout does not fail to build and
          # does not misbehave visibly: it hands the kernel a structure
          # whose fields are in the wrong places. So this compiles ours
          # beside the real headers and asserts every size, every field
          # offset, every constant and the IOCTL code, on both word
          # sizes, and in C89 as well as gnu99.
          #
          # It has already earned it. KSDATAFORMAT is a union with a
          # LONGLONG that aligns it to eight; declared as the plain
          # struct it resembles, KSDATARANGE_AUDIO came out 84 bytes
          # against 88 and every field past the first would have been
          # read four bytes off.
          make check
          echo "[pass] wdmks_abi"

      - name: Check stack frame budget
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # PSP and GX threads get 8 KiB of stack (STACKSIZE in
          # rthreads/psp_pthread.h and rthreads/gx_pthread.h).  Nothing
          # warns when a local buffer outgrows that: it builds
          # everywhere and overflows only on a target most contributors
          # cannot build.  config_file_write() carried a 16 KiB stdio
          # buffer as a local - twice that stack - on a path reached
          # from a task handler, and nothing noticed.
          python3 tools/stack_budget.py

      - name: ccache statistics
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ccache -sv

      - name: Save ccache
        # Only master's pushes keep a cache: pull requests restore
        # master's, so one push does not evict the next one's.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}

  companion-tests:
    name: Companion regression tests
    runs-on: ubuntu-latest
    env:
      APT_PKGS: build-essential pkg-config zlib1g-dev ffmpeg ccache gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 gobjc gnustep-devel gnustep-back-common xvfb wine
    # beside the suites, not after them: together they took twice as
    # long as either
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 20
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-

      - name: Enable ccache
        run: |
          set -eu
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 250M
          ccache -z

      - name: Check companion backend feature parity
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # The Qt, Win32 and Cocoa desktop companions share one C core
          # but each has its own presentation; a backend can quietly omit
          # a feature (no file browser, no scan, no core picker) and still
          # build and run, the gap only showing when a user switches
          # drivers.  Source-level check, for free, on Linux.
          tools/check.sh tools/companion_parity.c

      - name: Companion thumbnail engine regression test (plain, TSan, ASan)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # The shared thumbnail engine every desktop companion draws
          # through: real decoder, decode threads, cache, priority,
          # cancel, shutdown, and one hover on a video (the still and
          # the animation share one session).  Under both sanitizers,
          # since it is the one piece of threaded code in the
          # companions.
          tools/companion_thumbs_test.sh
          tools/companion_thumbs_test.sh tsan
          tools/companion_thumbs_test.sh asan

      - name: Companion core regression test (plain, ASan)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # The toolkit-free model every desktop companion drives:
          # playlist listing and All Playlists, the thumbnail path rule,
          # the file browser, the run / needs-core paths, launch
          # options - against real .lpl fixtures, with RetroArch's
          # state replaced by stubs.
          tools/companion_core_test.sh
          tools/companion_core_test.sh asan
          tools/companion_core_test.sh tsan

      - name: C89 / Win32 syntax gate on the companion sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # MSVC 2005 builds these as C89 through griffin. The gate's
          # second pass needs a 32-bit mingw for the Windows-only unit
          # (the host gcc has no <windows.h>, which used to make the
          # pass skip it silently - that is how mixed declarations
          # reached master).
          tools/mingw_syntax_check.sh ui/drivers/ui_win32_companion.c \
             ui/companion/companion_core.c ui/companion/companion_thumbs.c \
             ui/companion/companion_dock.c \
             gfx/gfx_anim_preview.c

      - name: Cocoa companion regression harness (GNUstep AppKit, headless)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # The real ui/drivers/ui_cocoa_companion.m, compiled and linked
          # against GNUstep's Foundation + AppKit with the real companion
          # core and the core test's fixtures, driven under Xvfb the way a
          # user drives it (view popup, File Browser tab, close) and
          # checked on the AppKit objects themselves.
          tools/companion_cocoa_test.sh
          # ASan too: the grid's prefetch reaching past the thumbnail
          # marks only shows under a checking allocator (it crashed the
          # app on macOS, where Apple's is one).
          tools/companion_cocoa_test.sh asan

      - name: Win32 companion regression harness (mingw + Wine, headless)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          # The real ui/drivers/ui_win32_companion.c, built with mingw and
          # linked with the real companion core and the core test's
          # fixtures, run under Wine on Xvfb and driven with the messages
          # the widgets send; checked on the real controls.
          tools/companion_win32_test.sh

      - name: ccache statistics
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ccache -sv

      - name: Save ccache
        # Only master's pushes keep a cache: pull requests restore
        # master's, so one push does not evict the next one's.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
