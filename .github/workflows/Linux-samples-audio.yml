name: CI Linux samples/audio

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  samples-audio:
    name: Build and run samples/audio
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Install dependencies
        timeout-minutes: 5
        run: |
          pkgs="build-essential libasound2-dev libsdl2-dev libopenal-dev"
          if dpkg -s $pkgs >/dev/null 2>&1; then
            echo "All packages already present on runner image; skipping apt."
            exit 0
          fi
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update failed (attempt $i); retrying in 10s"
            sleep 10
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and run mixer_lock_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/audio/mixer_lock
        run: |
          set -eu
          # Includes audio/audio_driver.c and drives the mixer's public
          # entry points with a real state lock in place. The lock is a
          # plain mutex, so any path that reaches a locking entry point
          # while already holding it parks the thread against itself;
          # loading the first menu sound did exactly that
          # (libretro/RetroArch#19485). Every case runs on a watchdog:
          # a reintroduced recursive acquisition aborts with a stack
          # instead of hanging the job. Also covers the lock being
          # released on out-of-range slots and a NULL stream name
          # surviving removal.
          make clean all SANITIZER=address,undefined
          test -x mixer_lock_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 120 \
             ./mixer_lock_test
          echo "[pass] mixer_lock_test (ASan)"
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 300 ./mixer_lock_test
          echo "[pass] mixer_lock_test (TSan)"

      - name: Build and run thread_handshake_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/audio/thread_handshake
        run: |
          set -eu
          # Links audio/audio_thread_wrapper.c against a scripted
          # driver. The wrapped thread parks in one of two waits and
          # the main thread's block() needs stopped_ack from either; a
          # stop() landing between start()'s signal and the thread's
          # re-check used to leave it in the one wait that never
          # acknowledged. Two thousand start/stop round-trips hit that
          # window on the previous wrapper on every run. The scripted
          # device can also stop returning from a call: a stop must
          # then still complete once the call does, and must be
          # reported exactly once meanwhile - prompt handshakes are
          # asserted not to be reported.
          make clean all SANITIZER=address,undefined
          test -x thread_handshake_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 300 \
             ./thread_handshake_test
          echo "[pass] thread_handshake_test (ASan)"
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 600 ./thread_handshake_test
          echo "[pass] thread_handshake_test (TSan)"

      - name: Build and run alsa_wait_writable_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/audio/alsa_wait_writable
        run: |
          set -eu
          # Links the shipping audio/drivers/alsa.c and interposes the
          # five libasound calls alsa_wait_writable() makes via
          # -Wl,--wrap, so the devices no stock PCM can produce on
          # demand are scripted: a running stream whose poll never
          # signals, a prepared stream reporting no space, a start that
          # lands in an underrun storm, and wakes that never deliver
          # space. Each must return 0 within a bounded lap and wall-time
          # budget rather than parking the audio thread; the previous
          # wait was an unbounded snd_pcm_wait(-1). The conforming path
          # runs end-to-end on the null PCM, and the harness skips
          # cleanly if no ALSA configuration is available at all.
          make clean all SANITIZER=address,undefined
          test -x alsa_wait_writable_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 120 \
             ./alsa_wait_writable_test
          echo "[pass] alsa_wait_writable_test (ASan)"
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 300 ./alsa_wait_writable_test
          echo "[pass] alsa_wait_writable_test (TSan)"

      - name: Build and run alsa_lifecycle_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/audio/alsa_lifecycle
        run: |
          set -eu
          # Links the shipping audio/drivers/alsa.c against the null PCM
          # and scripts the libasound calls that decide stop/start and
          # the blocking write - can_pause, pause, drop, prepare, writei,
          # wait, recover - via -Wl,--wrap. alive() must follow stop()
          # and start() on a device that can pause, one that cannot, and
          # one that says it can and refuses; the blocking write must
          # write first, wait only on EAGAIN, and never without a bound.
          make clean all SANITIZER=address,undefined
          test -x alsa_lifecycle_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 120 \
             ./alsa_lifecycle_test
          echo "[pass] alsa_lifecycle_test (ASan)"
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 300 ./alsa_lifecycle_test
          echo "[pass] alsa_lifecycle_test (TSan)"

      - name: Build and run pipeline_stall_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/audio/pipeline_stall
        run: |
          set -eu
          # Includes audio/audio_driver.c and runs the threaded pipeline's
          # shipping producer and consumer against a scripted driver whose
          # write_raw() path reaches the device without the resampler or
          # the arenas. The device is then made to stop taking audio. The
          # consumer must take nothing from the ring it cannot deliver and
          # report no progress it did not make; the producer must record
          # the stall after one bounded wait and drop at once thereafter;
          # and both must recover when the device returns. The previous
          # consumer took the chunk first, threw it away on finding no
          # room, and cleared the stall - the frontend paced at one frame
          # per failed pass for as long as the device was stuck.
          make clean all SANITIZER=address,undefined
          test -x pipeline_stall_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 180 \
             ./pipeline_stall_test
          echo "[pass] pipeline_stall_test (ASan)"
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 400 ./pipeline_stall_test
          echo "[pass] pipeline_stall_test (TSan)"

      - name: Build and run upmix_test (plain, ASan + UBSan)
        shell: bash
        working-directory: samples/audio/upmix
        run: |
          set -eu
          # The stereo-to-wider stage at the last step before a device
          # opened with a wider speaker layout. A layout is a mask of
          # positions in ascending bit order, never a count: 5.1 with
          # the rear pair at the back and 5.1 with it at the sides are
          # two layouts whose slots differ. The fronts carry the stereo
          # unchanged, the rear pair -3 dB in its own slots, the centre
          # the -6 dB sum, the LFE the bass through a 120 Hz low-pass and
          # none of the treble; stereo is a copy; a mask the stage
          # cannot fill is refused.
          make clean all
          ./upmix_test
          echo "[pass] upmix_test"
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./upmix_test
          echo "[pass] upmix_test (ASan)"

      - name: Build and run discrete_multichannel_test (plain, ASan + UBSan)
        shell: bash
        working-directory: samples/audio/discrete_multichannel
        run: |
          set -eu
          # A core's 5.1 through the multi-channel batch entry to a 5.1
          # device without the fold and the upmix in between: each
          # device channel carries its core channel's tone and none of
          # the others', in all four format pairings, through the
          # resampler off unity; over the threaded ring; recorded; and
          # to a stereo device, the fold at the BS.775 gains with the
          # LFE dropped. The last case runs the shipping WASAPI driver
          # over the fake device from wasapi_exclusive_pacing, so a
          # 5.1 core reaches a Dolby Digital decoder as AC-3 bursts
          # that decode back to its own channels. Includes the
          # shipping audio_driver.c.
          make clean all
          ./discrete_multichannel_test
          echo "[pass] discrete_multichannel_test"
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./discrete_multichannel_test
          echo "[pass] discrete_multichannel_test (ASan)"

      - name: Build and run embedded_alsa_test (the embedded ALSA driver, mock kernel device)
        shell: bash
        working-directory: samples/audio/embedded_alsa
        run: |
          set -eu
          # The "tinyalsa" driver in audio/drivers/alsa.c talks the
          # kernel PCM ioctls directly. abi_check compares its copy of
          # that ABI - extracted from the driver itself, so it cannot
          # go stale - against <sound/asound.h>: every struct size and
          # offset, constant and ioctl number. The test then runs the
          # driver against a mock device that refines parameters the
          # way the kernel does.
          make clean check
          echo "[pass] embedded_alsa_test"
          make clean check SANITIZER=address,undefined
          echo "[pass] embedded_alsa_test (ASan)"

      - name: Build and run ealsa_test (the embedded ALSA driver against a mock PCM device)
        shell: bash
        working-directory: samples/audio/ealsa
        run: |
          set -eu
          # The embedded driver in audio/drivers/alsa.c talks to the
          # kernel's PCM ABI through one seam - open, ioctl, close,
          # poll - so a scripted device that answers the way a card
          # does runs it with no card present, and can refuse a rate, a
          # format, a channel count or a period grid, which is where a
          # negotiation goes wrong. Built with HAVE_TINYALSA alone, so
          # the build never sees an alsa-lib header either. It also
          # carries what tinyalsa_write_test used to check of the
          # driver this one replaced: a full device refusing in both
          # modes, a device that never signals, a poll cut short by a
          # signal, and the first write reporting what it took.
          make clean all
          ./ealsa_test
          echo "[pass] ealsa_test"
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./ealsa_test
          echo "[pass] ealsa_test (ASan)"

      - name: Build and run bitstream_test (plain, ASan + UBSan)
        shell: bash
        working-directory: samples/audio/bitstream
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # audio/audio_bitstream.c: a coded stream on its way to a
          # receiver, which the PCM pipeline has no place for. Real
          # DTS and AC-3 from ffmpeg, handed over frame by frame:
          # bursts leave whole and never partial, the queue paces the
          # source rather than the source running ahead, a gap
          # produces the pause burst the standard has for it rather
          # than silence (which makes a receiver drop its lock), and
          # the PCM frames reported are the device time the bytes
          # occupy.
          make clean all
          ./bitstream_test
          echo "[pass] bitstream_test"
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./bitstream_test
          echo "[pass] bitstream_test (ASan)"

      - name: Build and run opensl_test (the Android driver against a mock OpenSL player)
        shell: bash
        working-directory: samples/audio/opensl
        run: |
          set -eu
          # audio/drivers/opensl.c is Android-only and has no build
          # here, so it is built against stand-in <SLES/*.h> over a
          # scripted player whose queue a thread drains: the block
          # arithmetic at the latencies of issue #6405 and below, the
          # queue accounting the hang there came from, float and
          # 16-bit, a full queue, and a device that stops consuming.
          make clean all
          ./opensl_test
          echo "[pass] opensl_test"
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./opensl_test
          echo "[pass] opensl_test (ASan)"
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 ./opensl_test
          echo "[pass] opensl_test (TSan)"

      - name: Build and run qsa_test (the QNX driver against a mock QSA device)
        shell: bash
        working-directory: samples/audio/qsa
        run: |
          set -eu
          # audio/drivers/alsa_qsa.c is QNX-only and has no build here,
          # so it is built against a stand-in <sys/asoundlib.h> over a
          # scripted device: init and its failure path, the rate it
          # reports back, blocking and non-blocking writes, stop and
          # start, underrun recovery, and a device that stops draining.
          # Not a substitute for a QNX build; it is the coverage the
          # driver had none of.
          make clean all
          ./qsa_test
          echo "[pass] qsa_test"
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./qsa_test
          echo "[pass] qsa_test (ASan)"

      - name: Build and run live_drivers_test (a live PulseAudio server, a null ALSA PCM)
        shell: bash
        working-directory: samples/audio/live_drivers
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libpulse-dev pulseaudio
          # A server with a null sink, and an ALSA config naming a null
          # PCM: the real drivers against the real libraries, no
          # hardware. Pulse's telemetry is cached from the server
          # thread's callbacks; ALSA is run once as the device reports
          # itself and once told it cannot pause, the fallback from
          # snd_pcm_pause to snd_pcm_drop.
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR/pulse"
          printf 'pcm.nullpcm { type null }\n' > "$HOME/.asoundrc"
          pulseaudio --daemonize=no --exit-idle-time=-1 --disallow-exit -n \
            -L "module-null-sink sink_name=nullsink rate=48000 channels=2" \
            -L "module-native-protocol-unix auth-anonymous=1 socket=$XDG_RUNTIME_DIR/pulse/native" \
            --log-target=file:/tmp/pa.log &
          PA_PID=$!
          sleep 3
          make clean all
          ./live_drivers_test
          echo "[pass] live_drivers_test"
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./live_drivers_test
          echo "[pass] live_drivers_test (ASan)"
          kill $PA_PID || true

      - name: Build and run binaural_test (plain, ASan + UBSan)
        shell: bash
        working-directory: samples/audio/binaural
        run: |
          set -eu
          # A layout rendered to two ears for headphones: a left speaker
          # arrives at the left ear first, louder and brighter; the rear
          # pair duller than the front; centre and LFE alike to both
          # ears; a centred source keeps its level and a full-scale one
          # leaves at full scale; the two 5.1s render their rear pair
          # from different directions; stereo is a mild crossfeed.
          make clean all
          ./binaural_test
          echo "[pass] binaural_test"
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./binaural_test
          echo "[pass] binaural_test (ASan)"

      - name: Build and run pipeline_rate_control_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/audio/pipeline_rate_control
        run: |
          set -eu
          # Includes audio/audio_driver.c and runs the threaded pipeline's
          # shipping producer, consumer and rate controller against a
          # device whose 8 ms buffer drains at exactly 48000 frames a
          # second of wall-clock time, fed one 800-frame video frame every
          # 1/60 s on an absolute schedule, audio sync off. The clocks
          # match, so the right ratio is 1.0: after a four-second settle
          # the mean rate adjustment over three seconds must be within
          # 500 ppm of it, and the device must have taken 99.5% of what
          # was produced. Rate control on the pipeline samples pipe and
          # device together, at the producer; reading the device alone,
          # which the consumer holds between half and full, pins the
          # ratio at a bound and the pipe overflows behind it. Real time,
          # so a loaded runner can shift the mean; the tolerance is ten
          # times the settled residual.
          make clean all SANITIZER=address,undefined
          test -x pipeline_rate_control_test
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 timeout 120 \
             ./pipeline_rate_control_test
          echo "[pass] pipeline_rate_control_test (ASan)"
          # A core late by 60 ms every 2 s, audio sync off: the silence is
          # the stalls' own and no more, the late audio is not kept, and
          # rate control is not pinned against a backlog. And with sync on:
          # the writer waits, nothing is dropped.
          ASAN_OPTIONS=detect_leaks=0 timeout 120 ./pipeline_rate_control_test 12 4 jitter
          ASAN_OPTIONS=detect_leaks=0 timeout 120 ./pipeline_rate_control_test 12 4 sync-jitter
          echo "[pass] pipeline_rate_control_test (late core, ASan)"
          # The 64 ms default buffer, sync off, a steady core and a late one:
          # the consumer's chunks are whole publishes and the pipe's fill
          # swings by one with the phase; nothing is dropped from a steady
          # core at any phase.
          ASAN_OPTIONS=detect_leaks=0 timeout 120 ./pipeline_rate_control_test 16 4 big
          ASAN_OPTIONS=detect_leaks=0 timeout 120 ./pipeline_rate_control_test 16 4 big-jitter
          echo "[pass] pipeline_rate_control_test (64 ms device, ASan)"
          # The producer held 4 ms every five seconds, as a loaded runner
          # holds it: a publish pushed across a sink window boundary. The
          # estimate must settle and apply about zero, not the shift.
          ASAN_OPTIONS=detect_leaks=0 timeout 120 ./pipeline_rate_control_test 16 4 big-stall
          echo "[pass] pipeline_rate_control_test (stalled producer, ASan)"
          # A float core on a float ring into a float device: a signal a
          # tenth of an int16 LSB high arrives as published, not as zero.
          ASAN_OPTIONS=detect_leaks=0 timeout 120 ./pipeline_rate_control_test 16 4 float
          echo "[pass] pipeline_rate_control_test (float core, ASan)"
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 240 ./pipeline_rate_control_test
          echo "[pass] pipeline_rate_control_test (TSan)"

      - name: Build and run resampler_reset_test (ASan + UBSan)
        shell: bash
        working-directory: samples/audio/resampler_reset
        run: |
          set -eu
          # Every resampler backend's reset(): after it the stream
          # continues as a freshly initialised backend would, to the
          # sample, at the ratios the frontend meets - and the reset
          # makes no allocation, counted through wrapped malloc, calloc
          # and memalign_alloc.
          make clean all SANITIZER=address,undefined
          test -x resampler_reset_test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 timeout 60 ./resampler_reset_test
          echo "[pass] resampler_reset_test (ASan)"

      - name: Build and run ff_speedup_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/audio/ff_speedup
        run: |
          set -eu
          # Includes audio/audio_driver.c with the clock replaced by a
          # counter. The fast-forward speedup multiplier must follow the
          # core's cadence on both pipelines: measured at the flush inline,
          # and by the producer at its publish cadence on the threaded
          # pipeline, where the consumer's own flush interval is the device
          # draining the previous chunk and would only confirm the previous
          # multiplier. Re-entry after an idle spell must start from unity
          # rather than read the idle time as one flush interval.
          make clean all SANITIZER=address,undefined
          test -x ff_speedup_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 120 ./ff_speedup_test
          echo "[pass] ff_speedup_test (ASan)"
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1 timeout 120 ./ff_speedup_test
          echo "[pass] ff_speedup_test (TSan)"

      - name: Build and run device_list_driver_test (ASan + UBSan)
        shell: bash
        working-directory: samples/audio/device_list_driver
        run: |
          set -eu
          # Includes audio/audio_driver.c with the alsa and null drivers in
          # the table. Picking a driver in the menu writes the setting but
          # does not reinitialise audio, and the Device list - rebuilt on
          # each open - was asked of the running driver, so it showed the
          # old driver's devices under the new driver's name until a
          # restart. The list now comes from the configured driver, and
          # is freed by the driver that built it. Cases: configured and
          # running agree; configured differs from running; back again;
          # nothing running; and release by the builder, once.
          make clean all SANITIZER=address,undefined
          test -x device_list_driver_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 120 \
             ./device_list_driver_test
          echo "[pass] device_list_driver_test (ASan)"

      - name: Build and run rate_control_bounds_test (ASan + UBSan)
        shell: bash
        working-directory: samples/audio/rate_control_bounds
        run: |
          set -eu
          # Includes audio/audio_driver.c and runs the rate control's
          # shipping computation against a scripted driver. At the
          # setpoint, empty and full it must give 1.0 and the band's two
          # edges; with write_avail() reporting five times buffer_size()
          # it must give the upper edge and no more. Before the clamp an
          # over-reporting driver drove it nine times past the band.
          make clean all SANITIZER=address,undefined
          test -x rate_control_bounds_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 60 \
             ./rate_control_bounds_test
          echo "[pass] rate_control_bounds_test (ASan)"

      - name: Build and run latency_contract_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/audio/latency_contract
        run: |
          set -eu
          # Real drivers on backends that need no hardware - the ALSA null
          # PCM, SDL's dummy audio, OpenAL Soft's null device - opened at
          # 64 and 32 ms and checked against audio_driver.h's contract:
          # buffer_size() is the setting in bytes of the output format,
          # write_avail() never exceeds it, a buffer's worth offered takes
          # room, and the room comes back as the device plays. The sdl
          # driver before fdda5f7 reports 42.7 ms against 64 here.
          make clean all SANITIZER=address,undefined
          test -x latency_contract_test
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 120 \
             ./latency_contract_test
          echo "[pass] latency_contract_test (ASan)"
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1:suppressions=$PWD/tsan.supp \
             timeout 300 ./latency_contract_test
          echo "[pass] latency_contract_test (TSan)"

      - name: Build and run asio_convert_test (ASan + UBSan)
        shell: bash
        working-directory: samples/audio/asio_convert
        run: |
          set -eu
          # audio/drivers/asio_convert.h is the ASIO driver's sample
          # conversion, pure C, so it runs here without Windows. Every
          # ASIOSampleType the specification defines is converted for full
          # scale, zero, half and one 16-bit step in both signs and checked
          # byte for byte against the layout the specification gives - the
          # Int32LSB16..24 family as low-aligned, sign-extended words, the
          # MSB types big-endian. Saturation and the silence fill past the
          # supplied frames are checked too. The converter this replaced
          # wrote five types and memset the rest to silence.
          make clean all SANITIZER=address,undefined
          test -x asio_convert_test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 timeout 60 \
             ./asio_convert_test
          echo "[pass] asio_convert_test (ASan)"

      - name: Build and run asio_ring_test (ASan + UBSan)
        shell: bash
        working-directory: samples/audio/asio_ring
        run: |
          set -eu
          # audio/drivers/asio_ring.h sizes the ring in front of the ASIO
          # device: the latency setting less the device's reported stage,
          # floored at four periods where that is under 6 ms, 6 ms where it
          # is over, two periods at the least. Arithmetic only, so it runs
          # here without Windows. The expected frames are worked by hand
          # from those rules for the devices that set them - ASIO4ALL at 64
          # frames, a wrapper locked at 528, a USB DAC at 8 and 128 - and
          # the two points where the rules meet.
          make clean all SANITIZER=address,undefined
          test -x asio_ring_test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 timeout 60 \
             ./asio_ring_test
          echo "[pass] asio_ring_test (ASan)"

      - name: Build and run wasapi_exclusive_pacing_test (ASan + UBSan, then TSan)
        shell: bash
        working-directory: samples/audio/wasapi_exclusive_pacing
        run: |
          set -eu
          # audio/drivers/wasapi.c, unmodified but for its Windows include
          # lines, against a fake device on a real-time clock: exclusive
          # and event-driven, one period per endpoint buffer, every period
          # taken or counted unanswered. The writer is a frontend with audio
          # sync off: one frame of core audio per non-blocking write, no rate
          # control. Passes when no period goes unanswered in either mode and
          # nothing is dropped once the buffer holds a frame. Before the pump
          # thread and the drain-first shared write this run gave 3-10% of
          # periods unanswered; the first smaller-period attempt without the
          # pump gave 75%.
          make clean all SANITIZER=address,undefined
          test -x wasapi_exclusive_pacing_test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 timeout 120 \
             ./wasapi_exclusive_pacing_test 3
          echo "[pass] wasapi_exclusive_pacing_test (ASan)"
          make clean all SANITIZER=thread
          timeout 180 ./wasapi_exclusive_pacing_test 3
          echo "[pass] wasapi_exclusive_pacing_test (TSan)"

      - name: Build and run sink_rate_test (ASan + UBSan)
        shell: bash
        working-directory: samples/audio/sink_rate
        run: |
          set -eu
          # The frontend's sink rate estimator against a scripted driver
          # on a synthetic clock: a device 120 ppm fast and 80 ppm slow are
          # measured and the resampling bias converges onto them; 5000 ppm
          # stops at the clamp; with rate control on the bias absorbs rate
          # control's mean adjustment; a paused window, a count that went
          # backwards, and a stalled window move nothing; disabled, nothing
          # moves at all.
          make clean all SANITIZER=address,undefined
          test -x sink_rate_test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 timeout 60 ./sink_rate_test
          echo "[pass] sink_rate_test (ASan)"

      - name: Build and run pacing_test (ASan + UBSan)
        shell: bash
        working-directory: samples/runloop/pacing
        run: |
          set -eu
          # The three pacing decisions the runloop makes every
          # iteration, run from runloop.h so this is the shipping code
          # rather than a copy of it. The gap limiter over all 128
          # combinations of the pace bits by nonblocking by fastmotion -
          # exactly one may engage, because engaging next to another
          # source double-paces and engaging under fast-forward
          # throttles it to 1x, and both look like performance bugs
          # rather than pacing bugs. The frame period over the rates a
          # core can report including zero and a million, bounded and
          # monotonic. And the filter on the measured loop rate, which
          # has to reject a stall: one 0.9 s sample used to pull a 60
          # fps reading to 8 and take several frames to recover.
          make clean all SANITIZER=address,undefined
          test -x pacing_test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 timeout 60 ./pacing_test
          echo "[pass] pacing_test (ASan)"

      - name: Build the ALSA objects through configure (--enable-alsa)
        shell: bash
        run: |
          set -eu
          # The harnesses above compile audio/drivers/alsa.c with
          # -DHAVE_ALSA on the command line. A distribution build takes
          # HAVE_ALSA from config.h instead, and the file gates its
          # alsa-lib includes on it, so build the objects that way too:
          # configure with ALSA on, then compile them. That covers the
          # object a distribution ships as well as the ones the
          # harnesses build (libretro/RetroArch#19525).
          ./configure --enable-alsa --disable-qt --disable-ffmpeg \
            --disable-x11 --disable-wayland
          grep -q '^HAVE_ALSA = 1' config.mk
          make obj-unix/release/audio/drivers/alsa.o \
               obj-unix/release/audio/common/alsa.o
