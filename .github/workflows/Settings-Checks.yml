name: CI Settings definitions

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  settings-checks:
    name: Settings table drift and griffin-order unity compile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configuration table drift
        shell: bash
        run: |
          set -eu
          # A def row that stops reaching the configuration tables
          # produces no compile diagnostic anywhere; this diff is the
          # only thing that notices. Preprocessor only, no configure.
          python3 tools/settings_check.py table \
            --check tools/settings_table.reference

      - name: Griffin-order unity compile
        shell: bash
        run: |
          set -eu
          # Compiles the settings TUs concatenated in griffin/griffin.c
          # order at -Werror. Macro leakage between msg_hash.h, the
          # settings/ def files and configuration.c only manifests in
          # this concatenation; per-file builds cannot see it.
          python3 tools/settings_check.py unity

      - name: Migration tool self-test
        shell: bash
        run: |
          set -eu
          # Runs the settings migrator over defect-class fixtures and
          # asserts the emission: no-default rows keep their literal
          # configuration row, DEFAULT_* macro spellings survive,
          # guard breadth is preserved in both directions and both
          # string topologies, and genuine default divergence aborts.
          python3 tools/settings_migrate_selftest.py
