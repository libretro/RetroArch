name: CI Linux (i686)

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: reallibretroretroarch/libretro-build-i386-ubuntu:xenial-gcc9
      options: --user root

    steps:
      - name: Check Out Repo
        uses: taiki-e/checkout-action@v1

      - name: Configure Build
        run: |
          ./configure --disable-qt --enable-xdelta

      - name: Compile RA
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) clean
          make -j$(getconf _NPROCESSORS_ONLN) info all

      - name: Stack frame sweep
        run: |
          set -eu
          # Every stack frame in the graphics objects against the
          # ceiling in CODING-GUIDELINES. It runs here rather than with
          # the other checks because this is the job that builds the
          # drivers: the menu harness turns OpenGL, Vulkan and the rest
          # off for its own reasons, and the frames this sweep is for
          # live in exactly those files.
          .github/workflows/scripts/stack-frame-sweep.sh

      - name: Get short SHA
        id: slug
        run: echo "::set-output name=sha8::$(echo ${GITHUB_SHA} | cut -c1-8)"
