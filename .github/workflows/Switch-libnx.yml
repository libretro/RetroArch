name: CI Switch/libnx

on:
  push:
    branches: [master]
  pull_request:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: reallibretroretroarch/libretro-build-libnx-devkitpro:v4-10-0
      options: --user root

    steps:
    - uses: actions/checkout@v4

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ github.workflow }}-${{ github.job }}-

    - name: Set up ccache
      run: |
        # Best effort: without ccache, ccache-make.sh runs plain make.
        command -v ccache > /dev/null || {
          s=$(command -v sudo || true)
          for i in 1 2 3; do
            $s timeout 90 apt-get -yq update \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 &&
            $s timeout 120 apt-get -yq install --no-install-recommends \
              ccache > /dev/null && break
            echo "installing ccache failed (attempt $i); retrying in 10s"
            sleep 10
          done
        }
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=250M" >> "$GITHUB_ENV"
        if command -v ccache > /dev/null; then
          CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" ccache -z
        fi

    - name: Compile RA
      run: |
        make -f Makefile.libnx -j$(getconf _NPROCESSORS_ONLN) clean
        bash .github/workflows/scripts/ccache-make.sh -f Makefile.libnx -j$(getconf _NPROCESSORS_ONLN) HAVE_STATIC_DUMMY=1

    - name: ccache statistics
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: ccache -sv || ccache -s

    - name: Save ccache
      # Only master's pushes keep a cache: pull requests restore
      # master's, so one push does not evict the next one's.
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}

    - name: Get short SHA
      id: slug
      run: echo "::set-output name=sha8::$(echo ${GITHUB_SHA} | cut -c1-8)"

    - uses: actions/upload-artifact@v4
      with:
        name: RA-libnx-dummy-${{ steps.slug.outputs.sha8 }}
        path: |
          retroarch_switch.nro
