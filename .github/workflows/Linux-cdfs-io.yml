name: CI CDFS sector I/O

on:
  push:
    branches: [master]
    paths:
      - 'libretro-common/formats/cdfs/**'
      - 'libretro-common/include/formats/cdfs.h'
      - 'libretro-common/samples/formats/cdfs/**'
      - 'cheevos/cheevos.c'
      - '.github/workflows/Linux-cdfs-io.yml'
  pull_request:
    branches: [master]
    paths:
      - 'libretro-common/formats/cdfs/**'
      - 'libretro-common/include/formats/cdfs.h'
      - 'libretro-common/samples/formats/cdfs/**'
      - 'cheevos/cheevos.c'
      - '.github/workflows/Linux-cdfs-io.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cdfs:
    runs-on: ubuntu-latest
    env:
      APT_PKGS: build-essential gcc-mingw-w64-x86-64 wine64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 15
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Linux sectors and faults
        working-directory: libretro-common/samples/formats/cdfs
        run: |
          set -eu
          make -j2 SANITIZER=address,undefined SAMPLE_OBJDIR=obj-ci-asan
          ./cdfs_dir_record_test
          ./cdfs_pure_api_test
          ./cdfs_io_error_test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      - name: Windows sectors and faults
        working-directory: libretro-common/samples/formats/cdfs
        run: |
          set -eu
          . "$GITHUB_WORKSPACE/.github/workflows/scripts/wine-server.sh"
          make -j2 CC=x86_64-w64-mingw32-gcc OS=Windows_NT EXE=.exe SAMPLE_OBJDIR=obj-ci-win
          WINEDEBUG=-all wine ./cdfs_dir_record_test.exe
          WINEDEBUG=-all wine ./cdfs_pure_api_test.exe
          WINEDEBUG=-all wine ./cdfs_io_error_test.exe
