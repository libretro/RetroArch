name: CI PS2

on:
  push:
    branches: [master]
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!samples/**'
      - '!libretro-common/samples/**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/PS2.yml'
    # ci_paths: end
  pull_request:
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!samples/**'
      - '!libretro-common/samples/**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/PS2.yml'
    # ci_paths: end
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: reallibretroretroarch/libretro-build-ps2:latest
      options: --user root --dns 1.1.1.1 --dns 8.8.8.8

    steps:
    - uses: actions/checkout@v4

    - name: Compile Salamander
      run: |
        make -f Makefile.ps2.salamander -j$(getconf _NPROCESSORS_ONLN) clean
        make -f Makefile.ps2.salamander -j$(getconf _NPROCESSORS_ONLN) release

    - name: Compile RA
      run: |
        make -f Makefile.ps2 -j$(getconf _NPROCESSORS_ONLN) clean
        make -f Makefile.ps2 -j$(getconf _NPROCESSORS_ONLN) HAVE_STATIC_DUMMY=1 info release

    - name: Get short SHA
      id: slug
      run: echo "::set-output name=sha8::$(echo ${GITHUB_SHA} | cut -c1-8)"

    - uses: actions/upload-artifact@v4
      with:
        name: RA-PS2-dummy-${{ steps.slug.outputs.sha8 }}
        path: |
          raboot.elf
          retroarchps2.elf
