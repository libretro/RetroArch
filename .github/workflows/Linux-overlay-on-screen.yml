name: CI Linux overlay on screen

# The one overlay test that looks at the screen. It builds a real
# retroarch with X11 and OpenGL, runs it under Xvfb on Mesa's software
# rasteriser with an input overlay enabled, threaded video off and then
# on, grabs the screen and checks the overlay is where its config puts
# it and nowhere else. It then checks the menu's mouse cursor with an
# overlay up: a page of "nul" buttons (an LED overlay) must leave the
# cursor to the menu, a page that takes input must not. Last, with the
# overlay LED driver on, it checks that only LED images are hidden and
# that a hidden one stays hidden while its button is held.
#
# Every stubbed overlay test passed while an enabled overlay covered the
# whole screen (2026-09-19). Nothing that stubs the driver, or builds
# the pack by hand, can see that; this can.

on:
  push:
    branches:
      - master
    paths:
      - 'input/input_driver.c'
      - 'input/input_overlay*'
      - 'tasks/task_overlay.c'
      - 'led/drivers/led_overlay.c'
      - 'gfx/gfx_surface.*'
      - 'gfx/gfx_surface_player.*'
      - 'libretro-common/formats/video_player.c'
      - 'gfx/video_driver.c'
      - 'gfx/video_thread_wrapper.*'
      - 'gfx/drivers/gl2.c'
      - 'menu/menu_driver.c'
      - 'input/drivers/x11_input.c'
      - 'samples/input/overlay_on_screen/**'
      - 'input/input_driver_choice.c'
      - 'gfx/drivers_context/x_ctx.c'
      - 'gfx/common/x11_common.c'
      - 'samples/input/x11_smoke/**'
      - 'samples/input/windows_wine_smoke/smoke_core.c'
      - '.github/workflows/Linux-overlay-on-screen.yml'
  pull_request:
    paths:
      - 'input/input_driver.c'
      - 'input/input_overlay*'
      - 'tasks/task_overlay.c'
      - 'led/drivers/led_overlay.c'
      - 'gfx/gfx_surface.*'
      - 'gfx/gfx_surface_player.*'
      - 'libretro-common/formats/video_player.c'
      - 'gfx/video_driver.c'
      - 'gfx/video_thread_wrapper.*'
      - 'gfx/drivers/gl2.c'
      - 'menu/menu_driver.c'
      - 'input/drivers/x11_input.c'
      - 'samples/input/overlay_on_screen/**'
      - 'input/input_driver_choice.c'
      - 'gfx/drivers_context/x_ctx.c'
      - 'gfx/common/x11_common.c'
      - 'samples/input/x11_smoke/**'
      - 'samples/input/windows_wine_smoke/smoke_core.c'
      - '.github/workflows/Linux-overlay-on-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only pull requests cancel a superseded run.  On master every push
# gets its own group (keyed by the commit), so a burst of pushes queues
# instead of cancelling the run for the commit before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  overlay-on-screen:
    name: Run retroarch under Xvfb and look at the overlay
    runs-on: ubuntu-latest
    env:
      APT_PKGS: build-essential zlib1g-dev ccache python3 xvfb x11-apps xdotool libgl1-mesa-dri libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev libxtst6 libxxf86vm-dev libxrandr-dev libxinerama-dev libgl-dev libegl-dev
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install dependencies
        timeout-minutes: 20
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-

      - name: Enable ccache
        run: |
          set -eu
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 250M
          ccache -z

      - name: Build RetroArch (X11 + OpenGL, the rest off)
        shell: bash
        run: |
          set -eu
          # What draws the overlay has to be real: X11, the gl driver,
          # the menu, threads. Everything else is build time.
          ./configure --disable-qt --disable-wayland --disable-sdl \
                      --disable-sdl2 --disable-ffmpeg --disable-vulkan \
                      --disable-pulse --disable-discord \
                      --disable-networking --disable-cheevos \
                      --disable-glslang --disable-slang \
                      --disable-spirv_cross --disable-xmb \
                      --disable-materialui --disable-ozone \
                      --disable-7zip --disable-flac \
                      --disable-audiomixer --disable-translate \
                      --disable-accessibility --disable-crtswitchres \
                      --disable-langextra --disable-libretrodb \
                      --disable-video_filter --disable-dsp_filter
          make -j$(nproc)
          ccache -s

      - name: Run overlay_on_screen_test (threaded video off, then on)
        shell: bash
        run: |
          set -eu
          # Two solid magenta squares on a full-screen page. Each must
          # be where the config puts it, the middle of the screen must
          # not be overlay, and the overlay must cover about the area of
          # its two squares. With "does this desc have an image" asked
          # of pixels that had just been released, no desc's geometry
          # was set and the overlay covered 100% of the screen, in both
          # modes.
          timeout 180 python3 samples/input/overlay_on_screen/overlay_on_screen_test.py ./retroarch

      - name: Run overlay_apng_on_screen_test (an animated image plays and loops, threaded off and on)
        shell: bash
        run: |
          set -eu
          timeout 180 python3 samples/input/overlay_on_screen/overlay_apng_on_screen_test.py ./retroarch

      - name: Run overlay_apng_press_on_screen_test (a two-frame image shows its pressed frame, threaded off and on)
        shell: bash
        run: |
          set -eu
          timeout 180 python3 samples/input/overlay_on_screen/overlay_apng_press_on_screen_test.py ./retroarch

      - name: Run overlay_stick_on_screen_test (a movable stick follows the finger and returns, threaded off and on)
        shell: bash
        run: |
          set -eu
          # A movable stick's geometry is sent only when it moves; the
          # picture shows nothing a move needed was left out.
          timeout 180 python3 samples/input/overlay_on_screen/overlay_stick_on_screen_test.py ./retroarch

      - name: Run statistics_on_screen_test (threaded video off, then on)
        shell: bash
        run: |
          set -eu
          # This build has no video filters, and the statistics have
          # to show all the same: they are drawn with the OSD font,
          # which reaches the video state through a binding video init
          # makes whatever the build leaves out.
          timeout 180 python3 samples/gfx/statistics_on_screen/statistics_on_screen_test.py ./retroarch

      - name: Run overlay_menu_mouse_test (display and input packs, threaded off and on)
        shell: bash
        run: |
          set -eu
          # The menu switched its mouse off whenever any overlay was
          # alive, so an LED overlay - nothing on it to press - left a
          # fullscreen desktop user with no menu cursor. A pack of
          # "nul" buttons must now show the cursor where the pointer is
          # moved; the same pack bound to "a" must still not.
          timeout 180 python3 samples/input/overlay_on_screen/overlay_menu_mouse_test.py ./retroarch

      - name: Run overlay_led_hidden_test (mapped and named LED packs, threaded off and on)
        shell: bash
        run: |
          set -eu
          # With the overlay LED driver on and Up held through XTEST: an
          # image at a ledN_map slot, "nul" or a control, stays hidden,
          # as does one named with _led, and a pack that names its LEDs
          # is not mapped.
          timeout 300 python3 samples/input/overlay_on_screen/overlay_led_hidden_test.py ./retroarch

      - name: Run the X11 input scenarios (keys pressed in the window)
        shell: bash
        run: |
          set -eu
          # The same build, on a virtual display of its own, with the
          # X11 input driver: keys are pressed in the window and a small
          # core says in the log what reached it - before and after a
          # fullscreen toggle restarts the video driver, with threaded
          # video and without. See samples/input/x11_smoke/run.sh.
          timeout 600 samples/input/x11_smoke/run.sh

      - name: Save ccache
        # Only master's pushes keep a cache: pull requests restore
        # master's, so one push does not evict the next one's.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
