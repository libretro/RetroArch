name: CI Settings table drift

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  settings-table:
    name: Compare the emitted configuration tables against the reference
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Check the configuration tables
        shell: bash
        run: |
          set -eu
          # Preprocessor only - no configure, no build, no dependencies
          # beyond the gcc and python3 already on the runner. A row in
          # settings/ that stops reaching the configuration table
          # produces no compile diagnostic, so this is the only thing
          # that notices.
          python3 tools/settings_table_check.py \
            --check tools/settings_table.reference
