name: Savestate lifetime regression
on:
  push:
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!samples/**'
      - '!libretro-common/samples/**'
      - '!.github/workflows/*.yml'
      - 'samples/runahead/lifetime/**'
      - 'samples/runloop/autosave_snapshot/**'
      - '.github/workflows/Savestate-lifetime.yml'
    # ci_paths: end
  pull_request:
    # ci_paths: generated by tools/ci_paths.py, do not edit
    paths:
      - '**'
      - '!samples/**'
      - '!libretro-common/samples/**'
      - '!.github/workflows/*.yml'
      - 'samples/runahead/lifetime/**'
      - 'samples/runloop/autosave_snapshot/**'
      - '.github/workflows/Savestate-lifetime.yml'
    # ci_paths: end
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APT_PKGS: gcc-mingw-w64-x86-64
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v5
      - name: Install Windows compiler
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS
      - name: Ownership, with and without threads
        run: |
          make -C samples/runahead/lifetime check BUILD_DIR=plain
          make -C samples/runahead/lifetime check THREADS=0 BUILD_DIR=plain-no-threads
      - name: Reject broken implementations
        run: make -C samples/runahead/lifetime mutants BUILD_DIR=plain
      - name: Ownership under ASan and UBSan
        run: |
          make -C samples/runahead/lifetime check SANITIZER=address,undefined BUILD_DIR=sanitized
          make -C samples/runahead/lifetime check THREADS=0 SANITIZER=address,undefined BUILD_DIR=sanitized-no-threads
          make -C samples/runloop/autosave_snapshot check SANITIZER=address,undefined
      - name: Windows build
        run: make -C samples/runahead/lifetime all CC=x86_64-w64-mingw32-gcc BUILD_DIR=windows

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - threads: 1
            configure: --enable-threads
          - threads: 0
            configure: --disable-threads
    steps:
      - uses: actions/checkout@v5
      - name: Configure headless frontend
        run: >-
          ./configure --disable-menu --disable-qt --disable-x11 --disable-wayland
          --disable-opengl --disable-vulkan --disable-sdl --disable-sdl2 --disable-sdl3
          --disable-ffmpeg --disable-freetype --disable-discord --enable-command
          --enable-networking --enable-runahead ${{ matrix.configure }}
      - name: Build
        run: make -j2
      - name: Actual frontend lifecycle
        run: >-
          make -C samples/runahead/lifetime check THREADS=${{ matrix.threads }}
          FRONTEND="$GITHUB_WORKSPACE/retroarch"
          TEST_ARGS="--output ${{ runner.temp }}/lifetime"
      - name: Retain traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifetime-traces-threads-${{ matrix.threads }}
          path: ${{ runner.temp }}/lifetime
          retention-days: 7
