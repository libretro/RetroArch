name: CI Windows (MSYS2)

on:
  push:
    branches: [master]
  pull_request:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  msys2-build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Existing x64 builds
          - sys: MINGW64
            runner: windows-latest
          - sys: UCRT64
            runner: windows-latest
          - sys: CLANG64
            runner: windows-latest

          # New ARM64 build (native Windows on ARM)
          # MSYS2's runtime runs emulated on these runners, so configure
          # runs its checks one at a time here instead of in parallel
          # background workers.
          - sys: CLANGARM64
            runner: windows-11-arm
            qb_jobs: 1

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}

      - name: Install packages
        shell: msys2 {0}
        run: |
          # A mirror that stalls or rate-limits (HTTP 429) fails pacman's
          # whole transaction; what it fetched stays in the cache, so a
          # retry fetches only the rest, one file at a time after a
          # growing wait so a shared runner's rate limit can clear.
          p=$MINGW_PACKAGE_PREFIX
          pkgs="base-devel git $p-gettext $p-gobject-introspection
            $p-graphite2 $p-p11-kit $p-qt6-base $p-x264 $p-cc"
          for i in 1 2 3 4 5; do
            pacman -S --noconfirm --needed $pkgs && exit 0
            [ $i = 5 ] && break
            echo "package install failed (attempt $i); retrying in $((30 * i))s, serial downloads"
            sed -i -e '/^#*ParallelDownloads/d' -e '/^\[options\]/a ParallelDownloads = 1' /etc/pacman.conf
            sleep $((30 * i))
          done
          exit 1

      - name: Configure and build RetroArch
        shell: msys2 {0}
        run: |
          echo "Building RetroArch in ${{ matrix.sys }} on ${{ matrix.runner }}"
          QB_JOBS=${{ matrix.qb_jobs }} ./configure
          make -j"$(nproc)" info all

      - name: Collect DLLs and binaries
        shell: msys2 {0}
        run: |
          echo "Collecting DLLs and binaries"
          rm -rf dist
          mkdir -p dist
          cp retroarch.exe dist/
          ldd retroarch.exe | grep "$MINGW_PREFIX" | awk '{print $3}' | xargs -I {} cp {} dist/ || true

      - name: Archive build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: retroarch-${{ matrix.sys }}
          path: dist/
