# Validates compilation of RetroArch binary

name: RetroArch CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  linux-c89: # Smoketest build using most restrictive compiler and default options
    runs-on: ubuntu-latest
    steps:
      - name: Dependencies
        timeout-minutes: 5
        run: |
          # libvulkan-dev brings the Vulkan driver, the slang shader stack
          # (shader_vulkan.c, slang_process.c, glslang_util.c, slang_cache.c)
          # and the Vulkan contexts into this lane; without it configure
          # drops them and none of those C files ever meet -std=c89.
          pkgs="build-essential libxkbcommon-dev libx11-xcb-dev libvulkan-dev zlib1g-dev libfreetype6-dev libegl1-mesa-dev libgles2-mesa-dev libgbm-dev nvidia-cg-toolkit nvidia-cg-dev libavcodec-dev libsdl2-dev libsdl-image1.2-dev libxml2-dev yasm"
          if dpkg -s $pkgs >/dev/null 2>&1; then
            echo "All packages already present on runner image; skipping apt."
            exit 0
          fi
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update failed (attempt $i); retrying in 10s"
            sleep 10
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $pkgs
      - name: Checkout
        uses: actions/checkout@v3
      - name: Configure
        run: ./configure
      - name: Build
        run: make C89_BUILD=1
      - name: Build Debug
        run: |
          make clean # making sure we don't have leftovers from previous build
          make DEBUG=1 GL_DEBUG=1 C89_BUILD=1 info all
