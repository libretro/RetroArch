name: CI RetroFW MIPS32

on:
  push:
    branches: [master]
  pull_request:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: reallibretroretroarch/libretro-build-dingux:odbeta
      options: --user root

    steps:
    - uses: actions/checkout@v4

    - name: Compile RA
      run: |
        make -j$(getconf _NPROCESSORS_ONLN) -f Makefile.retrofw clean
        make -j$(getconf _NPROCESSORS_ONLN) -f Makefile.retrofw info all

    - name: Get short SHA
      id: slug
      run: echo "::set-output name=sha8::$(echo ${GITHUB_SHA} | cut -c1-8)"

    - uses: actions/upload-artifact@v4
      with:
        name: retroarch_retrofw_mips32${{ steps.slug.outputs.sha8 }}
        path: |
          retroarch_retrofw.opk
