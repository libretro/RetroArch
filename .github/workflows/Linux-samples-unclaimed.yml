name: CI Linux samples [nothing else runs these]

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  samples-unclaimed:
    name: Samples no other job runs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APT_PKGS: build-essential gcc-mingw-w64-x86-64 wine64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apt cache key
        id: apt
        run: sh .github/workflows/scripts/apt-cache-key.sh "$APT_PKGS"

      - name: Restore apt cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      # Up front, bounded, for the samples cross-built with mingw-w64 and
      # run under Wine: installed inside the loop, a mirror that stalled
      # held the job, silent, until its 30 minutes ran out
      - name: Install dependencies
        timeout-minutes: 15
        run: sh .github/workflows/scripts/apt-install.sh $APT_PKGS

      - name: Save apt cache
        if: env.APT_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt.outputs.key }}

      - name: Link with lld
        run: sh .github/workflows/scripts/use-lld.sh

      - name: Run them
        shell: bash
        run: |
          set -eu
          # A sample that builds and runs, and that no workflow names,
          # is a test nobody runs: font_lifecycle sat that way while
          # its expectation drifted away from the font driver it was
          # written against. This job takes whatever is left over -
          # the list is computed, so a new sample joins it by existing
          # rather than by being remembered.
          #
          # Samples that need a library the runner does not carry
          # (SDL, FFmpeg, libusb) are skipped: their own workflows
          # install what they need. mingw-w64 and Wine come from the
          # install step, for the samples cross-built and run under Wine.
          fails=0
          for mk in $(find samples libretro-common/samples -name Makefile | sort); do
             dir=$(dirname "$mk")
             name=$(basename "$dir")
             (cd "$dir" && make -n check >/dev/null 2>&1) || continue
             if grep -rqlF "$name" .github/workflows/ 2>/dev/null; then
                continue
             fi
             if grep -qiE 'sdl|ffmpeg|libav|libusb' "$mk"; then
                echo "-- skip $dir (needs a library this job does not install)"
                continue
             fi
             echo "== $dir"
             if (cd "$dir" && make clean >/dev/null 2>&1 \
                 && ASAN_OPTIONS=detect_leaks=1:allocator_may_return_null=1 \
                    UBSAN_OPTIONS=print_stacktrace=1 \
                    timeout 300 make SANITIZER=address,undefined check); then
                echo "   ok"
             else
                echo "   FAIL $dir"
                fails=$((fails + 1))
             fi
             (cd "$dir" && make clean >/dev/null 2>&1) || true
          done
          if [ "$fails" -ne 0 ]; then
             echo "$fails sample(s) failed"
             exit 1
          fi
