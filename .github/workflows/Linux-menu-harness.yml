name: CI Linux menu harness

# The menu playlist navigation harness links the SHIPPING RetroArch
# objects with only main() replaced, so unlike every other sample it
# needs a full build of the program before it can be built at all.
#
# That is why it lives in its own workflow rather than in
# Linux-samples-tasks: a full build does not fit inside that job's
# ten-minute budget, and putting it there cancelled the whole job -
# every other sample with it - rather than just failing its own step.
# Here it can take the time it needs without being able to take
# anything else down with it.
#
# It also needs a NON-Qt build: with Qt enabled main() lives in
# ui_qt.o and drags the entire Qt UI in with it.

on:
  push:
    paths:
      - 'menu/**'
      - 'playlist.c'
      - 'playlist.h'
      - 'tasks/task_content*'
      - 'samples/menu/playlist_nav/**'
      - 'samples/menu/nav_repeat_stall/**'
      - 'runloop.c'
      - 'samples/menu/network_settings/**'
      - 'intl/msg_hash_lbl.h'
      - 'msg_hash_lbl_str.h'
      - 'samples/menu/resolution_reset/**'
      - 'samples/settings/packed_rows/**'
      - 'setting_list.h'
      - 'gfx/video_defines.h'
      - '.github/workflows/Linux-menu-harness.yml'
  pull_request:
    paths:
      - 'menu/**'
      - 'playlist.c'
      - 'playlist.h'
      - 'tasks/task_content*'
      - 'samples/menu/playlist_nav/**'
      - 'samples/menu/nav_repeat_stall/**'
      - 'runloop.c'
      - 'samples/menu/network_settings/**'
      - 'intl/msg_hash_lbl.h'
      - 'msg_hash_lbl_str.h'
      - 'samples/menu/resolution_reset/**'
      - 'samples/settings/packed_rows/**'
      - 'setting_list.h'
      - 'gfx/video_defines.h'
      - '.github/workflows/Linux-menu-harness.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  menu-harness:
    name: Build and run the menu navigation harness
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          pkgs="build-essential zlib1g-dev"
          if dpkg -s $pkgs >/dev/null 2>&1; then
            echo "All packages already present on runner image; skipping apt."
            exit 0
          fi
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update failed (attempt $i); retrying in 10s"
            sleep 10
          done
          # Fetch first, under a bound: a download is safe to stop and
          # resumes, an install is not. A mirror that stalls is left for
          # the main archive on the next attempt.
          for i in 1 2 3; do
            sudo timeout 240 apt-get install -y --download-only \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              $pkgs && break
            [ $i = 3 ] && exit 1
            echo "package download failed or stalled (attempt $i); retrying from archive.ubuntu.com"
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              [ -f "$f" ] || continue
              sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' \
                -e 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            done
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-

      - name: Enable ccache
        run: |
          set -eu
          command -v ccache >/dev/null 2>&1 || sudo apt-get install -y -qq ccache
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 500M
          ccache -z

      - name: Build RetroArch headless
        shell: bash
        run: |
          set -eu
          # The harness drives the menu with the null drivers, so
          # everything that draws or talks to the network is dead
          # weight here - and building it is the entire cost of this
          # workflow.  Disabling it takes the build from roughly ten
          # minutes to about three, and avoids depending on graphics
          # packages the runner may or may not carry: configure found
          # X11 and xcb but not libX11-xcb, and the link failed on
          # -lX11-xcb.
          #
          # Qt in particular has to go: with it enabled main() lives
          # in ui_qt.o, and the harness replaces main().
          # Networking stays on: the network settings harness below
          # needs the SMB and NFS client screens compiled in.
          ./configure --disable-qt --disable-x11 \
                      --disable-opengl --disable-opengl_core \
                      --disable-opengl1 --disable-vulkan \
                      --disable-cheevos \
                      --disable-ffmpeg
          make -j$(nproc)

      - name: Build and run content_closing_test
        shell: bash
        run: |
          set -eu
          # The guard that keeps the frame loop out of a core being
          # torn down (core_run() refusing retro_run() while
          # content_closing is set) cannot fire in shipped code yet:
          # closing is still synchronous, so no frame runs during it.
          # It goes live in the change that first lets frames run
          # during a close, and if it is wrong the symptom is a call
          # into an unloaded dylib - so it is driven here directly,
          # against the real core_run() in a real frontend, rather
          # than going live untested.
          #
          # Shares the non-Qt build made above; adds about a second.
          samples/runloop/content_closing/build.sh
          ./samples/runloop/content_closing/content_closing_test
          make -C samples/runloop/content_closing clean

      - name: Build and run menu_playlist_nav_test
        shell: bash
        run: |
          set -eu
          # Four field reports came out of the seam between the
          # playlist reader and the menu - a stale playlist's entries
          # under a new heading, then a blank list the back button
          # could not leave, then a list that filled only after the
          # user pressed something, then #19427's placeholder flashing
          # on every completed read - and no oracle that stopped at
          # the reader could see any of them.
          #
          # The harness installs a VFS through the seam the frontend
          # uses for SAF, returning short reads WITH a per-read delay.
          # Short reads alone reproduce SAF's syscall count but not
          # its latency, and on local storage the whole playlist still
          # fits inside one budget slice - which is exactly why none
          # of the three reports reproduced on a desktop.
          samples/menu/playlist_nav/build.sh
          ./samples/menu/playlist_nav/menu_playlist_nav_test
          make -C samples/menu/playlist_nav clean

      - name: Build and run menu_nav_repeat_stall_test
        shell: bash
        run: |
          set -eu
          # One press on a menu entry whose frame stalls - Ozone and
          # XMB build a large playlist synchronously when the selection
          # lands on it - has to move the selection once. The menu acts
          # on input one poll old, so the hold time has to be measured
          # between polls or the stall fires an auto-repeat. Drives the
          # real runloop with a scripted input driver; also checks that
          # a hold across the stall still repeats and that a steady hold
          # waits out the initial scroll delay. Shares the non-Qt build
          # made above.
          samples/menu/nav_repeat_stall/build.sh
          ./samples/menu/nav_repeat_stall/menu_nav_repeat_stall_test
          make -C samples/menu/nav_repeat_stall clean

      - name: Build and run menu_network_settings_test
        shell: bash
        run: |
          set -eu
          # The NFS Network Settings entry opened an empty "null"
          # browser: the label its deferred list is pushed with had no
          # row in msg_hash_lbl.h, so it resolved to "null" and the
          # push found nothing. The harness resolves the SMB and NFS
          # labels, opens Settings > Network and both screens through
          # the real dispatch, and checks the Quick Menu no longer
          # carries the two entries.
          samples/menu/network_settings/build.sh
          ./samples/menu/network_settings/menu_network_settings_test
          make -C samples/menu/network_settings clean

      - name: Build and run resolution_reset_test
        shell: bash
        run: |
          set -eu
          # Start on the Resolution entry reinits and sets the video
          # mode at the output size; it must keep the window state the
          # frontend is in rather than take a windowed desktop session
          # full screen. Shares the non-Qt build made above.
          samples/menu/resolution_reset/build.sh
          ./samples/menu/resolution_reset/resolution_reset_test
          make -C samples/menu/resolution_reset clean

      - name: Build and run packed_rows_test
        shell: bash
        run: |
          set -eu
          # Settings rows that each own one half of a packed settings_t
          # word - the custom viewport's origin and size, the window
          # size pair - driven through their display strings, a right
          # press and the dropdown list. Each row has to show and set
          # its own axis and leave its partner as it stands. Shares the
          # non-Qt build made above.
          samples/settings/packed_rows/build.sh
          ./samples/settings/packed_rows/packed_rows_test
          make -C samples/settings/packed_rows clean

      - name: Hot function budget
        shell: bash
        run: |
          set -eu
          # Code size and stack frame of the functions that run every
          # frame, against a checked-in reference: a change that doubles
          # either passes every lane in the suite and shows up only as a
          # slower frame on someone's machine. Uses the release objects
          # this job already built.
          .github/workflows/scripts/hot-function-budget.sh

      - name: Lock budget
        shell: bash
        run: |
          set -eu
          # Lock acquisitions on the paths meant to take none, or a
          # counted few, against tools/lock_acquire_budget.ref: a lock
          # put back on a per-frame path passes every lane and shows up
          # only as a slower frame. Same release objects as above; this
          # build has no Vulkan, so the Vulkan entries report SKIP.
          tools/lock_acquire_budget.sh

      - name: Build and run threaded_video_test
        shell: bash
        run: |
          set -eu
          # The threaded video wrapper against the real runloop, on the
          # same non-Qt menu build: the runtime toggle, reinit under the
          # wrapper, the command mailbox, presenter repeats, and the
          # font init/free marshalling - the last of which is where a
          # deferred font free unbound the video thread's GL context on
          # X11 and left every frame after it black. This build has no
          # allocator sanitizer, so it is also the one job where the
          # frame-path heap lane runs: it counts heap calls over three
          # hundred frames, threaded and not, and the frame path makes
          # none.
          samples/gfx/threaded_video/build.sh
          ./samples/gfx/threaded_video/threaded_video_test 3
          make -C samples/gfx/threaded_video clean

      - name: Build and run content_load_test
        shell: bash
        run: |
          set -eu
          # The content load as a chain of main-thread tasks, against the
          # real runloop on the same non-Qt menu build: frames presented
          # between stages, one load at a time, a core's reinit deferred
          # to the load's driver stage, the dummy-core fallback, a
          # hardware-render request carried across the driver rebuild,
          # the task queue surviving the load, and the close waiting out
          # a save state from the frame loop.
          samples/tasks/content_load/build.sh
          ./samples/tasks/content_load/content_load_test
          make -C samples/tasks/content_load clean

      - name: Build and run explore_build_test
        shell: bash
        run: |
          set -eu
          # The Explore index built in steps: one item per step hashes
          # the same as the build in one go, and the explore task returns
          # unfinished across checks with Threaded Tasks off.
          samples/menu/explore_build/build.sh
          ./samples/menu/explore_build/explore_build_test
          make -C samples/menu/explore_build clean
